<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050A06">
<script>try{document.documentElement.dataset.skin=JSON.parse(localStorage.getItem("fq-skin"))||"hacker"}catch(e){document.documentElement.dataset.skin="hacker"}</script>
<title>FISI Lerntrainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;--sans:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
/* Skin: Terminal (grün/schwarz) – Standard */
:root,:root[data-skin="hacker"]{
  --bg:#050A06;--bar:#07110A;--card:#0B170E;--card2:#11251A;--line:#1C3C25;--deep:#020502;--grid:rgba(57,255,106,.05);
  --acc:#39FF6A;--acc-d:#128A33;--acc2:#B8FF5C;--on:#021A08;--ink:#D2FFDC;--muted:#62A274;--dim:#2B4B34;
  --ok:#39FF6A;--ok-d:#128A33;--ok-bg:#08290F;--bad:#FF4D5E;--bad-d:#9E1F2D;--bad-bg:#2B070C;
  --glow:0 0 14px rgba(57,255,106,.35);--r:6px;--r-lg:10px;--r-node:10px;--ui:var(--mono);--text:var(--mono)}
:root[data-skin="classic"]{
  --bg:#000000;--bar:#0B0B0B;--card:#161616;--card2:#202020;--line:#2E2E2E;--deep:#070707;--grid:transparent;
  --acc:#FFFFFF;--acc-d:#707070;--acc2:#FFFFFF;--on:#000000;--ink:#FFFFFF;--muted:#9C9C9C;--dim:#444444;
  --ok:#4ADE80;--ok-d:#1F8A4C;--ok-bg:#0C2616;--bad:#F87171;--bad-d:#A33A3A;--bad-bg:#2A0D0D;
  --glow:none;--r:14px;--r-lg:20px;--r-node:22px;--ui:var(--sans);--text:var(--sans)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark}
:root{--lav:var(--acc);--yel:var(--acc2);--coin:var(--acc);--navy:var(--deep)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:16.5px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:var(--r)}
[hidden]{display:none!important}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
svg{display:block}
[data-skin="hacker"] .glowt{text-shadow:0 0 10px rgba(57,255,106,.45)}

/* ---------- Login ---------- */
#vLogin{min-height:100vh;display:flex;align-items:center}
#vLogin .wrap{width:100%;padding-top:40px;padding-bottom:40px}
.logo{width:72px;height:72px;margin-bottom:22px}
.logo .lb{fill:var(--acc)} .logo .lf{fill:none;stroke:var(--on);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.lt{font-family:var(--mono);font-size:1.9rem;font-weight:800;line-height:1.1;margin:0 0 8px;color:var(--acc)}
.lsub{color:var(--muted);margin:0 0 26px}
.in{width:100%;font:inherit;font-size:1.05rem;padding:15px 16px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--deep);color:var(--ink);font-family:var(--mono)}
.in::placeholder{color:var(--dim)}
.in:focus{border-color:var(--acc);outline:none;box-shadow:var(--glow)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:var(--r);background:var(--acc);color:var(--on);font-family:var(--ui);font-weight:800;font-size:1.02rem;box-shadow:0 4px 0 var(--acc-d);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--acc-d)}
.btn:disabled{background:var(--card2);color:var(--dim);box-shadow:0 4px 0 var(--deep);cursor:not-allowed}
.btn.sec{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line),0 4px 0 var(--deep)}
.btn.ok{background:var(--ok);color:var(--on);box-shadow:0 4px 0 var(--ok-d)}
.btn.bad{background:var(--bad);color:#1A0306;box-shadow:0 4px 0 var(--bad-d)}
.plist{display:grid;gap:8px;margin-top:10px}
.prow{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--card);border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--line)}
.prow .open{flex:1;display:flex;align-items:center;gap:12px;text-align:left;font-weight:700}
.av{flex:none;width:36px;height:36px;border-radius:var(--r);background:var(--acc);color:var(--on);display:grid;place-items:center;font-weight:800;font-family:var(--mono)}
.prow .x{color:var(--muted);padding:6px 8px;font-size:1.2rem}
.note{font-size:.84rem;color:var(--muted);margin-top:22px}
.h2{font-size:.95rem;font-weight:700;margin:26px 0 4px;color:var(--muted);font-family:var(--mono)}
.skinpick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sk{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:var(--r);box-shadow:inset 0 0 0 1.5px var(--line);text-align:left;background:var(--card)}
.sk[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--acc)}
.sk .pv{height:46px;border-radius:6px;display:flex;align-items:center;padding:0 10px;font-family:var(--mono);font-weight:700;font-size:.8rem}
.sk .pv.h{background:#050A06;color:#39FF6A;box-shadow:inset 0 0 0 1px #1C3C25}
.sk .pv.c{background:#000;color:#fff;box-shadow:inset 0 0 0 1px #2E2E2E;font-family:var(--sans)}
.sk b{font-size:.9rem}

/* ---------- Kopfleiste ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--bar);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 0}
.chip{display:flex;align-items:center;justify-content:center;gap:8px;height:44px;border-radius:var(--r);background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-family:var(--mono);font-weight:700;font-size:1rem}
.chip svg{width:24px;height:24px}
.chip .tag{font-size:.72rem;font-weight:800;padding:2px 5px;border-radius:4px;background:var(--acc);color:var(--on)}
.ring-bg{fill:none;stroke:var(--line);stroke-width:4}.ring{fill:none;stroke:var(--acc);stroke-width:4;stroke-linecap:round}
.fl{fill:var(--dim)}.fl.on{fill:var(--acc)}

/* ---------- Lernpfad ---------- */
#tabLearn{background:var(--bg);min-height:calc(100vh - 150px)}
.chead{position:sticky;top:calc(65px + env(safe-area-inset-top,0px));z-index:10;padding:12px 0 8px;background:linear-gradient(var(--bg) 85%,transparent)}
.ccard{display:block;width:100%;text-align:left;padding:14px 18px 16px;border-radius:var(--r-lg);background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line)}
.ccard .cs{color:var(--muted);font-size:.85rem;font-family:var(--mono)}
.ccard .ct{font-family:var(--mono);font-weight:800;font-size:1.35rem;margin:4px 0 12px;line-height:1.2;display:flex;align-items:center;gap:10px}
.ccard .ct .sw2{margin-left:auto;font-size:.78rem;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:var(--r);padding:3px 8px}
.pbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.pbar i{display:block;width:0;height:100%;border-radius:4px;background:var(--acc)}
[data-skin="hacker"] .pbar i{background:repeating-linear-gradient(90deg,var(--acc) 0 8px,transparent 8px 10px);border-radius:0}
.path{position:relative;margin:6px -16px 0;padding:20px 0 60px;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
.path svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.path .ln{fill:none;stroke:var(--line);stroke-width:4;stroke-linecap:round}
.path .ln.on{stroke:var(--acc)}
.path .pad{fill:var(--bg);stroke:var(--line);stroke-width:3}.path .pad.on{stroke:var(--acc)}
.node{position:absolute;width:84px;height:84px;margin-left:-42px;border-radius:var(--r-node);display:grid;place-items:center;transition:transform .1s}
.node:active{transform:translateY(3px)}
.node svg{width:38px;height:38px}
.node.done{background:var(--acc);color:var(--on);box-shadow:0 7px 0 var(--acc-d),var(--glow)}
.node.cur{background:var(--card2);color:var(--acc);box-shadow:inset 0 0 0 2px var(--acc),0 7px 0 var(--deep),var(--glow)}
.node.cur::after{content:"";position:absolute;inset:-9px;border-radius:calc(var(--r-node) + 6px);border:2px dashed var(--acc);opacity:.6}
.node.lock{background:var(--deep);color:var(--dim);box-shadow:inset 0 0 0 2px var(--line),0 7px 0 #000}
.node .crown{position:absolute;right:-8px;top:-10px;background:var(--acc2);color:var(--on);font-size:.66rem;font-weight:800;border-radius:4px;padding:1px 5px;font-family:var(--mono)}
.node .nn{position:absolute;bottom:-26px;left:50%;transform:translateX(-50%);font-size:.7rem;font-family:var(--mono);color:var(--muted);white-space:nowrap}
.tdiv{position:absolute;left:0;right:0;padding:4px 16px;background:var(--bg);font-family:var(--mono);font-size:.82rem;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:10px}
.tdiv::after{content:"";flex:1;height:1px;background:var(--line)}
[data-skin="hacker"] .tdiv::before{content:"//";color:var(--acc-d)}
.pathend{position:absolute;left:50%;transform:translateX(-50%);text-align:center;width:80%;color:var(--muted);font-size:.9rem}

/* ---------- Tabbar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bar);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in2{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 11px;color:var(--dim);font-size:.74rem;font-weight:700;font-family:var(--ui)}
.tab svg{width:26px;height:26px}
.tab[aria-current="page"]{color:var(--acc)}
.tab .hole{fill:var(--bar)}
main.tabv{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}

/* ---------- Seiten ---------- */
.ptitle{font-family:var(--mono);font-weight:800;font-size:1.5rem;margin:20px 0 4px;color:var(--acc)}
.psub{color:var(--muted);margin:0 0 16px}
.tile{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px;border-radius:var(--r-lg);background:var(--card);box-shadow:inset 0 0 0 1px var(--line);margin-bottom:10px}
.tile .ic{flex:none;width:48px;height:48px;border-radius:var(--r);display:grid;place-items:center;background:var(--card2);color:var(--acc)}
.tile .ic svg{width:26px;height:26px}
.tile b{display:block;font-size:1rem;font-family:var(--ui)}
.tile span.s{display:block;color:var(--muted);font-size:.88rem;line-height:1.3;margin-top:2px}
.tile .go{margin-left:auto;color:var(--muted)}.tile .go svg{width:22px;height:22px}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
#sScope{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px 10px;padding:0 16px 4px;scrollbar-width:none}#sScope::-webkit-scrollbar{display:none}#sScope .pill{flex:none}
.pill{padding:7px 13px;border-radius:var(--r);background:var(--card);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);font-size:.86rem;font-weight:700;font-family:var(--ui)}
.pill[aria-pressed="true"]{background:var(--acc);color:var(--on);box-shadow:none}
.sbox{position:sticky;top:calc(65px + env(safe-area-inset-top,0px));z-index:10;background:var(--bg);padding:12px 0 8px}
.sfield{display:flex;align-items:center;gap:10px;padding:0 14px;border-radius:var(--r);background:var(--deep);box-shadow:inset 0 0 0 1.5px var(--line)}
.sfield:focus-within{box-shadow:inset 0 0 0 1.5px var(--acc),var(--glow)}
.sfield input{flex:1;min-width:0;font:inherit;font-family:var(--mono);padding:13px 0;border:0;background:none;color:var(--ink);outline:none}
.sfield svg{width:20px;height:20px;color:var(--acc);flex:none}
.hits{font-size:.84rem;color:var(--muted);margin:2px 0 10px;font-family:var(--mono)}
.qrow{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px;border-radius:var(--r);background:var(--card);box-shadow:inset 0 0 0 1px var(--line);margin-bottom:8px}
.num{flex:none;min-width:56px;text-align:center;padding:3px 6px;border-radius:5px;background:var(--deep);box-shadow:inset 0 0 0 1px var(--line);color:var(--acc2);font-family:var(--mono);font-weight:800;font-size:.84rem}
.qrow .qt{font-weight:600;line-height:1.35}
.qrow .qm{font-size:.78rem;color:var(--muted);margin-top:3px;font-family:var(--mono)}
.more{display:block;margin:10px auto 0;color:var(--acc);font-weight:700;padding:10px;font-family:var(--mono)}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r);background:var(--card);box-shadow:inset 0 0 0 1px var(--line);margin-bottom:8px}
.lrow.me{box-shadow:inset 0 0 0 2px var(--acc)}
.rank{width:28px;text-align:center;font-family:var(--mono);font-weight:800;color:var(--muted)}
.lrow .n{flex:1;font-weight:700}
.lrow .xp{font-family:var(--mono);font-weight:800;color:var(--acc)}
.phead{display:flex;align-items:center;gap:16px;margin:20px 0 16px}
.phead .av{width:60px;height:60px;font-size:1.5rem}
.phead h1{font-family:var(--mono);font-size:1.4rem;margin:0;color:var(--acc)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{padding:12px 14px;border-radius:var(--r);background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.stat b{display:block;font-family:var(--mono);font-size:1.3rem;color:var(--acc)}
.stat span{font-size:.82rem;color:var(--muted)}
.box{padding:16px;border-radius:var(--r-lg);background:var(--card);box-shadow:inset 0 0 0 1px var(--line);margin-top:10px}
.box h3{margin:0 0 10px;font-size:.95rem;font-family:var(--mono);color:var(--acc)}
.crow{margin-bottom:12px}
.crow .l{display:flex;justify-content:space-between;font-size:.88rem;margin-bottom:5px}
.sw{display:flex;align-items:center;gap:12px;padding:10px 0;cursor:pointer}
.sw span{flex:1}
.sw input{width:22px;height:22px;accent-color:var(--acc)}
textarea{width:100%;min-height:110px;font:12px/1.4 var(--mono);padding:10px;border-radius:var(--r);border:1px solid var(--line);background:var(--deep);color:var(--ink)}
details.io summary{cursor:pointer;font-weight:700;padding:4px 0}

/* ---------- Vollbild ---------- */
.full{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.full>.wrap{padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.xbtn{width:44px;height:44px;display:grid;place-items:center;margin-left:-8px;color:var(--muted)}
.xbtn svg{width:28px;height:28px}
.kt{display:flex;align-items:flex-end;gap:12px;margin:16px 0 20px}
.kt .k1{flex:1}
.kt small{color:var(--muted);font-family:var(--mono);font-size:.9rem}
.kt h1{font-family:var(--mono);font-size:1.9rem;line-height:1.1;margin:6px 0 0;color:var(--acc)}
.swap{flex:none;width:56px;height:56px;border-radius:var(--r);background:var(--card2);box-shadow:inset 0 0 0 1.5px var(--line);display:grid;place-items:center;color:var(--acc)}
.swap svg{width:30px;height:30px}
.cert{display:flex;gap:16px;align-items:center;padding:16px;border-radius:var(--r-lg);box-shadow:inset 0 0 0 1.5px var(--line);background:var(--card)}
.cert svg.badge{width:64px;height:78px;flex:none}
.badge .b1{fill:var(--acc2)}.badge .b2{fill:var(--acc)}.badge .b3{fill:var(--deep)}.badge .b4{fill:var(--acc)}.badge text{fill:var(--on)}
.cert .cb{flex:1}
.cert h2{margin:0 0 10px;font-size:1.15rem;font-family:var(--ui)}
.cert .cl{display:flex;justify-content:space-between;color:var(--muted);font-size:.88rem;margin-top:8px;font-family:var(--mono)}
.pace{display:grid;grid-template-columns:1fr 1fr;margin-top:12px;box-shadow:inset 0 0 0 1.5px var(--line);border-radius:var(--r-lg);padding:12px 0;background:var(--card)}
.pace>div{padding:0 16px;min-width:0}
.pace>div+div{border-left:1.5px solid var(--line)}
.pace small{display:block;color:var(--muted);font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pace b{font-family:var(--mono);font-size:1.25rem;color:var(--acc)}
.pace button{width:100%;text-align:left}
hr.sep{border:0;border-top:1px solid var(--line);margin:20px -16px}
.chi{position:relative;display:flex;gap:14px;width:100%;text-align:left;padding:14px 12px;border-radius:var(--r-lg);margin-bottom:10px}
.chi.cur{background:var(--card);box-shadow:inset 0 0 0 1.5px var(--acc)}
.chi .dot{flex:none;width:50px;height:50px;border-radius:var(--r);display:grid;place-items:center;font-family:var(--mono);font-weight:800;font-size:1rem;background:var(--deep);box-shadow:inset 0 0 0 2px var(--line);color:var(--muted);position:relative;z-index:1}
.chi.done .dot{background:var(--acc);box-shadow:var(--glow);color:var(--on)}
.chi.part .dot{box-shadow:inset 0 0 0 2px var(--acc);color:var(--acc)}
.chi .dot svg{width:26px;height:26px}
.chi h3{margin:4px 0 2px;font-size:1.1rem;font-family:var(--ui)}
.chi p{margin:0;color:var(--muted);font-size:.92rem;line-height:1.35}
.chi .mini{margin-top:8px;height:5px;border-radius:3px;background:var(--line);overflow:hidden;max-width:220px}
.chi .mini i{display:block;height:100%;background:var(--acc)}
.chi:not(:last-child)::after{content:"";position:absolute;left:36px;top:66px;bottom:-12px;width:2px;background:var(--line)}
.chi.done:not(:last-child)::after{background:var(--acc)}
.shade{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:85vh;overflow-y:auto;background:var(--bar);box-shadow:inset 0 1.5px 0 var(--line);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 6px;font-size:1.2rem;font-family:var(--ui);color:var(--acc)}
.sheet p{margin:0 0 14px}
.sheet .btn+.btn{margin-top:12px}

/* ---------- Lektion ---------- */
#vLesson>.wrap{min-height:100vh;display:flex;flex-direction:column}
.lhead{display:flex;align-items:center;gap:12px}
.lhead .pbar{flex:1;height:12px;border-radius:6px}
.lhead .pbar i{transition:width .3s}
.bm{width:40px;height:40px;display:grid;place-items:center;color:var(--muted)}
.bm svg{width:24px;height:24px}
.bm[aria-pressed="true"]{color:var(--acc2)}
.bm[aria-pressed="true"] svg path{fill:currentColor}
.timer{font-family:var(--mono);font-weight:800;color:var(--acc2);min-width:52px;text-align:right}
.qmeta{display:flex;gap:8px;align-items:center;margin:24px 0 10px;font-size:.84rem;color:var(--muted);font-family:var(--mono)}
.qmeta .num{min-width:0}
.qtext{font-size:1.28rem;font-weight:700;line-height:1.38;margin:0 0 20px;font-family:var(--ui)}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:14px;border-radius:var(--r);background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line),0 3px 0 var(--deep);font-weight:600;line-height:1.35}
.opt .k{flex:none;width:28px;height:28px;border-radius:5px;display:grid;place-items:center;background:var(--deep);box-shadow:inset 0 0 0 1px var(--line);font-family:var(--mono);font-weight:800;font-size:.82rem;color:var(--muted)}
.opt.sel{box-shadow:inset 0 0 0 2px var(--acc),0 3px 0 var(--acc-d)}
.opt.sel .k{background:var(--acc);color:var(--on)}

/* ================= Daten ================= */
const GROUPS=[
 ["Hardware",[["g","Computer-Grundlagen"],["zs","Zahlensysteme & Einheiten"],["cpu","CPU"],["ram","Arbeitsspeicher"],["mb","Mainboard & UEFI"],["sp","Speicher & Dateisysteme"],["raid","RAID & Datensicherung"],["gpu","Grafikkarte"],["nt","Netzteil, Strom & USV"],["kue","Kühlung"],["ans","Anschlüsse"],["per","Peripherie & Drucker"]]],
 ["Systeme & Server",[["os","Betriebssysteme"],["lin","Linux-Praxis"],["win","Windows & Active Directory"],["vm","Virtualisierung & Container"],["srv","Server & Dienste"],["cld","Cloud"]]],
 ["Netzwerk",[["net","Netzwerk-Grundlagen"],["osi","OSI- & TCP/IP-Modell"],["ip","IP-Adressen & Subnetting"],["pro","Protokolle & Ports"],["nd","Netzwerkgeräte, VLAN & WLAN"],["iot","IoT"]]],
 ["Sicherheit & Recht",[["sec","IT-Sicherheit"],["ds","Datenschutz & DSGVO"]]],
 ["Wirtschaft & Betrieb",[["pm","Projektmanagement & Wirtschaft"],["itsm","IT-Support & ITIL"]]],
 ["Software & Daten",[["prog","Programmier-Grundlagen"],["dbq","Datenbanken & SQL"]]]
];
const BADGE=["HW","SYS","NET","SEC","BWL","DEV"];
const TNAME={};GROUPS.forEach(g=>g[1].forEach(t=>TNAME[t[0]]=t[1]));
const INTRO={
zs:[
{t:"Warum gibt es verschiedene Zahlensysteme?",b:"Alle Zahlensysteme funktionieren nach demselben Prinzip: Jede Stelle hat einen Wert, und die Ziffer sagt, wie oft dieser Wert vorkommt.\n\nIm Dezimalsystem (Basis 10) sind die Stellenwerte 1, 10, 100, 1000 …\nBeispiel: 345 = 3 × 100 + 4 × 10 + 5 × 1\n\nComputer rechnen im Binärsystem (Basis 2), weil Elektronik nur zwei Zustände sicher unterscheidet: Strom an (1) oder aus (0).\n\nDas Hexadezimalsystem (Basis 16) ist eine Kurzschrift für Binärzahlen. Aus 1111 1111 wird einfach FF.\nMerke: Nur die Basis ändert sich – das Prinzip „Ziffer × Stellenwert“ bleibt immer gleich."},
{t:"Binärzahlen lesen",b:"Im Binärsystem gibt es nur die Ziffern 0 und 1. Jede Stelle ist doppelt so viel wert wie die rechts daneben.\n\nStellenwerte bei 8 Bit, von links nach rechts:\n128 · 64 · 32 · 16 · 8 · 4 · 2 · 1\n\nSo rechnest du: Überall, wo eine 1 steht, zählst du den Stellenwert dazu. Wo eine 0 steht, zählst du nichts.\n\nBeispiel: 0000 1011\nDie Einsen stehen bei 8, 2 und 1 → 8 + 2 + 1 = 11\n\nBeispiel: 1100 0000\nDie Einsen stehen bei 128 und 64 → 128 + 64 = 192\n\nTipp: Die Stellenwerte kannst du dir jederzeit selbst bauen: bei 1 anfangen und nach links immer verdoppeln."},
{t:"Dezimal → Binär umrechnen",b:"Am einfachsten ist die Methode „Stellenwerte abziehen“.\n\nGehe die Stellenwerte von groß nach klein durch: 128, 64, 32, 16, 8, 4, 2, 1.\nPasst der Stellenwert noch in deine Zahl? Dann schreibe eine 1 und ziehe ihn ab. Wenn nicht, schreibe eine 0.\n\nBeispiel: 45\n128 passt nicht → 0\n64 passt nicht → 0\n32 passt → 1, Rest 45 − 32 = 13\n16 passt nicht → 0\n8 passt → 1, Rest 13 − 8 = 5\n4 passt → 1, Rest 5 − 4 = 1\n2 passt nicht → 0\n1 passt → 1, Rest 0\n\nErgebnis: 0010 1101\n\nKontrolle: 32 + 8 + 4 + 1 = 45 ✓"},
{t:"Hexadezimalzahlen lesen",b:"Hexadezimal hat 16 Ziffern. Weil es nur 10 normale Ziffern gibt, nimmt man ab 10 Buchstaben:\nA = 10, B = 11, C = 12, D = 13, E = 14, F = 15\n\nDie Stellenwerte bei zwei Stellen sind:\n16er-Stelle · 1er-Stelle\n\nSo rechnest du: linke Ziffer × 16, rechte Ziffer × 1, dann addieren.\n\nBeispiel: 0x2F\n2 steht an der 16er-Stelle → 2 × 16 = 32\nF steht an der 1er-Stelle → F = 15 → 15 × 1 = 15\n32 + 15 = 47\n\nBeispiel: 0x85\n8 × 16 = 128, dazu 5 → 133\n\nMerke: 0x10 ist 16 (nicht zehn!), 0xFF ist 255. Das „0x“ davor zeigt nur an, dass es eine Hex-Zahl ist."},
{t:"Dezimal → Hex umrechnen",b:"Frage dich: Wie oft passt 16 in die Zahl? Das ist die linke Ziffer. Was übrig bleibt, ist die rechte Ziffer.\n\nDie 16er-Reihe hilft dabei:\n16, 32, 48, 64, 80, 96, 112, 128, 144, 160, 176, 192, 208, 224, 240\n\nBeispiel: 200\nDie größte Zahl der 16er-Reihe bis 200 ist 192 = 12 × 16\nLinke Ziffer: 12 → C\nRest: 200 − 192 = 8 → rechte Ziffer 8\nErgebnis: 0xC8\n\nBeispiel: 75\n64 = 4 × 16 passt, Rest 11 → B\nErgebnis: 0x4B\n\nKontrolle immer rückwärts: 4 × 16 + 11 = 75 ✓"},
{t:"Binär ↔ Hex: der Nibble-Trick",b:"Eine Hex-Ziffer entspricht genau 4 Bit (einem „Nibble“). Deshalb musst du gar nicht über Dezimal gehen.\n\nSo geht's: Teile die 8 Bit in zwei Hälften zu je 4 Bit. Jede Hälfte rechnest du mit den Stellenwerten 8 · 4 · 2 · 1 aus und schreibst sie als Hex-Ziffer.\n\nBeispiel: 1100 1000\nLinke Hälfte 1100 → 8 + 4 = 12 → C\nRechte Hälfte 1000 → 8 → 8\nErgebnis: 0xC8\n\nRückwärts geht es genauso: Jede Hex-Ziffer wird zu 4 Bit.\nBeispiel: 0x3E → 3 = 0011, E = 14 = 1110 → 0011 1110\n\nMerke: Diese Muster kommen ständig vor:\n1000 = 8, 1010 = A, 1100 = C, 1111 = F"},
{t:"Bit, Byte und Einheiten",b:"1 Byte = 8 Bit.\n\nDezimale Einheiten (k, M, G, T) rechnen mit 1000:\n1 kB = 1000 Byte, 1 MB = 1000 kB, 1 GB = 1000 MB\n\nBinäre Einheiten (Ki, Mi, Gi, Ti) rechnen mit 1024:\n1 KiB = 1024 Byte, 1 MiB = 1024 KiB, 1 GiB = 1024 MiB\n\nBeispiel: Eine „1-TB“-Festplatte zeigt Windows nur mit ca. 931 GB an, weil Windows binär rechnet, aber „GB“ dranschreibt.\n\nNetzwerkgeschwindigkeiten stehen in Bit pro Sekunde, Dateigrößen in Byte.\nBeispiel: 100 Mbit/s ÷ 8 = 12,5 MB/s\n\nMerke: Kleines b = Bit, großes B = Byte."}
],
ip:[
{t:"Aufbau einer IPv4-Adresse",b:"Eine IPv4-Adresse hat 32 Bit, aufgeteilt in 4 Blöcke (Oktette) zu je 8 Bit. Jedes Oktett geht von 0 bis 255.\n\nBeispiel: 192.168.1.20\n\nJede Adresse besteht aus zwei Teilen:\nNetzanteil – welches Netz\nHostanteil – welches Gerät in diesem Netz\n\nDie Zahl hinter dem Schrägstrich sagt, wie viele Bit zum Netzanteil gehören.\nBeispiel: 192.168.1.20/24 → die ersten 24 Bit (192.168.1) sind das Netz, die letzten 8 Bit (.20) das Gerät."},
{t:"Von /xx zur Subnetzmaske",b:"/xx bedeutet: Die ersten xx Bit der Maske sind 1, der Rest ist 0.\n\nVolle Oktette sind 255. Für ein angebrochenes Oktett brauchst du diese Werte (Einsen von links):\n1 Bit = 128\n2 Bit = 192\n3 Bit = 224\n4 Bit = 240\n5 Bit = 248\n6 Bit = 252\n7 Bit = 254\n8 Bit = 255\n\nBeispiel: /26\n26 = 8 + 8 + 8 + 2 → drei volle Oktette und 2 Bit im vierten\n→ 255.255.255.192\n\nBeispiel: /20\n20 = 8 + 8 + 4 → 255.255.240.0"},
{t:"Wie viele Hosts passen ins Netz?",b:"Anzahl der Host-Bits = 32 − Präfix\nAdressen im Netz = 2 hoch Host-Bits\nDavon gehen immer 2 ab: die Netzadresse (erste) und der Broadcast (letzte).\n\nFormel: Hosts = 2^(32 − Präfix) − 2\n\nBeispiel: /24 → 8 Host-Bits → 2^8 = 256 → 256 − 2 = 254 Hosts\nBeispiel: /26 → 6 Host-Bits → 2^6 = 64 → 62 Hosts\nBeispiel: /30 → 2 Host-Bits → 4 → 2 Hosts\n\nMerke: 2er-Potenzen 2, 4, 8, 16, 32, 64, 128, 256 sollte man auswendig können."},
{t:"Netzadresse und Broadcast finden",b:"Der Trick ist die Blockgröße: 256 − Wert der Maske im „angebrochenen“ Oktett.\nNetze beginnen immer bei einem Vielfachen dieser Blockgröße.\n\nBeispiel: 192.168.1.77/26\nMaske: 255.255.255.192 → Blockgröße 256 − 192 = 64\nNetze beginnen bei .0, .64, .128, .192\n77 liegt zwischen 64 und 128 → Netzadresse 192.168.1.64\nBroadcast = nächstes Netz minus 1 → 192.168.1.127\nNutzbare Hosts: .65 bis .126\n\nTipp: Oktette hinter dem angebrochenen Oktett sind bei der Netzadresse 0 und beim Broadcast 255."},
{t:"Ein Netz in Subnetze teilen",b:"Willst du ein Netz in mehrere gleich große Teile teilen, „leihst“ du dir Bits vom Hostanteil.\n\nWie viele Bits? So viele, bis 2^Bits mindestens die gewünschte Anzahl ergibt.\n2 Subnetze → 1 Bit\n3–4 Subnetze → 2 Bit\n5–8 Subnetze → 3 Bit\n9–16 Subnetze → 4 Bit\n\nNeuer Präfix = alter Präfix + geliehene Bits\n\nBeispiel: 192.168.10.0/24 in 4 Subnetze\n4 → 2 Bit → /26 → je 62 Hosts\nDie Subnetze: .0, .64, .128, .192"}
],
nt:[{t:"Leistung und Stromkosten",b:"Leistung (Watt) = Spannung (Volt) × Stromstärke (Ampere)\nP = U × I\n\nBeispiel: 12 V × 10 A = 120 W\nUmgestellt: I = P ÷ U → 2300 W ÷ 230 V = 10 A\n\nStromkosten in 3 Schritten:\n1. Watt × Stunden = Wattstunden\n2. ÷ 1000 = Kilowattstunden (kWh)\n3. kWh × Preis pro kWh\n\nBeispiel: Ein Server mit 60 W läuft 24 h am Tag, ein Jahr lang, 35 ct/kWh\n60 × 24 × 365 = 525.600 Wh = 525,6 kWh\n525,6 × 0,35 € = 183,96 €"}],
raid:[{t:"RAID-Kapazität berechnen",b:"n = Anzahl der Platten, Größe = Kapazität einer Platte\n\nRAID 0: n × Größe (keine Sicherheit)\nRAID 1: 1 × Größe (Spiegel, 2 Platten)\nRAID 5: (n − 1) × Größe, mindestens 3 Platten, 1 darf ausfallen\nRAID 6: (n − 2) × Größe, mindestens 4 Platten, 2 dürfen ausfallen\nRAID 10: n ÷ 2 × Größe, mindestens 4 Platten\n\nBeispiel: 4 Platten à 2 TB\nRAID 0 = 8 TB, RAID 5 = 6 TB, RAID 6 = 4 TB, RAID 10 = 4 TB"}],
net:[{t:"Übertragungszeit berechnen",b:"Zeit = Datenmenge ÷ Geschwindigkeit\n\nWichtig: Beide Werte müssen dieselbe Einheit haben. Dateien sind in Byte, Leitungen in Bit – also Byte × 8.\n\nBeispiel: 5 GB über 100 Mbit/s\n5 GB = 5000 MB = 5000 × 8 = 40.000 Mbit\n40.000 Mbit ÷ 100 Mbit/s = 400 s = 6 min 40 s\n\nHäufiger Fehler: das × 8 vergessen. Dann wäre das Ergebnis 8-mal zu klein."}],
lin:[{t:"Linux-Rechte mit Zahlen (chmod)",b:"Jede Datei hat Rechte für drei Gruppen: Besitzer, Gruppe, Andere.\nJedes Recht hat einen Zahlenwert:\nr (lesen) = 4\nw (schreiben) = 2\nx (ausführen) = 1\n\nPro Gruppe werden die Werte addiert:\nrwx = 4 + 2 + 1 = 7\nrw- = 4 + 2 = 6\nr-x = 4 + 1 = 5\nr-- = 4\n\nBeispiel: chmod 754\nBesitzer 7 = rwx, Gruppe 5 = r-x, Andere 4 = r--\n→ rwxr-xr--"}],
pm:[{t:"Brutto, Netto und Netzplan",b:"Umsatzsteuer (19 %):\nNetto → Brutto: × 1,19\nBrutto → Netto: ÷ 1,19\n\nBeispiel: 200 € netto × 1,19 = 238 € brutto\nBeispiel: 238 € brutto ÷ 1,19 = 200 € netto\nHäufiger Fehler: 19 % vom Bruttopreis abziehen – das ergibt 192,78 € und ist falsch.\n\nNetzplan:\nFEZ (frühestes Ende) = FAZ (frühester Anfang) + Dauer\nGesamtpuffer = SAZ − FAZ (oder SEZ − FEZ)\nPuffer 0 → der Vorgang liegt auf dem kritischen Pfad."}],
srv:[{t:"Verfügbarkeit und Ausfallzeit",b:"Die erlaubte Ausfallzeit ist der Anteil, der an 100 % fehlt.\n\nFormel: Ausfallzeit = Stunden im Zeitraum × (100 − Verfügbarkeit) ÷ 100\nEin Jahr hat 8760 Stunden, ein Monat (30 Tage) 720 Stunden.\n\nBeispiel: 99,9 % pro Jahr\n8760 h × 0,1 ÷ 100 = 8,76 h\n\nBeispiel: 99,5 % pro Monat\n720 h × 0,5 ÷ 100 = 3,6 h = 3 h 36 min"}]
};

const LVN=["Grundlagen","Leicht","Mittel","Schwer"];
const LVD=["Begriffe und Basiswissen, die du sicher können solltest","Erstes Anwenden im Alltag der IT","Zusammenhänge verstehen und rechnen","Vertiefung auf Prüfungsniveau"];
const HAND=[["g",0,"Was ist ein Computer im Kern?",["Ein Gerät, das Daten nach Programmanweisungen verarbeitet","Ein Gerät, das nur Texte anzeigt","Ein reines Speichermedium","Ein Gerät, das nur mit Internet funktioniert"],"Ein Computer nimmt Daten auf, verarbeitet sie nach Befehlen eines Programms und gibt Ergebnisse aus.","Ein Computer arbeitet immer nach Anweisungen (Programmen). Ohne Programm kann er nichts.\nBeispiel: Beim Taschenrechner-Programm nimmt er deine Zahlen auf, rechnet und zeigt das Ergebnis an. Auch Smartphone, Smart-TV und Router sind Computer."],["g",0,"Wofür steht das EVA-Prinzip?",["Eingabe – Verarbeitung – Ausgabe","Energie – Volt – Ampere","Einschalten – Verbinden – Ausschalten","Erstellen – Verschieben – Archivieren"],"Jeder Computer arbeitet nach EVA: Daten kommen rein (Eingabe), werden verarbeitet und gehen wieder raus (Ausgabe).","Eingabe: Daten kommen in den Rechner (Tastatur, Maus, Sensor).\nVerarbeitung: Die CPU rechnet damit.\nAusgabe: Das Ergebnis wird angezeigt oder gedruckt.\nBeispiel: Du tippst 5+3 (Eingabe), die CPU rechnet (Verarbeitung), der Monitor zeigt 8 (Ausgabe). Oft ergänzt um S für Speichern (EVAS)."],["g",0,"Was versteht man unter Hardware?",["Alle physischen, anfassbaren Teile eines Computers","Alle Programme auf dem Computer","Nur das Betriebssystem","Nur externe Geräte wie Drucker"],"Hardware kann man anfassen: Gehäuse, CPU, RAM, Tastatur usw.","Faustregel: Was du anfassen kannst, ist Hardware.\nBeispiele: Gehäuse, Mainboard, CPU, RAM, SSD, Tastatur, Monitor, Netzwerkkabel.\nGegenstück: Software (Programme) – die kann man nicht anfassen."],["g",0,"Was ist ein Beispiel für Software?",["Ein Webbrowser","Eine Grafikkarte","Ein Netzteil","Eine Maus"],"Software sind Programme und Daten – nicht anfassbar. Browser, Betriebssystem und Spiele sind Software.","Software sind Programme und die zugehörigen Daten.\nBeispiele: Browser (Firefox, Chrome), Betriebssysteme (Windows, Linux), Office-Programme, Spiele, Treiber.\nGrafikkarte, Netzteil und Maus sind dagegen Hardware."],["g",0,"Welches Gerät ist ein Eingabegerät?",["Tastatur","Monitor","Lautsprecher","Drucker"],"Mit der Tastatur gibst du Daten in den Computer ein.","Eingabegeräte bringen Daten in den Computer.\nBeispiele: Tastatur, Maus, Mikrofon, Scanner, Webcam, Barcode-Scanner."],["g",0,"Welches Gerät ist ein Ausgabegerät?",["Monitor","Maus","Mikrofon","Scanner"],"Der Monitor gibt das Ergebnis der Verarbeitung als Bild aus.","Ausgabegeräte geben Ergebnisse aus.\nBeispiele: Monitor, Drucker, Lautsprecher, Beamer, Kopfhörer."],["g",0,"Ein Touchscreen ist …",["Ein- und Ausgabegerät zugleich","Nur ein Eingabegerät","Nur ein Ausgabegerät","Ein Speichermedium"],"Er zeigt ein Bild an (Ausgabe) und erkennt Berührungen (Eingabe).","Ein Touchscreen zeigt Inhalte an (Ausgabe) und erkennt gleichzeitig Berührungen (Eingabe).\nWeitere kombinierte Geräte: Headset (Mikrofon + Kopfhörer), Multifunktionsdrucker (Scanner + Drucker)."],["g",0,"Was sind Peripheriegeräte?",["Geräte, die an den Computer angeschlossen werden, z. B. Drucker oder Maus","Bauteile im Inneren der CPU","Programme im Hintergrund","Nur Geräte mit Funkverbindung"],"Peripherie ist alles, was außen an den Computer angeschlossen wird – Maus, Tastatur, Drucker, Webcam usw.","Peripherie = alles, was außen am Rechner hängt.\nEinteilung: Eingabe (Tastatur, Scanner), Ausgabe (Monitor, Drucker), Speicher (externe Festplatte, USB-Stick).\nBauteile im Gehäuse wie CPU oder RAM zählen nicht zur Peripherie."],["g",0,"Welche Werte kann ein einzelnes Bit haben?",["0 oder 1","0 bis 9","0 bis 255","A bis F"],"Ein Bit ist die kleinste Informationseinheit: an oder aus, 1 oder 0.","Ein Bit (binary digit) ist die kleinste Informationseinheit.\nEs kennt nur zwei Zustände: 0 oder 1, aus oder an, falsch oder wahr.\nBeispiel: Ein Lichtschalter ist wie ein Bit – an oder aus."],["g",0,"Wie viele Bit hat ein Byte?",["8","4","10","16"],"1 Byte = 8 Bit.","1 Byte = 8 Bit.\nBeispiel: Der Buchstabe A wird im ASCII-Code als 0100 0001 gespeichert – genau ein Byte.\nMerke: Dateigrößen stehen in Byte (B), Netzwerkgeschwindigkeiten meist in Bit (b)."],["g",0,"Welche Dezimalzahl ist die Binärzahl 101?",["5","3","101","6"],"Von rechts: 1×1 + 0×2 + 1×4 = 5.","Stellenwerte von rechts: 1, 2, 4, 8 …\n101 → 1×4 + 0×2 + 1×1 = 5\nWeiteres Beispiel: 110 → 4 + 2 + 0 = 6"],["g",0,"Wie viele verschiedene Werte kann man mit 8 Bit (1 Byte) darstellen?",["256","8","128","1000"],"2 hoch 8 = 256 Werte, also 0 bis 255.","Jedes zusätzliche Bit verdoppelt die Möglichkeiten: 2^8 = 256.\nDer Bereich geht von 0 bis 255.\nBeispiel: Jedes Oktett einer IPv4-Adresse ist 8 Bit groß – deshalb geht es nur bis 255."],["g",0,"Warum rechnen Computer mit dem Binärsystem?",["Weil Elektronik nur zwei Zustände sicher unterscheidet: Strom an oder aus","Weil es schneller zu schreiben ist","Weil das Dezimalsystem veraltet ist","Weil Bildschirme nur zwei Farben kennen"],"Transistoren schalten an oder aus – das passt perfekt zu 1 und 0.","Transistoren kennen zwei stabile Zustände: leitend oder nicht leitend.\nZwei Zustände lassen sich sehr zuverlässig unterscheiden, auch bei kleinen Störungen.\nMit zehn Spannungsstufen (Dezimal) wären Fehler viel wahrscheinlicher."],["g",0,"Wie viele Byte hat ein Kibibyte (KiB)?",["1024","1000","100","8"],"KiB rechnet mit 2 hoch 10 = 1024. Ein Kilobyte (KB) sind streng genommen 1000 Byte.","KiB (Kibibyte) = 2^10 = 1024 Byte.\nKB bzw. kB (Kilobyte) = 1000 Byte (SI-Präfix).\nBeispiel: Eine 1-TB-Festplatte zeigt Windows als ca. 931 „GB“ an, weil Windows binär (GiB) rechnet."],["cpu",0,"Wofür steht CPU?",["Central Processing Unit","Computer Power Unit","Central Program Utility","Core Processing Upload"],"Die CPU ist die zentrale Recheneinheit – das „Gehirn“ des Computers.","CPU = Central Processing Unit, auf Deutsch Hauptprozessor.\nSie besteht u. a. aus Rechenwerk (ALU), Steuerwerk, Registern und Cache.\nBeispiele: Intel Core i5, AMD Ryzen 7."],["cpu",0,"Was ist die Hauptaufgabe der CPU?",["Befehle von Programmen ausführen und Berechnungen durchführen","Daten dauerhaft speichern","Das Bild auf den Monitor bringen","Strom für die Bauteile liefern"],"Die CPU führt die Anweisungen aller Programme aus.","Die CPU holt Befehle aus dem Speicher, entschlüsselt sie und führt sie aus (Fetch – Decode – Execute).\nBeispiel: Beim Öffnen einer Datei rechnet die CPU, wo die Daten liegen, und steuert das Laden."],["cpu",0,"Was ist ein CPU-Kern?",["Eine eigenständige Recheneinheit innerhalb der CPU","Ein Kühlelement auf der CPU","Ein Speicherchip neben der CPU","Der Metallstift im Sockel"],"Jeder Kern kann für sich Befehle abarbeiten. Mehr Kerne = mehr gleichzeitig.","Jeder Kern ist wie eine eigene kleine CPU.\nBeispiel: Mit 8 Kernen können 8 Aufgaben wirklich gleichzeitig laufen – z. B. Spiel, Discord, Browser und ein Download."],["cpu",0,"Eine CPU hat 8 Kerne mit Hyper-Threading/SMT. Wie viele Threads hat sie?",["16","8","4","32"],"Mit SMT/Hyper-Threading bearbeitet jeder Kern zwei Threads – also 8 × 2 = 16.","Hyper-Threading (Intel) bzw. SMT (AMD) lässt jeden Kern zwei Threads bearbeiten.\n8 Kerne × 2 = 16 Threads.\nDas bringt keine doppelte Leistung, sondern etwa 15–30 %, weil Lücken im Kern besser genutzt werden."],["cpu",0,"Was ist ein Thread?",["Ein Ausführungsstrang, also eine Abfolge von Befehlen, die abgearbeitet wird","Ein Kabel zwischen CPU und RAM","Ein Teil des Caches","Eine Einheit für die Taktfrequenz"],"Ein Programm kann aus mehreren Threads bestehen, die parallel auf verschiedenen Kernen laufen können.","Ein Thread ist eine Abfolge von Befehlen innerhalb eines Programms.\nBeispiel: Ein Browser hat Threads für das Laden, das Darstellen und das Abspielen von Videos.\nMehrere Threads können auf verschiedenen Kernen parallel laufen."],["cpu",0,"In welcher Einheit wird die Taktfrequenz heutiger CPUs meist angegeben?",["GHz (Gigahertz)","GB (Gigabyte)","W (Watt)","MB/s"],"Hertz = Schwingungen pro Sekunde. 3,5 GHz = 3,5 Milliarden Takte pro Sekunde.","Hertz = Schwingungen pro Sekunde. Giga = Milliarde.\nBeispiele: 3,6 GHz Basistakt, 5,2 GHz Boost.\nÄltere CPUs hatten MHz (Millionen Takte pro Sekunde)."],["cpu",0,"Was bedeutet eine Taktfrequenz von 4 GHz?",["4 Milliarden Takte pro Sekunde","4 Millionen Befehle pro Stunde","4 GB Daten pro Sekunde","4 Kerne gleichzeitig"],"Giga = Milliarde, Hertz = pro Sekunde.","4 GHz = 4.000.000.000 Takte pro Sekunde.\nPro Takt kann ein moderner Kern sogar mehrere Befehle ausführen (IPC).\nDeshalb ist eine neue CPU mit 4 GHz oft schneller als eine alte mit 4,5 GHz."],["cpu",0,"Was ist der CPU-Cache?",["Ein sehr schneller, kleiner Zwischenspeicher direkt in der CPU","Der Arbeitsspeicher","Ein Teil der Festplatte","Der Speicher der Grafikkarte"],"Im Cache liegen oft gebrauchte Daten, damit die CPU nicht auf den langsameren RAM warten muss.","Der Cache ist viel schneller als der RAM, aber klein (einige MB).\nBeispiel: Rechnet ein Programm in einer Schleife immer mit denselben Werten, liegen diese im Cache – die CPU muss nicht auf den RAM warten."],["cpu",0,"Welche Cache-Stufe ist am schnellsten (aber am kleinsten)?",["L1","L2","L3","L4"],"L1 sitzt am nächsten am Kern: am schnellsten, aber am kleinsten. L3 ist größer, aber langsamer.","L1 sitzt direkt im Kern: wenige KB, extrem schnell.\nL2: etwas größer und langsamer, meist pro Kern.\nL3: mehrere MB bis über 100 MB, von allen Kernen geteilt.\nBeispiel: AMDs X3D-CPUs haben besonders viel L3-Cache – das bringt in Spielen viel."],["cpu",0,"Was ist ein großer Vorteil von 64-Bit gegenüber 32-Bit?",["Es kann deutlich mehr als 4 GB RAM genutzt werden","Programme werden automatisch kleiner","Es braucht weniger Strom","Es funktioniert ohne Betriebssystem"],"32-Bit kann nur etwa 4 GB Speicher adressieren. 64-Bit hebt diese Grenze praktisch auf.","32 Bit können nur 2^32 Adressen = ca. 4 GB ansprechen.\n64-Bit-Systeme können theoretisch Exabytes adressieren.\nBeispiel: Ein 32-Bit-Windows mit 8 GB RAM nutzt nur ca. 3,5 GB davon."],["cpu",0,"Wie viel RAM kann ein 32-Bit-System ungefähr maximal adressieren?",["ca. 4 GB","ca. 32 GB","ca. 64 GB","unbegrenzt"],"2 hoch 32 Byte = ca. 4 GB.","2^32 Byte = 4.294.967.296 Byte = 4 GiB.\nPraktisch bleibt sogar weniger, weil Adressbereiche für Geräte wie die Grafikkarte reserviert sind."],["cpu",0,"Was ist der Vorteil einer Multi-Core-CPU gegenüber Single-Core?",["Mehrere Aufgaben können wirklich gleichzeitig bearbeitet werden","Sie braucht keine Kühlung","Sie hat immer höheren Takt","Sie braucht keinen RAM"],"Mehrere Kerne arbeiten parallel – gut für Multitasking und moderne Programme.","Mehrere Kerne arbeiten wirklich parallel.\nBeispiel: Beim Videorendern verteilt das Programm die Arbeit auf alle Kerne – mit 8 statt 2 Kernen geht es deutlich schneller.\nProgramme, die nur einen Thread nutzen, profitieren dagegen kaum."],["cpu",0,"Wo kannst du unter Windows die CPU-Auslastung sehen?",["Im Task-Manager","In der Systemsteuerung unter Drucker","Im Explorer","Im Editor"],"Strg+Umschalt+Esc öffnet den Task-Manager → Reiter Leistung.","Öffnen mit Strg + Umschalt + Esc → Reiter „Leistung“ oder „Prozesse“.\nDort siehst du auch RAM-, Datenträger- und Netzwerkauslastung und kannst hängende Programme beenden."],["cpu",0,"Mit welchem Befehl kannst du unter Linux die CPU-Auslastung live sehen?",["top (oder htop)","ls","cd","mkdir"],"top bzw. das hübschere htop zeigen Prozesse und Auslastung in Echtzeit.","top ist fast überall vorinstalliert, htop ist übersichtlicher (sudo apt install htop).\nBeenden mit q.\nWeitere nützliche Befehle: uptime (Durchschnittslast), nproc (Anzahl Kerne)."],["cpu",0,"Die CPU ist dauerhaft bei 100 % Auslastung. Was merkst du wahrscheinlich?",["Der PC reagiert träge und Programme hängen","Der Monitor wird heller","Die Festplatte wird größer","Das Internet wird schneller"],"Die CPU ist voll beschäftigt, neue Aufgaben müssen warten.","Die CPU hat keine Reserven mehr, neue Aufgaben müssen warten.\nUrsachen finden: Task-Manager oder top öffnen und nach CPU sortieren.\nHäufige Übeltäter: hängende Prozesse, Updates im Hintergrund, Schadsoftware (z. B. Krypto-Miner)."],["cpu",0,"Welche zwei Firmen stellen die meisten Desktop-CPUs her?",["Intel und AMD","NVIDIA und Samsung","Apple und Microsoft","Corsair und Asus"],"Bei PCs dominieren Intel (Core) und AMD (Ryzen).","Intel: Core i3/i5/i7/i9 bzw. Core Ultra, Server: Xeon.\nAMD: Ryzen 3/5/7/9, Server: EPYC.\nApple baut eigene ARM-Chips (M-Serie), die aber nur in Macs stecken."],["ram",0,"Was ist die Aufgabe des Arbeitsspeichers (RAM)?",["Daten und Programme, die gerade laufen, schnell bereitzuhalten","Daten dauerhaft zu speichern","Strom zu verteilen","Das Bild zu berechnen"],"Alles, was gerade geöffnet ist, liegt im RAM, damit die CPU schnell darauf zugreifen kann.","Der RAM ist der Arbeitsplatz der CPU.\nBeispiel: Öffnest du ein Spiel, werden Programmdaten von der SSD in den RAM geladen, weil die CPU dort viel schneller zugreifen kann."],["ram",0,"Wofür steht RAM?",["Random Access Memory","Read Always Memory","Rapid Application Module","Remote Access Machine"],"Random Access = auf jede Stelle kann direkt zugegriffen werden.","Random Access = wahlfreier Zugriff: Jede Speicherstelle kann direkt angesprochen werden, ohne vorher andere lesen zu müssen.\nGegenbeispiel: Ein Magnetband muss erst vorgespult werden."],["ram",0,"Was passiert mit den Daten im RAM, wenn du den PC ausschaltest?",["Sie gehen verloren","Sie bleiben für immer","Sie werden automatisch auf die GPU verschoben","Sie werden ins BIOS kopiert"],"RAM ist flüchtig – ohne Strom sind die Daten weg. Darum muss man Dateien speichern.","RAM ist flüchtig: Ohne Strom sind die Daten weg.\nDeshalb musst du Dokumente speichern – erst dann liegen sie dauerhaft auf SSD oder HDD.\nAusnahme: Beim Ruhezustand (Hibernate) wird der RAM-Inhalt vorher auf die SSD geschrieben."],["ram",0,"In welcher Einheit wird die RAM-Kapazität heute meist angegeben?",["GB","GHz","Watt","Volt"],"Übliche Größen sind 8, 16, 32 oder 64 GB.","Typische Größen: 8 GB (knapp), 16 GB (Standard), 32 GB (Gaming, VMs), 64 GB und mehr (Server, Workstations)."],["ram",0,"Wie viel RAM ist heute für einen normalen Gaming- oder Arbeits-PC ein guter Wert?",["16–32 GB","512 MB","2 GB","1 TB"],"16 GB sind heute der sinnvolle Standard, 32 GB für mehr Reserve (z. B. VMs).","16 GB reichen für Büro und die meisten Spiele.\n32 GB lohnen sich für viele Browser-Tabs, VMs, Videoschnitt oder neue Spiele.\nBeispiel: Mit 3 VMs à 4 GB plus Host-System wird es mit 16 GB schon eng."],["ram",0,"Was sagt „DDR5-6000“ aus?",["DDR5-RAM mit 6000 MT/s Übertragungsrate","DDR5 mit 6000 GB Kapazität","Der 6000. Riegel dieser Serie","Er braucht 6000 Watt"],"Die Zahl ist die Geschwindigkeit (Megatransfers pro Sekunde). Höher = mehr Datendurchsatz.","DDR5 = Speichergeneration, 6000 = 6000 Megatransfers pro Sekunde.\nOft wird fälschlich „6000 MHz“ gesagt – der echte Takt ist die Hälfte (Double Data Rate).\nDie Bandbreite pro Modul: 6000 × 8 Byte ≈ 48 GB/s."],["ram",0,"Kann man DDR5-RAM in einen DDR4-Steckplatz stecken?",["Nein, die Kerbe sitzt anders, sie sind nicht kompatibel","Ja, immer","Ja, aber nur einen Riegel","Ja, wenn man ihn umdreht"],"Mainboards unterstützen entweder DDR4 oder DDR5 – die Riegel passen mechanisch nicht in den falschen Slot.","Jede DDR-Generation hat die Kerbe an einer anderen Stelle, dadurch passt der Riegel mechanisch nicht.\nAuch Spannung und Signale sind unterschiedlich.\nBeispiel: Beim Aufrüsten auf ein AM5-Board brauchst du zwingend DDR5."],["ram",0,"Was ist ein Vorteil von DDR5 gegenüber DDR4?",["Höhere Geschwindigkeit bzw. Bandbreite","Er speichert Daten dauerhaft","Er braucht keinen Steckplatz","Er ist mit jedem Mainboard kompatibel"],"DDR5 ist die neuere Generation mit deutlich höheren Taktraten.","DDR5 bietet höhere Übertragungsraten (4800–8000+ MT/s statt 2133–3600 bei DDR4) und größere Module.\nNachteil: anfangs teurer und oft etwas höhere Latenzen."],["ram",0,"Was ist der Unterschied zwischen RAM und Speicherplatz (SSD/HDD)?",["RAM ist schneller, aber flüchtig; SSD/HDD speichern dauerhaft","RAM speichert dauerhaft, SSD ist flüchtig","Es gibt keinen Unterschied","RAM ist immer größer als die SSD"],"Merkhilfe: RAM = Schreibtisch (schnell, wird abends leer geräumt), SSD = Aktenschrank (dauerhaft).","RAM: extrem schnell, aber flüchtig und teurer pro GB.\nSSD/HDD: dauerhaft, viel größer, aber langsamer.\nBeispiel: Ein Word-Dokument liegt auf der SSD. Während du es bearbeitest, liegt eine Kopie im RAM."],["ram",0,"Was passiert, wenn der RAM voll ist?",["Das System lagert Daten auf SSD/HDD aus und wird langsam","Der PC wird schneller","Die CPU schaltet Kerne ab","Das Netzteil schaltet ab"],"Windows nutzt die Auslagerungsdatei, Linux den Swap. Das ist viel langsamer als echter RAM.","Ist der RAM voll, werden Teile in die Auslagerungsdatei (Windows) bzw. Swap (Linux) verschoben.\nDer Datenträger ist um ein Vielfaches langsamer, deshalb ruckelt das System.\nLösung: Programme schließen oder RAM aufrüsten."],["ram",0,"Wie heißt der Auslagerungsspeicher unter Linux?",["Swap","Cache","Kernel","Boot"],"Swap ist eine Partition oder Datei, in die ausgelagert wird, wenn der RAM voll ist.","Swap kann eine eigene Partition oder eine Datei (z. B. /swap.img) sein.\nAnzeigen mit free -h oder swapon --show.\nStarke Swap-Nutzung deutet auf zu wenig RAM hin."],["ram",0,"Was bringt Dual-Channel (zwei gleiche Riegel in den richtigen Slots)?",["Mehr Bandbreite, weil zwei Kanäle gleichzeitig genutzt werden","Doppelte Taktfrequenz der CPU","Weniger Stromverbrauch der GPU","Nichts, es ist nur Optik"],"Zwei Riegel à 8 GB sind meist schneller als ein Riegel mit 16 GB.","Mit zwei Riegeln arbeitet der Speichercontroller auf zwei Kanälen gleichzeitig – die Bandbreite verdoppelt sich.\nBeispiel: 2 × 8 GB ist schneller als 1 × 16 GB.\nDie richtigen Slots stehen im Mainboard-Handbuch (oft A2 und B2)."],["ram",0,"Wie heißt die kleinere RAM-Bauform für Laptops?",["SO-DIMM","DIMM","M.2","PCIe"],"Desktop-PCs nutzen DIMM, Laptops das kleinere SO-DIMM.","SO-DIMM = Small Outline DIMM, etwa halb so lang wie normale DIMMs.\nWird in Laptops, Mini-PCs und manchen NAS-Geräten verwendet.\nBei vielen dünnen Laptops ist der RAM fest verlötet und nicht aufrüstbar."],["mb",0,"Was ist die Hauptaufgabe des Mainboards?",["Alle Komponenten miteinander zu verbinden","Das Bild zu berechnen","Den Strom aus der Steckdose umzuwandeln","Programme zu speichern"],"Das Mainboard ist die Hauptplatine – CPU, RAM, GPU, SSD usw. sind alle darüber verbunden.","Das Mainboard ist die zentrale Platine. Es verbindet CPU, RAM, Speicher, Erweiterungskarten und Anschlüsse über Leiterbahnen.\nEs versorgt Bauteile auch mit Strom und enthält die Firmware (UEFI)."],["mb",0,"Was muss beim CPU-Sockel beachtet werden?",["CPU und Sockel müssen zusammenpassen","Jede CPU passt in jeden Sockel","Der Sockel bestimmt die RAM-Größe","Der Sockel ist nur für den Kühler"],"z. B. AMD Ryzen 7000/9000 → Sockel AM5, viele Intel-CPUs → LGA1700 bzw. LGA1851.","Jede CPU passt nur in einen bestimmten Sockel.\nBeispiele: AMD Ryzen 7000/9000 → AM5, Intel Core Ultra 200 → LGA1851.\nAuch der Chipsatz und eine passende UEFI-Version müssen die CPU unterstützen."],["mb",0,"Welcher Sockel gehört zu aktuellen AMD-Ryzen-Desktop-CPUs?",["AM5","LGA1700","DDR5","PCIe"],"AM5 ist AMDs aktueller Desktop-Sockel und unterstützt nur DDR5.","AM5 ist seit den Ryzen-7000-Modellen aktuell und nutzt DDR5.\nDer Vorgänger AM4 unterstützte DDR4.\nAMD hält Sockel meist mehrere Generationen lang – gut zum Aufrüsten."],["mb",0,"Wie heißen die Steckplätze für den Arbeitsspeicher auf dem Mainboard?",["DIMM-Slots","PCIe-Slots","SATA-Ports","M.2-Slots"],"Dort werden die RAM-Riegel eingesteckt.","DIMM = Dual Inline Memory Module.\nDesktop-Boards haben meist 2 oder 4 Slots.\nBeim Einsetzen die Halteklammern öffnen und das Modul gerade hineindrücken, bis es hörbar einrastet."],["mb",0,"Wofür wird der lange PCIe-x16-Steckplatz meistens genutzt?",["Für die Grafikkarte","Für den RAM","Für das Netzteil","Für die Tastatur"],"Die Grafikkarte braucht viel Bandbreite und nutzt deshalb 16 PCIe-Lanes.","x16 bedeutet 16 Datenleitungen (Lanes) – die maximale Bandbreite für die Grafikkarte.\nMan kann dort auch andere Karten einstecken, z. B. eine 10-Gbit-Netzwerkkarte."],["mb",0,"Was ist der Chipsatz?",["Ein Chip, der die Kommunikation steuert und zusätzliche Anschlüsse bereitstellt","Der Arbeitsspeicher","Der Grafikchip","Die CMOS-Batterie"],"Der Chipsatz (z. B. B650, Z790) bestimmt, welche Funktionen und wie viele Anschlüsse das Mainboard bietet.","Der Chipsatz stellt zusätzliche USB-Ports, SATA-Anschlüsse und PCIe-Lanes bereit.\nBeispiele: AMD B650/X670, Intel B760/Z790.\nEr bestimmt z. B., ob Übertakten möglich ist."],["mb",0,"Was ist BIOS bzw. UEFI?",["Firmware, die beim Start die Hardware prüft und das Betriebssystem lädt","Ein Betriebssystem wie Windows","Ein Virenscanner","Ein Grafiktreiber"],"Es ist das Erste, was nach dem Einschalten läuft – noch vor Windows oder Linux.","Die Firmware startet vor dem Betriebssystem: Hardware prüfen (POST), Bootgerät finden, Bootloader starten.\nIm Setup kannst du z. B. die Bootreihenfolge, Lüfterkurven oder XMP einstellen."],["mb",0,"Was ist UEFI im Vergleich zum BIOS?",["Der moderne Nachfolger, z. B. mit Mausbedienung, GPT und Secure Boot","Ein älteres System als BIOS","Ein Teil der Grafikkarte","Ein Netzwerkprotokoll"],"UEFI hat das klassische BIOS weitgehend abgelöst. Umgangssprachlich sagt man aber oft trotzdem „BIOS“.","UEFI ersetzt das alte BIOS.\nVorteile: grafische Oberfläche, Unterstützung von GPT und Datenträgern über 2 TB, Secure Boot, schnellerer Start.\nUmgangssprachlich sagen viele trotzdem noch „BIOS“."],["mb",0,"Wie kommst du meistens ins BIOS/UEFI?",["Beim Start Entf oder F2 drücken","Im Windows-Explorer","Über den Task-Manager","Mit Strg+C"],"Die Taste hängt vom Hersteller ab, Entf und F2 sind am häufigsten.","Die Taste steht meist kurz auf dem Startbild. Üblich sind Entf (Del), F2, bei manchen Herstellern F10 oder F12 (Bootmenü).\nAlternativ aus Windows heraus: Erweiterter Start → UEFI-Firmwareeinstellungen."],["mb",0,"Welcher Mainboard-Formfaktor ist am kleinsten?",["Mini-ITX","ATX","Micro-ATX","E-ATX"],"Größe absteigend: E-ATX > ATX > Micro-ATX > Mini-ITX.","Größen: ATX (30,5 × 24,4 cm) > Micro-ATX (24,4 × 24,4 cm) > Mini-ITX (17 × 17 cm).\nMini-ITX hat meist nur einen PCIe-Slot und zwei RAM-Slots – ideal für kleine PCs."],["mb",0,"Was ist das I/O-Panel?",["Die Anschlussleiste hinten am Mainboard mit USB, LAN, Audio usw.","Ein Kühler für den Chipsatz","Die Einstellungsseite im UEFI","Ein spezieller RAM-Slot"],"I/O = Input/Output. Dort steckst du Maus, Netzwerkkabel, Audio usw. ein.","Das I/O-Panel ist die Rückseite des Mainboards, die aus dem Gehäuse schaut.\nTypische Anschlüsse: USB, LAN (RJ45), Audio, Bildausgänge für die iGPU, oft WLAN-Antennen."],["mb",0,"Wofür ist die kleine Knopfzelle (CMOS-Batterie) auf dem Mainboard?",["Sie speichert Uhrzeit und BIOS-Einstellungen, wenn der PC stromlos ist","Sie versorgt die CPU mit Strom","Sie ist ein Notstrom für die Festplatte","Sie kühlt den Chipsatz"],"Ist sie leer, stimmt nach dem Ausstecken oft die Uhrzeit nicht mehr.","Die Knopfzelle (meist CR2032) hält die Echtzeituhr und die UEFI-Einstellungen am Leben.\nZeichen einer leeren Batterie: Uhrzeit falsch nach dem Einschalten, Einstellungen weg.\nEin Tausch kostet nur wenige Euro."],["sp",0,"Wie funktioniert eine HDD?",["Mit rotierenden Magnetscheiben und einem beweglichen Lesekopf","Mit Flash-Speicherchips ohne bewegliche Teile","Mit Lasern wie eine DVD","Nur mit Strom, ohne Daten zu speichern"],"HDD = Hard Disk Drive. Die mechanischen Teile machen sie langsamer und stoßempfindlicher.","In der HDD drehen sich Magnetscheiben mit 5400 oder 7200 U/min, ein Lesekopf fährt über die Oberfläche.\nDeshalb ist sie empfindlich gegen Stöße und hat längere Zugriffszeiten (ca. 5–10 ms)."],["sp",0,"Wie speichert eine SSD Daten?",["In Flash-Speicherchips, ohne bewegliche Teile","Auf rotierenden Scheiben","Auf Magnetband","Im Arbeitsspeicher"],"Keine Mechanik → schneller, leiser, robuster.","SSDs speichern Daten in NAND-Flash-Zellen.\nKeine beweglichen Teile → leise, stoßfest, sehr kurze Zugriffszeiten (unter 0,1 ms).\nFlash-Zellen verschleißen mit Schreibvorgängen, moderne SSDs halten aber viele Jahre."],["sp",0,"Was ist heute noch ein Vorteil einer HDD?",["Viel Speicher für wenig Geld (günstig pro TB)","Sie ist schneller als NVMe","Sie ist komplett lautlos","Sie ist stoßfest"],"Für große Datengräber (Backups, Medien) sind HDDs noch beliebt.","HDDs bieten viel Kapazität für wenig Geld, z. B. 8–20 TB.\nIdeal für NAS, Backups und Mediensammlungen.\nFür Betriebssystem und Programme nimmt man heute eine SSD."],["sp",0,"Wie schnell ist eine SATA-SSD ungefähr maximal?",["ca. 550 MB/s","ca. 50 MB/s","ca. 7000 MB/s","ca. 1 MB/s"],"Die SATA-Schnittstelle begrenzt auf rund 550–600 MB/s.","SATA III ist auf 6 Gbit/s begrenzt, nutzbar sind ca. 550 MB/s.\nZum Vergleich: HDD ca. 150–250 MB/s, NVMe-SSD mit PCIe 4.0 bis ca. 7000 MB/s."],["sp",0,"Worüber ist eine NVMe-SSD angebunden?",["Über PCIe","Über SATA","Über USB 2.0","Über HDMI"],"NVMe nutzt PCIe-Lanes und schafft dadurch mehrere Tausend MB/s.","NVMe ist ein Protokoll, das speziell für Flash-Speicher über PCIe entwickelt wurde.\nDadurch sind viel höhere Geschwindigkeiten und parallele Zugriffe möglich.\nBeispiel: Eine PCIe-4.0-NVMe-SSD nutzt 4 Lanes (x4)."],["sp",0,"Was ist M.2?",["Ein Formfaktor/Steckplatz – darüber kann SATA oder NVMe laufen","Ein Dateisystem","Eine RAM-Generation","Ein Protokoll nur für HDDs"],"Wichtig: M.2 beschreibt die Bauform. Eine M.2-SSD kann eine langsame SATA- oder eine schnelle NVMe-SSD sein.","M.2 beschreibt nur Bauform und Steckplatz.\nÜber M.2 kann SATA (langsam) oder NVMe (schnell) laufen.\nBeim Kauf also prüfen, was der Slot unterstützt. Größenangabe z. B. 2280 = 22 mm breit, 80 mm lang."],["sp",0,"Welche Reihenfolge ist richtig (schnellste zuerst)?",["NVMe-SSD > SATA-SSD > HDD","HDD > SATA-SSD > NVMe-SSD","SATA-SSD > NVMe-SSD > HDD","Alle sind gleich schnell"],"Grob: HDD ~150 MB/s, SATA-SSD ~550 MB/s, NVMe mehrere GB/s.","NVMe: bis ca. 7000+ MB/s\nSATA-SSD: ca. 550 MB/s\nHDD: ca. 150–250 MB/s\nNoch wichtiger als die Übertragungsrate ist oft die Zugriffszeit – dort sind SSDs um ein Vielfaches besser."],["sp",0,"Was ist die Zugriffszeit?",["Die Zeit, bis ein Datenträger nach einer Anfrage mit dem Lesen beginnt","Wie lange der PC zum Hochfahren braucht","Die Laufzeit der Garantie","Die Zeit, bis die SSD voll ist"],"HDDs brauchen einige Millisekunden (Kopf muss sich bewegen), SSDs nur Bruchteile davon.","Zugriffszeit = Wartezeit, bis die ersten Daten kommen.\nHDD: ca. 5–10 ms (Kopf muss sich bewegen, Scheibe muss sich drehen).\nSSD: unter 0,1 ms.\nDas merkt man vor allem beim Start von Systemen und Programmen mit vielen kleinen Dateien."],["sp",0,"Welche Einschränkung hat die alte Partitionstabelle MBR?",["Maximal ca. 2 TB und nur 4 primäre Partitionen","Maximal 64 GB","Nur für USB-Sticks","Funktioniert nicht mit Windows"],"Deshalb wurde MBR durch GPT ersetzt.","MBR (Master Boot Record) stammt aus den 1980ern.\nEinschränkungen: max. 2 TiB pro Datenträger, max. 4 primäre Partitionen (mit erweiterter Partition mehr logische).\nFür größere Datenträger braucht man GPT."],["sp",0,"Was ist GPT?",["Die moderne Partitionstabelle für große Datenträger, passend zu UEFI","Ein Grafikkartentreiber","Ein Dateisystem für Linux","Eine Art von RAM"],"GPT = GUID Partition Table. Unterstützt riesige Platten und viele Partitionen.","GPT (GUID Partition Table) gehört zum UEFI-Standard.\nVorteile: riesige Datenträger, unter Windows bis zu 128 Partitionen, Sicherungskopie der Partitionstabelle am Ende des Datenträgers.\nWindows 11 setzt GPT voraus."],["sp",0,"Was ist eine Partition?",["Ein abgetrennter Bereich auf einem Datenträger","Ein Ordner im Explorer","Ein Stück Arbeitsspeicher","Ein Kabel"],"Eine Festplatte kann z. B. in C: und D: aufgeteilt werden.","Eine Partition ist ein abgegrenzter Bereich mit eigenem Dateisystem.\nBeispiel: C: für Windows, D: für Daten – auf derselben SSD.\nUnter Linux heißen Partitionen z. B. /dev/sda1 oder /dev/nvme0n1p1."],["sp",0,"Welches Dateisystem nutzt Windows standardmäßig?",["NTFS","ext4","FAT12","APFS"],"NTFS ist Standard für Windows-Systemlaufwerke.","NTFS bietet Dateirechte, Verschlüsselung (EFS), Journaling und sehr große Dateien.\nmacOS kann NTFS standardmäßig nur lesen.\nFür USB-Sticks zwischen Windows und Mac ist exFAT praktischer."],["sp",0,"Welches Dateisystem ist bei Linux (z. B. Ubuntu) Standard?",["ext4","NTFS","exFAT","HFS+"],"ext4 ist das verbreitetste Linux-Dateisystem.","ext4 ist stabil, schnell und hat Journaling.\nAlternativen unter Linux: XFS (große Server), Btrfs (Snapshots), ZFS (NAS, z. B. TrueNAS)."],["sp",0,"Welche Einschränkung hat FAT32?",["Einzelne Dateien dürfen max. 4 GB groß sein","Es funktioniert nur unter Linux","Es kann keine Ordner","Es ist nur für SSDs"],"Für USB-Sticks mit großen Dateien nimmt man deshalb exFAT.","FAT32 ist alt, aber fast überall lesbar (Autoradio, TV, Kamera).\nDateien max. 4 GB – ein großes Video passt also nicht.\nLösung: exFAT oder NTFS."],["sp",0,"Was passiert beim Formatieren?",["Ein Dateisystem wird angelegt – vorhandene Daten gehen dabei (scheinbar) verloren","Die Festplatte wird schneller getaktet","Die Partitionstabelle wird ins BIOS kopiert","Die Daten werden automatisch gesichert"],"Vor dem Formatieren also immer prüfen, ob wichtige Daten drauf sind.","Beim Schnellformatieren wird nur das Inhaltsverzeichnis neu angelegt – die Daten sind oft noch wiederherstellbar.\nZum sicheren Löschen: überschreiben (HDD) oder Secure Erase bzw. Verschlüsselung (SSD)."],["gpu",0,"Was ist die Hauptaufgabe der Grafikkarte?",["Bilder berechnen und an den Monitor ausgeben","Daten dauerhaft speichern","Das Netzwerk verwalten","Strom verteilen"],"GPU = Graphics Processing Unit.","Die GPU berechnet Pixel, Texturen, Licht und Schatten und sendet das fertige Bild an den Monitor.\nBeispiel: Bei 1440p mit 144 FPS berechnet sie ca. 530 Millionen Pixel pro Sekunde."],["gpu",0,"Was ist der wichtigste Unterschied zwischen GPU und CPU?",["GPU: sehr viele einfache Kerne für parallele Aufgaben; CPU: wenige starke Kerne für vielseitige Aufgaben","Die GPU hat keine Kerne","Die CPU ist nur für Grafik da","Es gibt keinen Unterschied"],"Grafik besteht aus Millionen Pixeln, die gleichzeitig berechnet werden – perfekt für die parallelen GPU-Kerne.","CPU: wenige, sehr flexible Kerne (z. B. 8–16) für allgemeine Aufgaben.\nGPU: tausende einfache Kerne für gleichartige, parallele Rechnungen.\nBeispiel: Ein Bild mit Millionen Pixeln kann die GPU gleichzeitig berechnen."],["gpu",0,"Was ist VRAM?",["Der eigene, schnelle Speicher der Grafikkarte","Virtueller RAM einer VM","Der CPU-Cache","Ein Anschluss für Monitore"],"Im VRAM liegen z. B. Texturen. Zu wenig VRAM → Ruckler in Spielen.","VRAM (Video RAM) sitzt auf der Grafikkarte und ist sehr schnell (GDDR6/GDDR7).\nDarin liegen Texturen und Bildpuffer.\nBeispiel: Moderne Spiele in 4K brauchen oft 12 GB VRAM oder mehr."],["gpu",0,"Was ist eine integrierte Grafikeinheit (iGPU)?",["Ein Grafikchip direkt in der CPU, der den normalen RAM mitbenutzt","Eine besonders starke Gaming-Grafikkarte","Eine Grafikkarte im PCIe-Slot","Ein externer Monitor"],"Reicht für Office und Videos, für anspruchsvolle Spiele meist zu schwach.","Die iGPU sitzt in der CPU und teilt sich den Arbeitsspeicher.\nReicht für Büro, Videos und leichte Spiele.\nVorteil: kein Zusatzstrom, keine Extra-Karte – ideal für Büro-PCs und Homeserver."],["gpu",0,"Was ist eine dedizierte Grafikkarte?",["Eine eigene Grafikkarte mit eigenem VRAM, meist im PCIe-Slot","Eine GPU in der CPU","Ein Teil des Netzteils","Eine Software"],"Dediziert = eigenständig. Deutlich leistungsstärker als integrierte Grafik.","Eine dedizierte Karte hat eigenen VRAM, eigene Kühlung und oft eigene Stromanschlüsse.\nBeispiele: NVIDIA GeForce RTX, AMD Radeon RX, Intel Arc.\nDeutlich mehr Leistung als eine iGPU."],["gpu",0,"Du hast eine Grafikkarte, steckst den Monitor aber ans Mainboard. Was passiert?",["Die Grafikkarte wird nicht genutzt – oft gibt es gar kein Bild","Das Bild wird doppelt so gut","Die GPU läuft trotzdem voll","Das Mainboard geht kaputt"],"Häufiger Anfängerfehler: Monitorkabel immer in die Grafikkarte stecken!","Ohne iGPU in der CPU bleibt der Bildschirm schwarz.\nMit iGPU wird die schwächere interne Grafik genutzt – Spiele laufen dann sehr schlecht.\nLösung: Monitorkabel immer an die Grafikkarte stecken."],["gpu",0,"Welche Firmen stellen Grafikchips her?",["NVIDIA, AMD und Intel","Samsung und Kingston","Corsair und be quiet!","Logitech und Razer"],"NVIDIA (GeForce), AMD (Radeon), Intel (Arc).","NVIDIA dominiert Gaming und KI, AMD bietet Radeon-Karten und APUs, Intel die Arc-Serie und iGPUs.\nDie Karten selbst bauen oft Partner wie ASUS, MSI, Gigabyte oder Sapphire."],["gpu",0,"Im Spiel zeigt die GPU 99 % Auslastung. Ist das ein Problem?",["Nein, das ist normal – die GPU arbeitet voll","Ja, sie geht gleich kaputt","Ja, der RAM ist defekt","Ja, das Netzteil ist zu stark"],"In Spielen soll die GPU voll ausgelastet sein. Problematisch wäre eher, wenn sie bei niedriger Auslastung ruckelt.","In Spielen ist volle GPU-Auslastung erwünscht – die Karte liefert, was sie kann.\nProblematisch wäre eher eine niedrige GPU-Auslastung bei wenig FPS: Dann bremst oft die CPU (Bottleneck)."],["gpu",0,"Wofür werden GPUs außer Gaming noch stark genutzt?",["KI-Berechnungen und Videobearbeitung","Nur für Tabellen","Als Festplattenersatz","Zur Stromversorgung"],"Die parallele Rechenleistung eignet sich auch für KI, Rendering und Video-Encoding.","GPUs rechnen sehr viele einfache Operationen parallel.\nBeispiele: KI-Training und -Anwendungen (z. B. Sprachmodelle), Video-Encoding, 3D-Rendering, wissenschaftliche Simulationen."],["nt",0,"Was ist die Aufgabe des Netzteils?",["Wechselstrom aus der Steckdose in Gleichstrom für die PC-Bauteile umwandeln","Daten zwischen CPU und RAM übertragen","Das Bild berechnen","Das Internet bereitstellen"],"Die Bauteile brauchen niedrige Gleichspannungen wie 12 V, 5 V und 3,3 V.","Aus 230 V Wechselstrom werden 12 V, 5 V und 3,3 V Gleichstrom.\nDas Netzteil glättet und stabilisiert die Spannung und schützt vor Kurzschluss und Überspannung."],["nt",0,"Welche Spannung liefert eine normale Steckdose in Deutschland?",["230 V","12 V","5 V","1000 V"],"230 V Wechselspannung – das Netzteil wandelt sie um.","230 V Wechselspannung mit 50 Hz.\nIn den USA sind es 120 V mit 60 Hz – gute Netzteile können beides (Weitbereich 100–240 V)."],["nt",0,"Welche Spannung ist im PC die wichtigste (u. a. für CPU und GPU)?",["12 V","230 V","110 V","48 V"],"Fast die gesamte Leistung für CPU und Grafikkarte kommt über die 12-V-Schiene.","Die 12-V-Schiene versorgt die größten Verbraucher: CPU (über den 8-Pin-EPS-Stecker) und Grafikkarte.\n5 V und 3,3 V werden z. B. für USB und manche Chips genutzt."],["nt",0,"Was gibt die Watt-Angabe beim Netzteil an?",["Die maximale Leistung, die es liefern kann","Wie viel Strom es immer verbraucht","Die Lautstärke","Die Anzahl der Kabel"],"Ein 750-W-Netzteil kann bis zu 750 W liefern – es verbraucht aber nur, was der PC gerade braucht.","Die Watt-Angabe ist die maximale Dauerleistung.\nEin 750-W-Netzteil zieht nicht ständig 750 W – es liefert nur, was die Bauteile gerade brauchen.\nBeispiel: Beim Surfen braucht der PC vielleicht 80 W."],["nt",0,"Wie berechnet man die Leistung (Watt)?",["Spannung × Stromstärke (P = U × I)","Spannung + Stromstärke","Spannung ÷ Stromstärke","Stromstärke × 1000"],"Watt = Volt × Ampere.","P = U × I (Leistung = Spannung × Stromstärke).\nBeispiel: 230 V × 2 A = 460 W.\nUmgestellt: I = P ÷ U, U = P ÷ I."],["nt",0,"Eine Komponente zieht 10 A bei 12 V. Wie viel Leistung ist das?",["120 W","22 W","1,2 W","1200 W"],"12 V × 10 A = 120 W.","P = U × I = 12 V × 10 A = 120 W.\nWeiteres Beispiel: Eine GPU mit 300 W zieht auf der 12-V-Schiene 300 ÷ 12 = 25 A."],["nt",0,"In welcher Einheit wird die Stromstärke angegeben?",["Ampere (A)","Volt (V)","Watt (W)","Hertz (Hz)"],"Spannung = Volt, Stromstärke = Ampere, Leistung = Watt.","Ampere (A) gibt an, wie viel Strom fließt.\nVolt (V) = Spannung, Watt (W) = Leistung, Ohm (Ω) = Widerstand.\nBeispiel: Eine Haushaltssicherung hat meist 16 A."],["nt",0,"Was bedeutet ein Netzteil mit „80 PLUS Gold“?",["Es hat einen hohen Wirkungsgrad, also wenig Verlust","Es hat 80 Anschlüsse","Es liefert 80 Watt","Es ist vergoldet"],"Die 80-PLUS-Stufen (Bronze, Silver, Gold, Platinum, Titanium) stehen für steigende Effizienz.","80 PLUS Gold bedeutet ca. 87–90 % Wirkungsgrad (je nach Last).\nStufen: Bronze < Silber < Gold < Platinum < Titanium.\nBeispiel: Braucht der PC 400 W, zieht ein Gold-Netzteil ca. 450 W aus der Steckdose."],["nt",0,"Was passiert mit der Energie, die ein Netzteil „verliert“?",["Sie wird zu Wärme","Sie wird in der Batterie gespeichert","Sie geht zurück ins Stromnetz","Sie wird zu Licht"],"Darum werden ineffiziente Netzteile wärmer und lauter.","Die verlorene Energie wird zu Wärme, die der Netzteillüfter abführen muss.\nEffizientere Netzteile sind deshalb oft leiser und sparen Stromkosten."],["nt",0,"Welcher Stecker versorgt das Mainboard hauptsächlich?",["24-Pin-ATX","SATA-Strom","HDMI","8-Pin-PCIe"],"Dazu kommt der 4+4- bzw. 8-Pin-EPS-Stecker für die CPU.","Der 24-Pin-ATX-Stecker versorgt das Mainboard.\nDazu kommen 4+4-Pin-EPS für die CPU und PCIe-Stecker (6+2-Pin oder 12V-2x6) für die Grafikkarte."],["nt",0,"Womit werden SATA-SSDs und HDDs mit Strom versorgt?",["SATA-Stromstecker","24-Pin-ATX","USB-C","Klinkenstecker"],"SATA hat getrennte Kabel für Daten und Strom.","Der SATA-Stromstecker ist flach und breit mit 15 Pins.\nNicht verwechseln mit dem kleineren SATA-Datenkabel (7 Pins).\nM.2-SSDs brauchen kein Stromkabel."],["nt",0,"Wie dimensioniert man ein Netzteil sinnvoll?",["Gesamtverbrauch der Komponenten berechnen und ca. 20–30 % Reserve einplanen","Immer das stärkste kaufen","Genau den Verbrauch der CPU nehmen","Die Watt-Zahl der Grafikkarte halbieren"],"Beispiel: 500 W Verbrauch → ca. 650 W Netzteil. Die Grafikkarte ist meist der größte Verbraucher.","Verbrauch aller Komponenten zusammenrechnen, v. a. CPU und GPU.\nBeispiel: CPU 120 W + GPU 250 W + Rest 60 W = 430 W → mit 20–30 % Reserve ca. 550–650 W.\nOnline-Netzteilrechner helfen dabei."],["nt",0,"Was ist ein modulares Netzteil?",["Eines, bei dem man nicht benötigte Kabel abnehmen kann","Eines mit zwei Lüftern","Eines ohne Stromkabel","Eines nur für Laptops"],"Weniger Kabelsalat → besserer Airflow und aufgeräumteres Gehäuse.","Nur benötigte Kabel werden eingesteckt – weniger Kabelsalat und besserer Luftstrom.\nAchtung: Modulare Kabel nie zwischen Herstellern oder Modellen tauschen, die Pinbelegung kann anders sein!"],["kue",0,"Warum muss ein PC gekühlt werden?",["Bauteile erzeugen Wärme – zu heiß werden sie langsamer oder nehmen Schaden","Damit der Monitor heller wird","Damit mehr Speicher frei wird","Kühlung ist nur Optik"],"Vor allem CPU und GPU produzieren viel Abwärme.","Fast die gesamte elektrische Energie wird in Wärme umgewandelt.\nZu heiße Bauteile drosseln sich (Throttling) und altern schneller.\nBeispiel: Eine CPU mit 125 W gibt auch ungefähr 125 W Wärme ab."],["kue",0,"Wie funktioniert eine Luftkühlung für die CPU?",["Ein Metallkühlkörper nimmt die Wärme auf, ein Lüfter bläst sie weg","Wasser fließt durch die CPU","Die CPU wird mit Eis gekühlt","Das Netzteil saugt die Wärme ab"],"Heatpipes leiten die Wärme von der CPU in die Kühlrippen.","Die Heatpipes leiten die Wärme von der CPU in die Kühlrippen, der Lüfter bläst Luft hindurch.\nGroße Tower-Kühler sind oft genauso gut wie kleine Wasserkühlungen und langlebiger."],["kue",0,"Woraus besteht eine AIO-Wasserkühlung?",["Pumpe mit Kühlblock, Schläuche und Radiator mit Lüftern","Nur aus einem Lüfter","Aus Wärmeleitpaste und Kabeln","Aus einem Wassertank im Netzteil"],"AIO = All-in-One: geschlossen, vorbefüllt, wartungsarm.","AIO = All-in-One: Pumpe und Kühlblock sitzen auf der CPU, das Wasser transportiert die Wärme zum Radiator.\nRadiatorgrößen: 240 mm, 280 mm, 360 mm.\nWartungsfrei, aber die Pumpe kann nach einigen Jahren ausfallen."],["kue",0,"Wofür ist Wärmeleitpaste?",["Sie füllt winzige Unebenheiten zwischen CPU und Kühler, damit die Wärme besser übergeht","Sie klebt die CPU im Sockel fest","Sie isoliert gegen Strom","Sie ersetzt den Lüfter"],"Luft leitet Wärme schlecht – die Paste verdrängt die Luft aus den Spalten.","Metalloberflächen sind nie perfekt glatt. Ohne Paste bleiben Luftspalte, und Luft leitet Wärme schlecht.\nDie Paste füllt diese Spalte.\nBeim Kühlerwechsel alte Paste mit Isopropylalkohol entfernen."],["kue",0,"Wie viel Wärmeleitpaste trägt man ungefähr auf?",["Etwa erbsengroß bzw. dünn","Die ganze Tube","So viel, dass es an den Seiten rausläuft","Gar keine"],"Zu viel schadet eher. Der Anpressdruck des Kühlers verteilt sie.","Etwa eine erbsengroße Menge in die Mitte – der Anpressdruck verteilt sie.\nZu viel Paste isoliert eher und kann bei leitfähiger Paste Kurzschlüsse verursachen.\nBei großen CPUs (z. B. Threadripper) nimmt man mehr, z. B. als X."],["kue",0,"Wie ist ein typischer Airflow im Gehäuse aufgebaut?",["Kühle Luft vorne/unten rein, warme Luft hinten/oben raus","Alle Lüfter blasen nach innen","Alle Lüfter blasen nach außen","Luft kommt nur durchs Netzteil"],"Warme Luft steigt nach oben – der Airflow nutzt das aus.","Warme Luft steigt nach oben.\nTypisch: vorne 2–3 Lüfter saugen kühle Luft an, hinten und oben blasen Lüfter warme Luft hinaus.\nStaubfilter an den Einlässen halten das Innere sauber."],["kue",0,"Welche Temperatur ist für eine CPU unter Volllast normalerweise noch okay?",["ca. 60–85 °C","ca. 150 °C","ca. 10 °C","über 120 °C"],"Im Leerlauf sind ca. 30–50 °C üblich. Viele CPUs drosseln ab ca. 95–100 °C.","Unter Volllast sind 60–85 °C normal, manche moderne CPUs gehen bewusst bis ca. 95 °C.\nIm Leerlauf liegen typische Werte bei 30–50 °C.\nTools: HWiNFO (Windows), sensors (Linux)."],["kue",0,"Was ist Thermal Throttling?",["Die CPU/GPU senkt ihren Takt, weil sie zu heiß wird","Ein besonders leiser Lüftermodus","Ein Übertaktungs-Feature","Eine Wasserkühlung"],"Schutzmechanismus gegen Überhitzung – kostet aber Leistung.","Throttling schützt die Hardware vor Überhitzung.\nFolge: Leistungseinbruch, z. B. plötzliche FPS-Einbrüche.\nLösungen: Staub entfernen, Wärmeleitpaste erneuern, besseren Kühler oder mehr Gehäuselüfter."],["kue",0,"Was verschlechtert die Kühlung mit der Zeit oft?",["Staub in Lüftern und Kühlrippen","Zu viel RAM","Eine zu schnelle SSD","Ein zu großes Gehäuse"],"Regelmäßig mit Druckluft sauber machen hilft.","Staub setzt Kühlrippen zu und bremst Lüfter.\nAlle paar Monate mit Druckluft reinigen (Lüfter dabei festhalten).\nAuch eingetrocknete Wärmeleitpaste kann nach Jahren die Temperaturen erhöhen."],["kue",0,"Wofür sind Gehäuselüfter da?",["Sie sorgen für den Luftaustausch im ganzen Gehäuse","Sie kühlen nur die Festplatte","Sie versorgen die CPU mit Strom","Sie sind nur Beleuchtung"],"Ohne frische Luft im Gehäuse bringen auch gute CPU-Kühler wenig.","Gehäuselüfter bringen frische Luft hinein und warme Luft hinaus.\nOhne sie staut sich die Wärme von CPU, GPU und Spannungswandlern.\nGrößere Lüfter (140 mm) bewegen viel Luft bei niedriger Drehzahl – leiser."],["ans",0,"Wofür steht USB?",["Universal Serial Bus","Ultra Speed Board","Universal System Backup","Unified Storage Bridge"],"USB ist der universelle Anschluss für Peripherie.","USB = Universal Serial Bus.\nSeriell heißt: Daten werden Bit für Bit nacheinander übertragen.\nUSB ersetzte viele alte Anschlüsse wie PS/2, Parallelport und serielle Schnittstelle."],["ans",0,"Was ist ein Vorteil des USB-C-Steckers?",["Er ist symmetrisch, man kann ihn in beide Richtungen einstecken","Er ist immer schneller als jeder andere Anschluss","Er funktioniert ohne Kabel","Er ist nur für Monitore"],"USB-A passt nur in eine Richtung, USB-C in beide.","USB-C ist klein und punktsymmetrisch.\nDarüber können Daten, Bild (DisplayPort Alt Mode) und viel Strom (USB PD bis 240 W) übertragen werden.\nSeit 2024 ist USB-C in der EU Pflicht für viele Geräte."],["ans",0,"USB-C sagt etwas über … aus:",["die Steckerform – nicht automatisch über die Geschwindigkeit","die Geschwindigkeit","die Farbe","die Kabellänge"],"Ein USB-C-Port kann langsames USB 2.0 oder schnelles USB4 sein.","USB-C ist nur die Steckerform.\nDahinter kann USB 2.0 (480 Mbit/s) oder USB4 (40 Gbit/s) stecken.\nBeispiel: Viele Ladekabel können nur USB 2.0 – für schnelle SSDs ungeeignet."],["ans",0,"Welcher Anschluss ist bei Fernsehern am verbreitetsten und überträgt Bild und Ton?",["HDMI","SATA","Ethernet","Klinke"],"HDMI = Standard bei TVs, Konsolen und vielen Monitoren.","HDMI überträgt digitales Bild und Ton über ein Kabel.\nHDMI 2.1 schafft z. B. 4K mit 120 Hz.\nHDMI-ARC/eARC schickt Ton vom TV zurück zur Soundbar."],["ans",0,"Welcher Anschluss ist bei PC-Monitoren mit hohen Bildwiederholraten besonders üblich?",["DisplayPort","VGA","SATA","USB 2.0"],"DisplayPort ist typisch für Gaming-Monitore mit 144 Hz und mehr.","DisplayPort unterstützt hohe Auflösungen und Bildwiederholraten, z. B. 1440p mit 240 Hz.\nMit Daisy Chaining (MST) kann man mehrere Monitore hintereinander hängen.\nAn Grafikkarten meist mehrfach vorhanden."],["ans",0,"Wie heißt der Stecker eines normalen Netzwerkkabels (Ethernet)?",["RJ45","HDMI","SATA","M.2"],"Der breite Stecker mit der kleinen Rastnase.","RJ45 ist der 8-polige Stecker an Twisted-Pair-Kabeln.\nDer kleinere RJ11 (4–6 Pole) wird für Telefon und DSL verwendet.\nBeim Crimpen gilt meist die Farbbelegung T568B."],["ans",0,"Wie schnell ist Gigabit-Ethernet?",["1000 Mbit/s","1000 MB/s","100 Mbit/s","10 Gbit/s"],"1 Gbit/s ≈ 125 MB/s in der Praxis etwas weniger.","Gigabit = 1000 Mbit/s = ca. 125 MB/s theoretisch, praktisch ca. 110–118 MB/s.\nBeispiel: Eine 10-GB-Datei braucht ca. 80–90 Sekunden.\nNeuere Boards haben 2,5 oder 10 Gbit/s."],["ans",0,"Wofür wird ein SATA-Datenkabel verwendet?",["Zum Anschließen von HDDs und SATA-SSDs ans Mainboard","Für Monitore","Für Kopfhörer","Für das Internet"],"Der Strom kommt separat über den SATA-Stromstecker vom Netzteil.","SATA-Datenkabel verbinden Laufwerke mit dem Mainboard (7-polig, L-förmiger Stecker).\nStrom kommt über ein separates SATA-Stromkabel vom Netzteil."],["ans",0,"Wofür ist PCIe?",["Eine schnelle Schnittstelle für Erweiterungskarten wie Grafikkarten und NVMe-SSDs","Ein Monitoranschluss","Ein Stromstecker","Ein Audioanschluss"],"PCIe gibt es in Breiten wie x1, x4 und x16.","PCIe = Peripheral Component Interconnect Express.\nBreiten: x1, x4, x8, x16. Genutzt für Grafikkarten, NVMe-SSDs, Netzwerk- und Soundkarten.\nJede neue Generation verdoppelt ungefähr die Geschwindigkeit."],["ans",0,"Wofür ist der 3,5-mm-Klinkenanschluss?",["Analoges Audio, z. B. Kopfhörer oder Mikrofon","Netzwerk","Monitor","Festplatten"],"Grün = Lautsprecher/Kopfhörer, Rosa = Mikrofon.","3,5-mm-Klinke überträgt analoge Audiosignale.\nFarben am PC: grün = Lautsprecher/Kopfhörer, rosa = Mikrofon, blau = Line-In.\nViele Handys haben den Anschluss inzwischen nicht mehr."],["ans",0,"Was ist Bluetooth?",["Eine Funktechnik mit kurzer Reichweite, z. B. für Kopfhörer oder Mäuse","Ein Netzwerkkabel","Ein Dateisystem","Ein Monitoranschluss"],"Reichweite typischerweise um die 10 m.","Bluetooth funkt im 2,4-GHz-Band mit typischerweise ca. 10 m Reichweite.\nBeispiele: Kopfhörer, Mäuse, Tastaturen, Smartwatches.\nBluetooth Low Energy (BLE) spart viel Strom – wichtig für IoT-Sensoren."],["ans",0,"Welche Frequenzbänder nutzt WLAN typischerweise?",["2,4 GHz und 5 GHz (neuerdings auch 6 GHz)","230 V und 12 V","HDMI und DP","100 MHz und 200 MHz"],"2,4 GHz: mehr Reichweite; 5 GHz: schneller, aber kürzere Reichweite.","2,4 GHz: größere Reichweite, aber oft überlastet.\n5 GHz: schneller, weniger Reichweite.\n6 GHz (Wi-Fi 6E/7): sehr schnell, kaum Störungen, aber noch geringere Reichweite."],["ans",0,"Welches WLAN-Band hat die größere Reichweite?",["2,4 GHz","5 GHz","6 GHz","Alle gleich"],"Niedrigere Frequenzen durchdringen Wände besser.","Niedrigere Frequenzen durchdringen Wände besser.\nDeshalb ist 2,4 GHz gut für weit entfernte oder IoT-Geräte, 5 GHz für schnelle Verbindungen im selben Raum."],["vm",0,"Was ist eine virtuelle Maschine (VM)?",["Ein per Software simulierter Computer, der auf einem echten Computer läuft","Ein besonders schneller PC","Ein Cloud-Speicher","Eine Grafikkarte"],"In einer VM läuft ein eigenes Betriebssystem, als wäre es ein eigener Rechner.","Die VM hat virtuelle CPU, RAM, Festplatte und Netzwerkkarte.\nBeispiel: Auf deinem Windows-PC läuft in VirtualBox ein Ubuntu – ideal zum Üben, ohne das echte System zu gefährden."],["vm",0,"Was ist der Host?",["Der echte, physische Rechner, auf dem die VMs laufen","Das Betriebssystem in der VM","Der Router","Ein Benutzerkonto"],"Host = Gastgeber.","Der Host stellt CPU, RAM und Speicher bereit, die sich die VMs teilen.\nBeispiel: Ein Server mit Proxmox ist der Host für fünf VMs."],["vm",0,"Was ist der Gast (Guest)?",["Das Betriebssystem, das in der VM läuft","Der physische PC","Der Hypervisor","Das Netzteil"],"Beispiel: Windows als Host, Kali Linux als Gast in VirtualBox.","Der Gast weiß oft gar nicht, dass er virtualisiert ist.\nBeispiel: Windows-Host mit einem Linux-Gast oder Linux-Host (Proxmox) mit Windows-Server-Gast."],["vm",0,"Wie heißt die Software, die VMs erstellt und verwaltet?",["Hypervisor","Kernel","Treiber","Compiler"],"Beispiele: VirtualBox, VMware, Hyper-V, KVM, Proxmox.","Der Hypervisor teilt die echte Hardware auf mehrere VMs auf und trennt sie voneinander.\nBeispiele: VMware ESXi, Proxmox VE, Hyper-V, VirtualBox."],["vm",0,"Was ist ein Typ-2-Hypervisor?",["Einer, der als Programm auf einem normalen Betriebssystem läuft, z. B. VirtualBox","Einer, der direkt auf der Hardware läuft","Ein Hardware-Bauteil","Ein Netzwerkgerät"],"Typ 1 (z. B. Proxmox,
