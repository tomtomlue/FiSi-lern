eändert!"],["dbq",1,"Was passiert bei DELETE FROM kunden; ohne WHERE?",["Alle Datensätze der Tabelle werden gelöscht","Nichts","Die Tabelle wird umbenannt","Nur der erste Datensatz wird gelöscht"],"Ohne Bedingung betrifft der Befehl die ganze Tabelle.","Die Tabellenstruktur bleibt erhalten. DROP TABLE würde die ganze Tabelle entfernen."],["dbq",1,"Womit sortierst du ein Ergebnis in SQL?",["ORDER BY","SORT BY","GROUP BY","ARRANGE"],"ASC = aufsteigend (Standard), DESC = absteigend.","Beispiel: SELECT * FROM mitarbeiter ORDER BY nachname ASC;"],["dbq",1,"Was macht SELECT COUNT(*) FROM tickets;?",["Zählt alle Datensätze in der Tabelle tickets","Löscht alle Tickets","Zeigt alle Tickets an","Summiert die Ticketnummern"],"COUNT ist eine Aggregatfunktion.","Weitere: SUM, AVG, MIN, MAX."],["dbq",3,"Wofür ist GROUP BY?",["Um Datensätze nach gleichen Werten zu gruppieren, z. B. für Summen pro Gruppe","Um Tabellen zu löschen","Um Spalten umzubenennen","Um Benutzer anzulegen"],"Meist zusammen mit Aggregatfunktionen.","Beispiel: SELECT abteilung, COUNT(*) FROM mitarbeiter GROUP BY abteilung; zählt Mitarbeiter pro Abteilung. Filter auf Gruppen mit HAVING."],["dbq",1,"Was macht ein JOIN?",["Er verknüpft Datensätze aus mehreren Tabellen","Er löscht Tabellen","Er erstellt ein Backup","Er verschlüsselt Daten"],"Meist über Primär- und Fremdschlüssel.","Beispiel: SELECT k.name, b.datum FROM kunde k INNER JOIN bestellung b ON k.id = b.kunden_id;"],["dbq",3,"Was liefert ein LEFT JOIN zusätzlich zum INNER JOIN?",["Auch Datensätze der linken Tabelle, die keinen Partner in der rechten haben","Nur Datensätze ohne Partner","Nur die rechte Tabelle","Nichts zusätzlich"],"Fehlende Werte der rechten Tabelle sind dann NULL.","Beispiel: Alle Kunden, auch die, die noch nie bestellt haben."],["dbq",1,"Zu welcher SQL-Kategorie gehört CREATE TABLE?",["DDL – Data Definition Language","DML – Data Manipulation Language","DCL – Data Control Language","DQL"],"DDL definiert Strukturen: CREATE, ALTER, DROP."," äuft als Programm auf einem Betriebssystem (VirtualBox, VMware Workstation)."],["vm",3,"Was ist Live-Migration?",["Eine laufende VM wird ohne Unterbrechung auf einen anderen Host verschoben","Eine VM wird gelöscht","Eine VM wird neu installiert","Ein Backup wird eingespielt"],"Möglich, wenn die Hosts gemeinsamen Speicher nutzen.","So kann man einen Host für Wartung freiräumen, ohne dass die Nutzer etwas merken."],["vm",3,"Was ist Overcommitment?",["Den VMs insgesamt mehr Ressourcen zuzuweisen, als physisch vorhanden sind","Eine VM ohne RAM","Ein Fehler beim Booten","Ein Backup-Verfahren"],"Funktioniert, weil selten alle VMs gleichzeitig alles nutzen.","Bei RAM riskant: Brauchen alle gleichzeitig viel, wird es langsam oder VMs stürzen ab."],["vm",3,"Was ist Thin Provisioning?",["Eine virtuelle Festplatte belegt nur so viel Platz, wie tatsächlich Daten darauf sind","Die Festplatte wird sofort komplett reserviert","Eine besonders schnelle Festplatte","Eine verschlüsselte Festplatte"],"Spart Speicher.","Thick Provisioning reserviert den ganzen Platz sofort. Bei Thin muss man aufpassen, dass der echte Speicher nicht vollläuft."],["vm",2,"Was bewirkt der Netzwerkmodus „Bridge“ bei einer VM?",["Die VM erscheint wie ein eigenes Gerät im echten Netzwerk mit eigener IP","Die VM hat kein Netzwerk","Die VM kann nur mit dem Host sprechen","Die VM teilt sich die IP des Hosts per NAT"],"Die VM hängt quasi direkt am physischen Netz.","NAT: VM surft über die IP des Hosts, ist aber von außen nicht direkt erreichbar. Host-only: nur Verbindung zum Host."],["vm",2,"Was ist der Unterschied zwischen Klon und Snapshot?",["Ein Klon ist eine eigenständige Kopie der VM, ein Snapshot ein Wiederherstellungspunkt derselben VM","Beides ist dasselbe","Ein Snapshot ist eine neue VM","Ein Klon ist ein Backup auf Band"],"Snapshots sind kein Backup!","Snapshots liegen auf demselben Speicher. Geht der kaputt, ist auch der Snapshot weg. Zu viele Snapshots bremsen die VM."],["vm",3,"Was ist VDI (Virtual Desktop Infrastructure)?",["Desktops laufen als VMs im Rechenzentrum und werden über das Netzwerk bereitgestellt","Ein Festplattenformat für USB-Sticks","Ein Grafikkartentreiber","Ein VPN-Protokoll"],"Nutzer arbeiten per Thin Client oder Laptop auf ihrem virtuellen Desktop.","Vorteile: zentrale Verwaltung, Daten bleiben im Rechenzentrum. Nachteil: Braucht gute Netzwerkverbindung."],["cpu",2,"Was gibt die TDP einer CPU an?",["Die Wärmeleistung, für die die Kühlung ausgelegt sein sollte (in Watt)","Die Taktfrequenz","Die Anzahl der Kerne","Die Cache-Größe"],"TDP = Thermal Design Power.","Der tatsächliche Verbrauch kann unter Last kurzzeitig darüber liegen (Boost). Der Kühler sollte mindestens die TDP abführen können."],["cpu",2,"Was ist der Unterschied zwischen x86 und ARM?",["Unterschiedliche Befehlssatzarchitekturen – ARM ist vor allem sehr energieeffizient","ARM ist eine Grafikkarte","x86 ist nur für Handys","Es gibt keinen"],"Programme müssen für die jeweilige Architektur übersetzt sein.","x86-64: Intel/AMD-PCs und Server. ARM: Smartphones, Raspberry Pi, Apple M-Chips, zunehmend Server."],["cpu",2,"Was ist Übertakten?",["Die CPU über ihrer Standard-Taktfrequenz betreiben","Die CPU langsamer machen","Zusätzliche Kerne einbauen","Die CPU mit Wasser kühlen"],"Mehr Leistung, aber mehr Wärme und Stromverbrauch.","Bei Intel nur mit „K“-Modellen und passendem Chipsatz; bei AMD Ryzen weitgehend möglich. Kann Stabilität und Garantie gefährden."],["cpu",3,"Was bedeutet IPC?",["Instructions per Cycle – Befehle pro Takt","Integrated Power Circuit","Internet Protocol Control","Intel Processor Core"],"Leistung ≈ IPC × Takt × Kerne.","Deshalb kann eine neuere CPU mit weniger GHz schneller sein als eine alte mit mehr GHz."],["cpu",3,"Was ist ein Befehlssatz-Erweiterung wie AVX oder AES-NI?",["Zusätzliche CPU-Befehle für spezielle Aufgaben wie Vektorrechnung oder Verschlüsselung","Eine Art RAM","Ein Kühler","Ein Mainboard-Chipsatz"],"Beschleunigt bestimmte Programme stark.","AES-NI macht z. B. BitLocker, VPN und HTTPS kaum spürbar langsamer."],["ram",2,"Was ist ECC-RAM?",["Arbeitsspeicher, der Speicherfehler erkennen und korrigieren kann","Besonders schneller Gaming-RAM","RAM mit RGB-Beleuchtung","Externer Speicher"],"ECC = Error Correction Code.","Standard in Servern, weil einzelne gekippte Bits sonst unbemerkt Daten beschädigen oder Abstürze verursachen könnten."],["ram",3,"Was gibt die CAS-Latenz (CL) beim RAM an?",["Die Verzögerung in Takten, bis Daten nach einer Anfrage geliefert werden","Die Kapazität","Die Spannung","Die Anzahl der Module"],"Kleiner ist besser – bei gleichem Takt.","Beispiel: DDR5-6000 CL30 ist schneller als DDR5-6000 CL40. Die echte Latenz hängt von Takt und CL zusammen ab."],["ram",2,"Was sind XMP bzw. EXPO?",["Gespeicherte RAM-Profile, mit denen der RAM im UEFI auf seine beworbene Geschwindigkeit gestellt wird","Ein Virenscanner","Ein Dateisystem","Eine Grafiktechnik"],"Ohne Profil läuft RAM oft nur mit Standardtakt.","XMP = Intel Extreme Memory Profile, EXPO = AMDs Gegenstück. Muss im UEFI aktiviert werden."],["sp",2,"Was gibt TBW bei einer SSD an?",["Wie viele Terabyte insgesamt geschrieben werden können, bevor die SSD als verschlissen gilt","Die Lesegeschwindigkeit","Die Kapazität","Die Temperatur"],"TBW = Terabytes Written.","Flash-Zellen verschleißen durch Schreibvorgänge. Für normale Nutzer reicht die TBW meist für viele Jahre."],["sp",3,"Wofür ist TRIM bei SSDs?",["Das Betriebssystem teilt der SSD mit, welche Blöcke nicht mehr benötigt werden","Es verkleinert Partitionen","Es defragmentiert die SSD","Es verschlüsselt Daten"],"Hält die SSD schnell.","SSDs sollte man nicht defragmentieren – das bringt nichts und verursacht unnötige Schreibvorgänge."],["sp",2,"Was ist S.M.A.R.T.?",["Eine Selbstüberwachung von Festplatten und SSDs, die Zustandswerte liefert","Ein Dateisystem","Ein RAID-Level","Ein Backup-Programm"],"Frühwarnsystem für Laufwerksausfälle.","Werte wie reallocated sectors oder Temperatur. Tools: CrystalDiskInfo (Windows), smartctl (Linux)."],["sp",3,"Was gibt IOPS an?",["Ein-/Ausgabeoperationen pro Sekunde","Die Kapazität in GB","Die Stromaufnahme","Die Umdrehungen pro Minute"],"Wichtig für viele kleine Zugriffe, z. B. bei Datenbanken und VMs.","Eine HDD schafft ca. 100–200 IOPS, eine NVMe-SSD Hunderttausende."],["sp",2,"Welche Drehzahl haben typische HDDs?",["5400 oder 7200 U/min","100 U/min","50.000 U/min","HDDs drehen sich nicht"],"Höhere Drehzahl = kürzere Zugriffszeit.","Server-HDDs hatten früher auch 10.000 oder 15.000 U/min – dort sind heute SSDs üblich."],["nt",1,"Was ist eine USV?",["Eine unterbrechungsfreie Stromversorgung, die bei Stromausfall mit Akkus überbrückt","Ein USB-Verteiler","Ein Netzwerkswitch","Ein Monitorkabel"],"USV = Unterbrechungsfreie Stromversorgung (englisch UPS).","Gibt Servern Zeit, sauber herunterzufahren, und schützt vor Spannungsspitzen."],["nt",3,"Welche USV-Bauart bietet den besten Schutz, weil die Last dauerhaft über den Wechselrichter läuft?",["Online-USV (VFI, Doppelwandler)","Offline-USV (VFD)","Line-Interactive (VI)","Steckdosenleiste"],"Online-USVs haben keine Umschaltzeit.","Offline: günstig, schaltet erst bei Ausfall um (einige ms). Line-Interactive: gleicht zusätzlich Spannungsschwankungen aus. Online: bester Schutz, aber teuer und weniger effizient."],["nt",2,"Was ist ein Unterschied zwischen VA und Watt bei einer USV?",["VA ist die Scheinleistung, Watt die Wirkleistung – Watt ist meist kleiner","Beides ist immer gleich","Watt ist immer größer","VA gibt die Akkulaufzeit an"],"Wirkleistung = Scheinleistung × Leistungsfaktor.","Beispiel: 1000 VA bei Leistungsfaktor 0,6 = 600 W. Beim Dimensionieren auf die Watt-Angabe achten!"],["nt",3,"Was ist aktive PFC bei Netzteilen?",["Eine Leistungsfaktorkorrektur, die das Netzteil netzfreundlicher und effizienter macht","Ein Überhitzungsschutz für die CPU","Ein Lüftermodus","Ein zusätzlicher Stromstecker"],"PFC = Power Factor Correction.","Bei hochwertigen Netzteilen Standard und in der EU ab bestimmten Leistungen vorgeschrieben."],["gpu",2,"Was ist Raytracing?",["Eine Technik, die Lichtstrahlen simuliert, um realistische Beleuchtung und Spiegelungen zu berechnen","Ein Kühlverfahren","Ein Monitoranschluss","Ein Treiberupdate"],"Sehr rechenintensiv.","Moderne GPUs haben spezielle RT-Kerne dafür. Upscaling wie DLSS oder FSR hilft, die Bildrate trotzdem hoch zu halten."],["gpu",2,"Warum sollte man Grafiktreiber aktuell halten?",["Für bessere Leistung, Fehlerbehebungen und Unterstützung neuer Spiele","Weil die GPU sonst kein Bild ausgibt","Weil sonst der RAM kaputtgeht","Das ist nicht nötig"],"Treiber werden laufend optimiert.","Treiber am besten direkt vom Hersteller (NVIDIA, AMD, Intel). Bei Problemen hilft oft eine saubere Neuinstallation."],["mb",3,"Was sind PCIe-Lanes?",["Datenleitungen der PCIe-Schnittstelle – mehr Lanes bedeuten mehr Bandbreite","Kabel des Netzteils","RAM-Kanäle","Lüfteranschlüsse"],"x1, x4, x8, x16 = Anzahl der Lanes.","Die CPU und der Chipsatz haben nur begrenzt viele Lanes. Belegt man bestimmte M.2-Slots, werden manchmal andere Anschlüsse deaktiviert."],["mb",3,"Was sind die VRMs auf einem Mainboard?",["Spannungswandler, die die CPU mit der passenden, stabilen Spannung versorgen","RAM-Slots","Netzwerkchips","Lüfter"],"VRM = Voltage Regulator Module.","Starke CPUs brauchen gute VRMs mit Kühlkörpern – besonders beim Übertakten wichtig."],["mb",2,"Was ist ein TPM-Chip?",["Ein Sicherheitschip, der z. B. Schlüssel für BitLocker sicher speichert","Ein Temperatur-Sensor","Ein Soundchip","Ein Grafikchip"],"TPM = Trusted Platform Module.","Windows 11 setzt TPM 2.0 voraus. Oft ist es als fTPM (AMD) bzw. PTT (Intel) in der CPU integriert und muss im UEFI aktiviert sein."],["mb",2,"Was ist Secure Boot?",["Eine UEFI-Funktion, die nur signierte, vertrauenswürdige Bootloader starten lässt","Ein Passwort für Windows","Ein schneller Startmodus","Ein Virenscanner"],"Schützt vor Bootkits (Schadsoftware, die sich vor dem OS lädt).","Manche Linux-Distributionen oder eigene Kernel-Module brauchen dafür signierte Komponenten."],["ans",2,"Was ist Thunderbolt?",["Eine sehr schnelle Schnittstelle über USB-C, die Daten, Bild und Strom überträgt","Ein WLAN-Standard","Ein Grafikchip","Ein Netzwerkprotokoll"],"Thunderbolt 3/4 bis 40 Gbit/s, Thunderbolt 5 bis 80 Gbit/s.","Damit lassen sich z. B. Docking-Stations mit mehreren Monitoren an einem einzigen Kabel betreiben."],["ans",2,"Wie schnell ist USB 3.2 Gen 1 (früher USB 3.0)?",["5 Gbit/s","480 Mbit/s","20 Gbit/s","40 Gbit/s"],"USB 2.0 = 480 Mbit/s.","USB 3.2 Gen 2 = 10 Gbit/s, Gen 2x2 = 20 Gbit/s, USB4 = bis 40 (bzw. 80) Gbit/s. Blaue Buchse = oft USB 3.x."],["kue",2,"Was ist ein Radiator bei einer Wasserkühlung?",["Ein Wärmetauscher, in dem das Wasser durch Lüfter gekühlt wird","Die Pumpe","Der Ausgleichsbehälter","Ein Heizkörper im Serverraum"],"Größe wird in mm angegeben, z. B. 240 mm oder 360 mm.","Größerer Radiator = mehr Kühlfläche = leiser oder kühler."],["kue",3,"Was bedeutet positiver Luftdruck im Gehäuse?",["Es wird mehr Luft hinein- als hinausgeblasen – weniger Staub kommt durch Ritzen","Das Gehäuse ist luftdicht","Es gibt keine Lüfter","Die Luft ist besonders kalt"],"Mehr Einlass- als Auslasslüfter-Leistung.","Die Luft entweicht dann durch Spalten, statt ungefilterten Staub hineinzuziehen – vorausgesetzt, die Einlässe haben Staubfilter."],["kue",2,"Wie werden Server im Rechenzentrum oft gekühlt?",["Mit Warm- und Kaltgang-Einhausung und Klimaanlagen","Mit offenen Fenstern","Mit Wärmeleitpaste allein","Gar nicht"],"Kalte Luft wird gezielt vorne angesaugt, warme hinten abgeführt.","Die Server-Racks stehen so, dass sich Vorder- und Rückseiten gegenüberstehen. So mischen sich warme und kalte Luft nicht."],["g",1,"Was versteht man unter Peripheriegeräten?",["Geräte, die an den Computer angeschlossen werden, z. B. Tastatur, Maus, Drucker","Die Bauteile auf dem Mainboard","Nur Monitore","Programme auf dem PC"],"Peripherie = alles „um den Rechner herum“.","Man unterscheidet Eingabegeräte (Tastatur, Scanner), Ausgabegeräte (Monitor, Drucker) und Speichergeräte (externe Festplatte)."],["g",1,"Was ist Firmware?",["Fest in einem Gerät gespeicherte Software, die die Hardware steuert","Ein Office-Programm","Ein Netzwerkkabel","Eine Art Virus"],"Sitzt zwischen Hardware und Software.","Beispiele: UEFI im PC, Software im Router, Controller-Software einer SSD. Firmware-Updates schließen oft Sicherheitslücken."],["g",1,"Was ist der Unterschied zwischen Hardware und Software?",["Hardware sind die physischen Bauteile, Software die Programme","Hardware ist immer teurer","Software kann man anfassen","Es gibt keinen"],"Faustregel: Was man anfassen kann, ist Hardware.","Hardware: CPU, RAM, Tastatur. Software: Betriebssystem, Browser, Treiber. Firmware liegt dazwischen – Software, fest in Hardware gespeichert."],["g",1,"Was ist der Unterschied zwischen Anwendungs- und Systemsoftware?",["Systemsoftware betreibt den Rechner (z. B. Betriebssystem), Anwendungssoftware erledigt Aufgaben für Nutzer (z. B. Word)","Es gibt keinen","Anwendungssoftware ist immer kostenlos","Systemsoftware läuft nur auf Servern"],"Zwei Grundkategorien von Software.","Systemsoftware: OS, Treiber, Firmware. Anwendungssoftware: Browser, Office, Spiele."],["g",1,"Was bedeutet Open Source?",["Der Quellcode ist öffentlich einsehbar und darf meist verändert und weitergegeben werden","Die Software ist immer kostenlos und ohne Lizenz","Die Software ist nur online nutzbar","Die Software hat keine Fehler"],"Lizenzen wie GPL, MIT oder Apache regeln die Bedingungen.","Beispiele: Linux, Firefox, LibreOffice. Gegenteil: proprietäre Software wie Windows."],["g",2,"Was ist die Von-Neumann-Architektur?",["Ein Rechnerkonzept, bei dem Programme und Daten im selben Speicher liegen","Ein Netzwerkmodell","Eine Programmiersprache","Ein Kühlsystem"],"Grundlage fast aller heutigen Computer.","Bestandteile: Rechenwerk, Steuerwerk, Speicher, Ein-/Ausgabe, verbunden über ein Bussystem. Engpass: der gemeinsame Bus („Von-Neumann-Flaschenhals“)."],["g",2,"Was ist ein Bussystem im Computer?",["Ein gemeinsamer Übertragungsweg für Daten zwischen Komponenten","Ein Kühlkanal","Ein Stromkabel","Ein Programm zum Planen"],"Über Busse kommunizieren CPU, RAM und Geräte.","Man unterscheidet Datenbus, Adressbus und Steuerbus. Beispiel für moderne Busse: PCIe."],["g",2,"Was ist der Unterschied zwischen 32- und 64-Bit-Systemen?",["64 Bit kann deutlich mehr Arbeitsspeicher adressieren und größere Datenwörter verarbeiten","32 Bit ist schneller","64 Bit braucht keinen RAM","Es gibt keinen Unterschied"],"32 Bit kann nur ca. 4 GB RAM adressieren.","2^32 Byte = 4 GiB. Mit 64 Bit sind theoretisch 16 Exbibyte möglich. Moderne Systeme sind fast nur noch 64 Bit."],["g",2,"Was bedeutet Abwärtskompatibilität?",["Neue Technik funktioniert auch mit älteren Geräten oder Standards","Ein Gerät funktioniert nur mit der neuesten Technik","Ein Gerät wird langsamer","Software wird gelöscht"],"Häufig bei Schnittstellen.","Beispiel: Ein USB-3-Stick funktioniert an einem USB-2-Port, aber nur mit USB-2-Geschwindigkeit."],["g",2,"Was ist ein Embedded System?",["Ein in ein Gerät eingebetteter Computer für eine bestimmte Aufgabe","Ein Server im Rack","Ein Laptop","Eine Cloud-Plattform"],"Spezialisiert und meist ohne klassische Tastatur/Bildschirm.","Beispiele: Steuerung einer Waschmaschine, ABS im Auto, Router."],["g",3,"Was ist der Unterschied zwischen CISC und RISC?",["CISC hat viele komplexe Befehle, RISC wenige einfache, schnell ausführbare Befehle","RISC ist immer langsamer","CISC gibt es nur in Handys","Es sind zwei RAM-Typen"],"x86 gilt als CISC, ARM als RISC.","Moderne x86-CPUs zerlegen komplexe Befehle intern in einfache Mikro-Operationen – die Grenzen verschwimmen."],["g",3,"Was ist Moores Gesetz?",["Die Beobachtung, dass sich die Transistorzahl auf Chips etwa alle zwei Jahre verdoppelt","Ein Gesetz zum Datenschutz","Eine Formel für Stromverbrauch","Eine Netzwerkregel"],"Kein Naturgesetz, sondern eine Beobachtung von Gordon Moore (Intel).","In den letzten Jahren verlangsamt sich der Trend, weil Strukturen an physikalische Grenzen stoßen."],["g",3,"Was ist der Unterschied zwischen Harvard- und Von-Neumann-Architektur?",["Harvard nutzt getrennte Speicher und Busse für Befehle und Daten","Harvard hat keinen Speicher","Von Neumann trennt Befehle und Daten","Es gibt keinen Unterschied"],"Getrennte Wege ermöglichen gleichzeitigen Zugriff.","Harvard findet man z. B. in Mikrocontrollern und in den getrennten L1-Caches (Befehle/Daten) moderner CPUs."],["g",3,"Was bedeutet Latenz im Unterschied zu Bandbreite?",["Latenz ist die Verzögerung bis zur ersten Antwort, Bandbreite die Datenmenge pro Zeit","Beides ist dasselbe","Latenz ist die Datenmenge","Bandbreite ist die Verzögerung"],"Zwei unterschiedliche Leistungsmerkmale.","Bild: Eine Autobahn mit vielen Spuren (hohe Bandbreite) kann trotzdem lang sein (hohe Latenz). Für Spiele zählt Latenz, für Downloads Bandbreite."],["g",3,"Was ist ein Interrupt?",["Ein Signal, das die CPU veranlasst, ihre Arbeit zu unterbrechen und ein Ereignis zu bearbeiten","Ein Stromausfall","Ein Netzwerkfehler","Ein Absturz des Programms"],"Damit müssen Geräte nicht ständig abgefragt werden.","Beispiel: Ein Tastendruck löst einen Interrupt aus; die CPU verarbeitet ihn und macht danach weiter."],["cpu",1,"Was macht die CPU?",["Sie führt die Befehle von Programmen aus und rechnet","Sie speichert Daten dauerhaft","Sie stellt das Bild dar","Sie versorgt den PC mit Strom"],"Die CPU ist das „Gehirn“ des Computers.","Sie besteht u. a. aus Rechenwerk (ALU), Steuerwerk, Registern und Cache."],["cpu",1,"Was bedeutet 4,5 GHz bei einer CPU?",["4,5 Milliarden Takte pro Sekunde","4,5 Kerne","4,5 GB Cache","4,5 Watt Verbrauch"],"GHz = Gigahertz = Milliarden Schwingungen pro Sekunde.","Mehr Takt allein heißt nicht automatisch schneller – Architektur (IPC) und Kerne zählen mit."],["cpu",1,"Wozu braucht die CPU einen Kühler?",["Weil sie im Betrieb Wärme erzeugt und sonst überhitzt","Damit sie leiser ist","Damit sie mehr RAM hat","Nur zur Optik"],"Zu heiß → CPU drosselt sich (Throttling) oder schaltet ab.","Zwischen CPU und Kühler kommt Wärmeleitpaste."],["cpu",1,"Was ist eine iGPU?",["Eine in die CPU integrierte Grafikeinheit","Eine externe Grafikkarte","Ein Netzwerkchip","Ein RAM-Riegel"],"Reicht für Büro und Videos.","Bei Intel oft „UHD/Iris Xe Graphics“, bei AMD die „G“-Modelle. Mit iGPU kann man einen PC auch ohne Grafikkarte betreiben."],["cpu",1,"Wofür stehen Intel und AMD im PC-Bereich?",["Die beiden großen Hersteller von x86-Prozessoren","Zwei Betriebssysteme","Zwei Grafikkartenmarken nur","Zwei Speicherformate"],"Beide bauen CPUs für Desktop, Laptop und Server.","Intel: Core, Xeon. AMD: Ryzen, EPYC. Die CPUs brauchen jeweils passende Sockel und Chipsätze."],["cpu",2,"Was ist Throttling bei einer CPU?",["Die CPU senkt ihren Takt, um Überhitzung oder zu hohen Verbrauch zu vermeiden","Die CPU übertaktet sich","Ein Kühlerhersteller","Ein Befehlssatz"],"Schutzmechanismus.","Ursachen: schlechter Kühler, eingetrocknete Wärmeleitpaste, Staub. Folge: spürbar weniger Leistung."],["cpu",2,"Was bedeutet der Boost-Takt einer CPU?",["Die CPU kann kurzfristig höher takten, wenn Kühlung und Strom es zulassen","Die dauerhafte Mindestgeschwindigkeit","Die Taktfrequenz des RAM","Der Takt der Grafikkarte"],"Basis-Takt = garantierter Takt, Boost = maximal möglicher.","Meist boosten nur wenige Kerne voll, bei Last auf allen Kernen ist der Takt niedriger."],["cpu",3,"Was ist Pipelining in einer CPU?",["Befehle werden in Stufen zerlegt und überlappend bearbeitet","Die CPU wird mit Wasser gekühlt","Mehrere CPUs werden verbunden","Befehle werden gelöscht"],"Wie ein Fließband.","Während ein Befehl ausgeführt wird, wird der nächste schon dekodiert und der übernächste geholt – das erhöht den Durchsatz."],["cpu",3,"Was ist Sprungvorhersage (Branch Prediction)?",["Die CPU rät, welcher Programmzweig als Nächstes kommt, und arbeitet vorab weiter","Ein Kühlverfahren","Ein Überspannungsschutz","Ein Netzwerkprotokoll"],"Hält die Pipeline gefüllt.","Liegt sie falsch, wird die Vorarbeit verworfen. Sicherheitslücken wie Spectre nutzten diese spekulative Ausführung aus."],["cpu",3,"Was sind P-Cores und E-Cores?",["Leistungs- und Effizienzkerne in hybriden CPUs","Zwei Sockeltypen","RAM-Kanäle","Grafik- und Soundkerne"],"Hybride Architektur, z. B. bei Intel seit der 12. Generation.","P-Cores für schwere Aufgaben, E-Cores für Hintergrundarbeit – das spart Strom. Das Betriebssystem muss die Kerne passend zuweisen."],["ram",1,"Wo werden RAM-Module eingesetzt?",["In die RAM-Steckplätze (DIMM-Slots) auf dem Mainboard","In den PCIe-Slot","In das Netzteil","In den M.2-Slot"],"Meist 2 oder 4 Slots neben dem CPU-Sockel.","Beim Einsetzen die Halteklammern öffnen und das Modul gerade hineindrücken, bis es einrastet."],["ram",1,"Was ist die Einbauform für Desktop-RAM?",["DIMM","SO-DIMM","M.2","SATA"],"DIMM = lange Riegel für Desktop-PCs.","SO-DIMM sind kürzere Module für Laptops und Mini-PCs."],["ram",1,"Warum wird ein PC mit zu wenig RAM langsam?",["Er muss Daten auf den viel langsameren Datenträger auslagern","Die CPU schaltet Kerne ab","Das Netzteil liefert weniger Strom","Die Grafikkarte übernimmt"],"Auslagerung = Pagefile (Windows) bzw. Swap (Linux).","Selbst eine SSD ist um ein Vielfaches langsamer als RAM."],["ram",1,"Passen DDR4-Module in einen DDR5-Steckplatz?",["Nein, die Kerbe sitzt an einer anderen Stelle","Ja, immer","Nur mit Adapter-Software","Nur bei Laptops"],"Die Kerben verhindern falsches Einsetzen.","Mainboards unterstützen immer nur eine DDR-Generation."],["ram",1,"Wie viel RAM ist für einen normalen Büro-PC heute sinnvoll?",["ca. 16 GB","ca. 512 MB","ca. 256 GB","ca. 1 GB"],"8 GB reicht knapp, 16 GB ist komfortabel.","Für Gaming 32 GB, für Server und Virtualisierung oft 64 GB und mehr."],["ram",2,"Was bringt Dual-Channel?",["Zwei Module arbeiten parallel und verdoppeln die Bandbreite","Doppelte Kapazität pro Modul","Weniger Stromverbrauch","Nichts"],"Deshalb besser 2 × 8 GB statt 1 × 16 GB.","Die Module müssen in den richtigen Slots stecken (Handbuch, meist A2 und B2)."],["ram",2,"Was ist Swap (Linux) bzw. die Auslagerungsdatei (Windows)?",["Speicherplatz auf dem Datenträger, der als RAM-Ersatz dient","Ein zweiter RAM-Riegel","Ein Cache der CPU","Eine Partition für das Backup"],"Wird genutzt, wenn der RAM voll ist.","Viel Swap-Nutzung ist ein Zeichen, dass RAM fehlt. Unter Linux: free -h zeigt die Swap-Nutzung."],["ram",2,"Was bedeutet „DDR“ bei RAM?",["Double Data Rate – Datenübertragung zweimal pro Takt","Dynamic Direct RAM","Dual Disk Read","Data Delivery Route"],"Übertragen wird bei steigender und fallender Taktflanke.","Deshalb ist der „effektive“ Takt doppelt so hoch wie der echte (z. B. DDR5-6000 bei 3000 MHz)."],["ram",3,"Was ist der Unterschied zwischen SRAM und DRAM?",["SRAM ist schneller und teurer (Cache), DRAM muss ständig aufgefrischt werden (Arbeitsspeicher)","DRAM ist schneller","SRAM ist nicht flüchtig","Es gibt keinen"],"SRAM speichert mit Flipflops, DRAM mit Kondensatoren.","Deshalb ist der CPU-Cache SRAM (klein, schnell) und der Arbeitsspeicher DRAM (groß, günstig)."],["ram",3,"Was ist Registered (RDIMM) RAM?",["Server-RAM mit Pufferchip, der mehr Module pro Kanal ermöglicht","RAM mit Garantie-Registrierung","Laptop-RAM","RAM ohne Fehlerkorrektur"],"Das Register puffert Steuersignale.","Ermöglicht sehr große RAM-Mengen in Servern, kostet etwas Latenz. Normale Desktop-Boards unterstützen RDIMMs nicht."],["ram",3,"Wie viel RAM kann ein 32-Bit-System maximal direkt adressieren?",["4 GiB","16 GiB","2 GiB","Unbegrenzt"],"2^32 Byte = 4.294.967.296 Byte = 4 GiB.","Praktisch waren oft nur ca. 3,2–3,5 GB nutzbar, weil Adressen auch für Geräte reserviert wurden."],["ram",3,"Was ist Dual-Rank bzw. Single-Rank bei RAM-Modulen?",["Die Anzahl der Chip-Gruppen, die unabhängig angesprochen werden","Die Anzahl der Kerben","Die Einbauhöhe","Die Farbe der Platine"],"Rank = Satz von Chips, der zusammen 64 Bit liefert.","Dual-Rank kann durch Verschränkung (Interleaving) etwas schneller sein, belastet aber den Speichercontroller stärker."],["mb",1,"Was ist das Mainboard?",["Die Hauptplatine, die alle Komponenten verbindet","Die Grafikkarte","Das Netzteil","Der Monitor"],"Auch Motherboard genannt.","Darauf sitzen CPU-Sockel, RAM-Slots, Chipsatz, Anschlüsse und Steckplätze."],["mb",1,"Was ist der CPU-Sockel?",["Die Halterung auf dem Mainboard, in die die CPU eingesetzt wird","Ein Stromanschluss","Ein USB-Port","Ein RAM-Slot"],"CPU und Sockel müssen zusammenpassen.","Beispiele: AM5 (AMD), LGA1700 bzw. LGA1851 (Intel)."],["mb",1,"Was ist ATX?",["Ein Formfaktor, der Größe und Aufbau von Mainboards und Gehäusen festlegt","Ein Prozessor","Ein Speichertyp","Ein Netzwerkstandard"],"ATX ist der Standard für Desktop-PCs.","Kleinere Varianten: Micro-ATX und Mini-ITX. Gehäuse muss zum Formfaktor passen."],["mb",1,"Wofür ist die CMOS-Batterie auf dem Mainboard?",["Sie versorgt Uhr und UEFI-Einstellungen, wenn der PC vom Strom getrennt ist","Sie ersetzt das Netzteil","Sie lädt den Laptop-Akku","Sie kühlt den Chipsatz"],"Meist eine Knopfzelle CR2032.","Ist sie leer, geht nach dem Ausschalten die Uhrzeit verloren."],["mb",1,"Womit startet man das UEFI-Setup meistens?",["Mit einer Taste wie Entf oder F2 direkt nach dem Einschalten","Mit Strg+Alt+Entf in Windows","Über den Explorer","Gar nicht"],"Die Taste wird beim Start meist kurz angezeigt.","Alternativ unter Windows: Einstellungen → Wiederherstellung → Erweiterter Start → UEFI-Firmwareeinstellungen."],["mb",2,"Was ist der POST?",["Der Selbsttest der Hardware beim Einschalten","Ein Netzwerkprotokoll","Ein Treiber","Ein Stromanschluss"],"POST = Power-On Self-Test.","Bei Fehlern gibt es Pieptöne, Debug-LEDs oder Codes auf dem Mainboard."],["mb",2,"Was ist der Chipsatz auf dem Mainboard?",["Er steuert die Kommunikation zwischen CPU und weiteren Komponenten wie USB und SATA","Der Hauptprozessor","Ein Kühler","Ein RAM-Modul"],"Bestimmt, welche Funktionen das Board hat.","Beispiele: Intel Z890/B860, AMD X870/B850. „Z“ bzw. „X“ erlauben meist Übertakten."],["mb",2,"Was bedeutet ein Mainboard-UEFI-Update (BIOS-Update)?",["Die Firmware des Mainboards wird aktualisiert, z. B. für neue CPUs oder Fehlerbehebungen","Das Betriebssystem wird aktualisiert","Der Treiber der Grafikkarte wird installiert","Der RAM wird formatiert"],"Kann nötig sein, damit neue CPUs erkannt werden.","Nie während des Updates den Strom trennen! Manche Boards haben BIOS-Flashback als Notfallfunktion."],["mb",3,"Was ist der Unterschied zwischen MBR und GPT?",["GPT unterstützt Datenträger über 2 TB und mehr Partitionen, MBR ist das ältere Schema","MBR ist neuer","GPT funktioniert nur mit HDDs","Es gibt keinen"],"GPT gehört zu UEFI, MBR zum alten BIOS.","MBR: max. 4 primäre Partitionen, max. 2 TiB. GPT: 128 Partitionen (Windows), riesige Datenträger."],["mb",3,"Was bedeutet CSM im UEFI?",["Ein Kompatibilitätsmodus, um ältere Betriebssysteme im Legacy-BIOS-Modus zu starten","Ein Kühlmodus","Ein Stromsparmodus","Ein Passwortschutz"],"CSM = Compatibility Support Module.","Für Secure Boot und Windows 11 muss CSM aus sein und der Datenträger GPT nutzen."],["mb",3,"Was sind PCIe-Generationen und was ändert sich zwischen ihnen?",["Mit jeder Generation verdoppelt sich ungefähr die Bandbreite pro Lane","Die Stecker werden größer","Die Spannung verdoppelt sich","Nichts"],"PCIe 3.0 ≈ 1 GB/s pro Lane, 4.0 ≈ 2 GB/s, 5.0 ≈ 4 GB/s.","Die Generationen sind abwärtskompatibel – es gilt die niedrigere Version von Karte und Slot."],["sp",1,"Was ist der Hauptvorteil einer SSD gegenüber einer HDD?",["Deutlich schneller und ohne bewegliche Teile","Immer größer","Immer billiger pro TB","Braucht keinen Anschluss"],"SSDs speichern in Flash-Chips.","Der PC startet in Sekunden. HDDs sind dafür günstiger pro Terabyte."],["sp",1,"Was ist ein Dateisystem?",["Die Struktur, wie Dateien auf einem Datenträger organisiert werden","Ein Ordner auf dem Desktop","Ein Backup-Programm","Ein Kabel"],"Beispiele: NTFS, FAT32, exFAT, ext4.","Ohne Dateisystem wüsste das Betriebssystem nicht, wo welche Datei liegt."],["sp",1,"Was macht das Formatieren eines Datenträgers?",["Es legt ein neues Dateisystem an – vorhandene Daten gehen (scheinbar) verloren","Es beschleunigt die CPU","Es installiert Windows","Es verschlüsselt den Datenträger"],"Schnellformatierung löscht nur das Inhaltsverzeichnis.","Daten lassen sich danach oft noch wiederherstellen – zum sicheren Löschen braucht es Überschreiben oder Secure Erase."],["sp",1,"Wofür steht unter Windows meistens das Laufwerk C:?",["Für das Systemlaufwerk, auf dem Windows installiert ist","Für das CD-Laufwerk","Für die Cloud","Für den USB-Stick"],"C: ist traditionell die Systempartition.","A: und B: waren früher für Disketten reserviert, deshalb beginnt die Festplatte bei C:."],["sp",1,"Welches Dateisystem eignet sich gut für USB-Sticks, die an Windows und Mac genutzt werden?",["exFAT","ext4","NTFS nur","APFS"],"exFAT hat keine 4-GB-Grenze wie FAT32 und wird von Windows und macOS unterstützt.","NTFS kann macOS standardmäßig nur lesen, ext4 kennt Windows gar nicht."],["sp",2,"Warum eignet sich FAT32 nicht für eine 8-GB-Videodatei?",["FAT32 erlaubt nur Dateien bis 4 GB","FAT32 ist zu langsam","FAT32 unterstützt keine Videos","FAT32 funktioniert nur unter Linux"],"Maximale Dateigröße: 4 GiB minus 1 Byte.","Lösung: exFAT (für USB-Sticks zwischen Windows und Mac) oder NTFS."],["sp",2,"Was ist Journaling bei einem Dateisystem?",["Änderungen werden vorab protokolliert, damit das Dateisystem nach einem Absturz konsistent bleibt","Ein Tagebuch des Nutzers","Ein Backup in die Cloud","Die Verschlüsselung von Dateien"],"Schützt vor Beschädigung bei Stromausfall.","NTFS und ext4 nutzen Journaling, FAT32 nicht."],["sp",3,"Was ist Wear Leveling bei SSDs?",["Schreibvorgänge werden gleichmäßig auf alle Speicherzellen verteilt","Die SSD wird gekühlt","Daten werden komprimiert","Die SSD wird defragmentiert"],"Verlängert die Lebensdauer.","Ohne Wear Leveling würden oft beschriebene Zellen (z. B. für Logs) viel früher verschleißen."],["sp",3,"Was ist der Unterschied zwischen SLC, MLC, TLC und QLC?",["Wie viele Bit pro Flash-Zelle gespeichert werden – mehr Bit = günstiger, aber langsamer und weniger haltbar","Die Anschlussart","Die Größe der SSD in TB","Die Farbe der SSD"],"SLC 1 Bit, MLC 2, TLC 3, QLC 4 Bit pro Zelle.","QLC-SSDs sind günstig und groß, werden bei langen Schreibvorgängen aber deutlich langsamer."],["sp",3,"Was ist ein Inode in Linux-Dateisystemen?",["Eine Datenstruktur mit Metadaten einer Datei wie Rechte, Besitzer und Speicherort","Ein Dateiname","Ein Ordner","Eine Partition"],"Der Dateiname steht im Verzeichnis, alles andere im Inode.","Sind alle Inodes belegt (viele kleine Dateien), kann man trotz freiem Platz nichts mehr speichern. Prüfen mit df -i."],["gpu",1,"Was macht die Grafikkarte?",["Sie berechnet das Bild und gibt es an den Monitor aus","Sie speichert Dateien","Sie verbindet mit dem Internet","Sie versorgt den PC mit Strom"],"GPU = Graphics Processing Unit.","Sie hat viele kleine Rechenkerne, die parallel arbeiten – ideal für Grafik und KI."],["gpu",1,"Was ist der Unterschied zwischen integrierter und dedizierter Grafik?",["Dedizierte Grafik ist eine eigene Karte mit eigenem Speicher, integrierte sitzt in der CPU","Integrierte Grafik ist immer schneller","Dedizierte Grafik gibt es nur in Handys","Es gibt keinen"],"Dedizierte Grafikkarten sind deutlich leistungsstärker.","Integrierte Grafik nutzt einen Teil des Arbeitsspeichers und braucht wenig Strom – ideal für Büro-PCs und Laptops."],["gpu",1,"Wohin steckt man den Monitor bei einem PC mit Grafikkarte?",["An die Grafikkarte","An das Mainboard","An das Netzteil","An den USB-Port"],"Häufiger Anfängerfehler!","Steckt das Kabel am Mainboard, nutzt der PC die schwächere iGPU oder zeigt gar kein Bild."],["gpu",1,"Was bedeutet FPS?",["Frames per Second – Bilder pro Sekunde","Fast Power Supply","File Protection System","Front Panel Switch"],"Mehr FPS = flüssigeres Bild.","Ab ca. 60 FPS wirkt ein Spiel flüssig. Ein Monitor mit 144 Hz kann auch 144 FPS darstellen."],["gpu",1,"In welchen Steckplatz wird eine Grafikkarte eingebaut?",["PCIe x16","M.2","SATA","DIMM"],"Der längste Steckplatz auf dem Mainboard.","Meist der oberste PCIe-x16-Slot, weil er direkt an die CPU angebunden ist und alle 16 Lanes bekommt."],["gpu",2,"Was ist Upscaling wie DLSS oder FSR?",["Das Bild wird in niedrigerer Auflösung berechnet und intelligent hochskaliert","Der Monitor wird größer","Die GPU wird übertaktet","Die Farbtiefe wird erhöht"],"Mehr FPS bei fast gleicher Bildqualität.","DLSS (NVIDIA) nutzt KI-Kerne, FSR (AMD) funktioniert auf vielen Grafikkarten."],["gpu",2,"Warum brauchen starke Grafikkarten eigene Stromanschlüsse?",["Weil der PCIe-Slot nur ca. 75 W liefert","Weil sie eigene Netzteile haben","Damit sie Daten übertragen können","Das ist nur Optik"],"Zusätzliche 8-Pin- oder 12V-2x6-Stecker vom Netzteil.","High-End-Karten brauchen 300–600 W – das Netzteil muss entsprechend dimensioniert sein."],["gpu",2,"Wofür werden GPUs außer Grafik noch genutzt?",["Für KI-Berechnungen, Videobearbeitung und wissenschaftliches Rechnen","Nur für Spiele","Zur Speicherung von Daten","Als Netzwerkkarte"],"GPUs sind stark bei parallelen Rechnungen.","Im Rechenzentrum stecken GPUs z. B. in KI-Servern. Schnittstellen dafür: CUDA (NVIDIA), ROCm (AMD)."],["gpu",3,"Was sind Shader-Einheiten bzw. CUDA-Kerne?",["Die vielen parallelen Recheneinheiten einer GPU","Anschlüsse am Monitor","Lüfter der Grafikkarte","Teile des VRAM"],"Tausende kleine Kerne statt wenige große wie bei der CPU.","Sie berechnen z. B. Farbe und Licht für Millionen Pixel gleichzeitig."],["gpu",3,"Was ist GPU-Passthrough bei Virtualisierung?",["Eine physische Grafikkarte wird exklusiv an eine VM durchgereicht","Die GPU wird in mehrere Monitore aufgeteilt","Die GPU wird abgeschaltet","Eine GPU wird über USB angeschlossen"],"Die VM kann die Karte dann fast mit voller Leistung nutzen.","Voraussetzung: IOMMU (Intel VT-d / AMD-Vi) im UEFI aktiviert. Beliebt in Proxmox-Homelabs."],["gpu",3,"Was ist ein Unterschied zwischen GDDR- und HBM-Speicher?",["HBM ist gestapelter Speicher direkt neben dem Chip mit sehr hoher Bandbreite","GDDR ist schneller als HBM","HBM gibt es nur in Handys","Beides ist Festplattenspeicher"],"HBM = High Bandwidth Memory.","Wird vor allem in teuren Rechenzentrums-GPUs für KI genutzt. Gaming-Karten nutzen meist GDDR6/GDDR7."],["gpu",3,"Was bedeutet Bottleneck (Flaschenhals) bei CPU und GPU?",["Eine Komponente bremst die andere aus, weil sie nicht schnell genug liefert","Ein Kühlproblem","Ein defektes Kabel","Ein Treiberupdate"],"Das System ist nur so schnell wie das langsamste Glied.","Beispiel: Eine schwache CPU liefert nicht genug Bilder vor – die starke GPU langweilt sich (geringe Auslastung)."],["gpu",3,"Was ist Hardware-Encoding (z. B. NVENC)?",["Ein spezieller Chip-Bereich, der Videos effizient kodiert","Ein Verschlüsselungschip","Ein Monitoranschluss","Ein Kühlmodus"],"Entlastet CPU beim Streaming und Aufnehmen.","Beispiele: NVENC (NVIDIA), AMF (AMD), Quick Sync (Intel). Auch Medienserver wie Jellyfin nutzen das."],["nt",1,"Was ist die Aufgabe des PC-Netzteils?",["Es wandelt Wechselstrom aus der Steckdose in Gleichstrom für die Komponenten um","Es speichert Strom wie ein Akku","Es kühlt den PC","Es verbindet mit dem Internet"],"230 V Wechselstrom → 12 V, 5 V, 3,3 V Gleichstrom.","Die wichtigste Schiene ist heute 12 V (CPU, Grafikkarte)."],["nt",1,"Was sagt das 80-PLUS-Siegel aus?",["Wie effizient ein Netzteil Strom umwandelt","Wie laut es ist","Wie viele Anschlüsse es hat","Wie groß es ist"],"Stufen: Bronze, Silber, Gold, Platinum, Titanium.","Effizienter = weniger Abwärme und Stromkosten."],["nt",1,"In welcher Einheit wird die Leistung eines Netzteils angegeben?",["Watt (W)","Volt (V)","Ampere (A)","Hertz (Hz)"],"Beispiel: 650 W.","Die Angabe ist die maximale Dauerleistung, die das Netzteil abgeben kann – nicht der tatsächliche Verbrauch."],["nt",1,"Wie viel Volt hat eine normale Steckdose in Deutschland?",["230 V","110 V","12 V","400 V"],"230 V Wechselspannung mit 50 Hz.","400 V (Drehstrom) gibt es z. B. für Herd oder Rechenzentren."],["nt",2,"Warum sollte ein Netzteil nicht exakt auf den Maximalverbrauch ausgelegt sein?",["Etwas Reserve sorgt für Stabilität, Effizienz und Platz für Lastspitzen","Weil es sonst zu leise ist","Weil größere Netzteile immer billiger sind","Das ist egal"],"Faustregel: ca. 20–30 % Reserve.","Netzteile arbeiten bei ca. 50 % Last meist am effizientesten. Moderne GPUs haben kurze Lastspitzen."],["nt",2,"Was ist ein Überspannungsschutz?",["Er schützt Geräte vor Spannungsspitzen, z. B. durch Blitzeinschlag","Er verhindert zu wenig Strom","Er verlängert Kabel","Er misst den Stromverbrauch"],"Oft in Steckdosenleisten eingebaut.","Gegen direkte Blitzeinschläge hilft das nur begrenzt – dafür gibt es Blitzschutz in der Hausinstallation."],["nt",2,"Was ist Wirkungsgrad bei einem Netzteil?",["Das Verhältnis von abgegebener zu aufgenommener Leistung","Die Lautstärke","Die Anzahl der Stecker","Die maximale Temperatur"],"Beispiel: 90 % Wirkungsgrad.","Gibt das Netzteil 450 W ab, nimmt es ca. 500 W aus der Steckdose; 50 W werden zu Wärme."],["nt",2,"Wie lange muss eine USV einen Server typischerweise überbrücken?",["So lange, bis der Server sauber heruntergefahren ist oder ein Notstromaggregat läuft","Mehrere Wochen","Nur 1 Sekunde","Gar nicht"],"USVs sind keine Langzeitstromquelle.","Oft reichen 5–15 Minuten. Die USV meldet dem Server per USB oder Netzwerk den Stromausfall, damit er automatisch herunterfährt."],["nt",3,"Ein Netzteil gibt 500 W ab und hat 90 % Wirkungsgrad. Wie viel Leistung nimmt es auf?",["ca. 556 W","450 W","500 W","590 W"],"Aufnahme = Abgabe ÷ Wirkungsgrad = 500 ÷ 0,9.","Die Differenz (ca. 56 W) wird zu Wärme."],["nt",3,"Warum sollte man eine USV nicht an eine Laserdrucker-Steckdose hängen?",["Laserdrucker haben beim Aufheizen sehr hohe Stromspitzen, die die USV überlasten","Weil Drucker keinen Strom brauchen","Weil USVs nur Gleichstrom liefern","Das ist kein Problem"],"Die Fixiereinheit zieht kurzzeitig sehr viel Leistung.","An eine USV gehören nur wichtige Geräte wie Server, Switches und Router."],["nt",3,"Was bedeutet Redundanz N+1 bei Netzteilen?",["Es gibt ein Netzteil mehr, als für den Betrieb nötig ist","Es gibt nur ein Netzteil","Die Leistung wird verdoppelt","Jedes Netzteil hat einen Akku"],"Fällt ein Netzteil aus, reichen die übrigen.","Beispiel: Ein Server braucht 1 Netzteil, hat aber 2 (1+1). Im Rechenzentrum gibt es auch 2N (alles doppelt)."],["kue",1,"Welche Komponenten werden in einem Gaming-PC typischerweise am heißesten?",["CPU und Grafikkarte","Tastatur und Maus","RAM und Gehäuse","Netzwerkkabel"],"Sie verbrauchen die meiste Leistung – und Leistung wird zu Wärme.","Deshalb haben CPU und GPU die größten Kühler. Auch schnelle NVMe-SSDs brauchen inzwischen oft Kühlkörper."],["kue",1,"Was ist ein passiver Kühler?",["Ein Kühlkörper ohne Lüfter","Ein Kühler mit Wasser","Ein besonders lauter Lüfter","Ein Kühler, der Strom erzeugt"],"Völlig lautlos.","Typisch bei Chipsätzen, SSDs, Mini-PCs oder Netzwerkgeräten mit geringer Abwärme."],["kue",1,"Was ist ein Airflow im Gehäuse?",["Der Luftstrom, der kühle Luft hinein- und warme Luft hinausführt","Ein Kühlmittel","Ein Mainboard-Anschluss","Ein Lüfterhersteller"],"Üblich: vorne/unten rein, hinten/oben raus.","Warme Luft steigt nach oben – deshalb bläst man sie oben und hinten hinaus."],["kue",1,"Warum sollte man einen PC regelmäßig entstauben?",["Staub behindert die Kühlung und führt zu höheren Temperaturen","Staub macht den PC schneller","Staub schützt die Bauteile","Das ist nicht nötig"],"Verstopfte Kühler = heiße Komponenten, laute Lüfter.","Am besten mit Druckluft ausblasen und die Lüfter dabei festhalten, damit sie nicht überdrehen."],["kue",1,"Was bedeutet RPM bei Lüftern?",["Umdrehungen pro Minute","Rechenleistung pro Megahertz","Raum pro Modul","Reaktionszeit in Millisekunden"],"Mehr RPM = mehr Luft, aber lauter.","Moderne Lüfter werden per PWM je nach Temperatur geregelt."],["kue",2,"Was ist PWM bei Lüftern?",["Eine Steuerung der Lüfterdrehzahl über Pulsweitenmodulation (4-Pin-Anschluss)","Ein Lüftertyp mit Wasser","Eine Beleuchtung","Ein Stromsparmodus der CPU"],"4-Pin = PWM-Steuerung, 3-Pin = Steuerung über Spannung.","Im UEFI kann man Lüfterkurven festlegen (Temperatur → Drehzahl)."],["kue",2,"Was ist eine AiO-Wasserkühlung?",["Eine geschlossene, vormontierte Wasserkühlung (All-in-One)","Ein Lüfter für alle Komponenten","Eine Klimaanlage","Ein passiver Kühler"],"Pumpe, Schläuche und Radiator sind fertig verbunden.","Kein Befüllen nötig. Nachteil: Pumpe kann ausfallen, begrenzte Lebensdauer."],["kue",2,"Bei welchen Temperaturen sollte eine Desktop-CPU unter Last etwa liegen?",["meist unter ca. 85–90 °C","über 120 °C","immer unter 20 °C","genau 100 °C"],"Die Grenze hängt vom Modell ab (Tjmax).","Viele moderne CPUs laufen bewusst bis nahe 95 °C, um maximal zu boosten. Dauerhaft darüber: Kühlung prüfen."],["kue",3,"Welche Wirkung hat eine höhere Umgebungstemperatur auf die Kühlung?",["Die Kühlung wird schlechter, da der Temperaturunterschied zur Luft kleiner wird","Keine","Die Kühlung wird besser","Der PC wird schneller"],"Kühlung lebt vom Temperaturunterschied.","Im Serverraum hält man deshalb die Zulufttemperatur z. B. bei ca. 18–27 °C (ASHRAE-Empfehlung)."],["kue",3,"Was ist Immersionskühlung?",["Hardware wird komplett in eine nicht leitende Flüssigkeit getaucht","Kühlung mit Eis","Kühlung durch offene Fenster","Ein Lüfter unter Wasser"],"Sehr effizient für dichte Rechenzentren.","Die Flüssigkeit leitet keinen Strom, aber Wärme sehr gut. Wird z. B. für KI- und Mining-Hardware genutzt."],["kue",3,"Was bedeutet PUE im Rechenzentrum?",["Power Usage Effectiveness – Gesamtenergie des RZ geteilt durch Energie der IT","Die Anzahl der Server","Ein Kühlmittel","Ein Netzwerkprotokoll"],"Idealwert 1,0 – dann ginge keine Energie für Kühlung und Verluste drauf.","Moderne Rechenzentren erreichen ca. 1,1–1,4. Das deutsche Energieeffizienzgesetz macht dazu Vorgaben."],["kue",3,"Was ist eine Heatpipe?",["Ein geschlossenes Rohr, in dem eine Flüssigkeit verdampft und kondensiert und so Wärme transportiert","Ein Wasserschlauch","Ein Luftkanal im Gehäuse","Ein Stromkabel"],"Sehr effizienter Wärmetransport ohne Pumpe.","An der heißen Stelle verdampft die Flüssigkeit, an den Kühlrippen kondensiert sie und fließt zurück. Steckt in fast jedem Tower-Kühler und Laptop."],["ans",1,"Welcher kleine, ovale Anschluss lässt sich in beide Richtungen einstecken?",["USB-C","USB-A","VGA","RJ45"],"USB-C ist beidseitig steckbar.","Wichtig: Welche Funktionen ein USB-C-Port kann (Daten, Bild, Laden, Thunderbolt), hängt vom Gerät ab."],["ans",1,"Welcher Anschluss überträgt Bild und Ton und ist bei Fernsehern Standard?",["HDMI","VGA","PS/2","SATA"],"HDMI überträgt digitales Bild und Ton.","Am PC ist auch DisplayPort verbreitet, besonders für hohe Bildwiederholraten."],["ans",1,"Welcher Stecker wird für Kupfer-Netzwerkkabel verwendet?",["RJ45","RJ11","USB-B","Klinke"],"RJ45 hat 8 Kontakte.","RJ11 ist kleiner und wird für Telefon/DSL verwendet."],["ans",1,"Welcher Anschluss ist analog und veraltet für Monitore?",["VGA","HDMI","DisplayPort","USB-C"],"VGA überträgt analoge Signale – das Bild wird bei hohen Auflösungen unscharf.","Man findet ihn noch an alten Beamern und Servern."],["ans",1,"Was ist eine 3,5-mm-Klinke?",["Ein Audioanschluss für Kopfhörer und Lautsprecher","Ein Stromanschluss","Ein Netzwerkanschluss","Ein Monitoranschluss"],"Farbcodes am PC: grün = Ausgang, rosa = Mikrofon, blau = Line-In.","Headsets nutzen oft einen 4-poligen Klinkenstecker (TRRS) für Ton und Mikrofon."],["ans",2,"Was ist DisplayPort Alt Mode?",["Bildübertragung über einen USB-C-Anschluss","Ein Stromsparmodus","Ein alter Monitoranschluss","Ein Treiber"],"Ermöglicht Monitore per USB-C.","Nicht jeder USB-C-Port kann das – oft zeigt ein kleines DP-Symbol die Unterstützung an."],["ans",2,"Was ist USB Power Delivery (PD)?",["Ein Standard, der über USB-C höhere Ladeleistungen aushandelt","Ein USB-Stick-Typ","Eine Datenübertragungsrate","Ein Treiber"],"Bis 100 W, mit neuem Standard (EPR) bis 240 W.","Damit laden Laptops, Handys und Monitore über dasselbe Kabel. Auch das Kabel muss die Leistung unterstützen."],["ans",2,"Welcher Anschluss verbindet klassisch SSDs/HDDs im 2,5-Zoll-Format mit dem Mainboard?",["SATA","PCIe x16","HDMI","USB-C"],"SATA III schafft bis ca. 600 MB/s.","Es werden zwei Kabel gebraucht: SATA-Daten vom Mainboard und SATA-Strom vom Netzteil."],["ans",3,"Warum ist ein 2,5-Gbit-Ethernet-Port an einer Cat-5e-Leitung oft trotzdem nutzbar?",["2.5GBASE-T ist dafür ausgelegt, auch auf Cat 5e (bis ca. 100 m) zu funktionieren","Weil Cat 5e Glasfaser ist","Weil Ethernet kabellos ist","Es funktioniert nie"],"2.5G und 5G wurden genau für vorhandene Verkabelung entwickelt.","Für 10 Gbit/s über volle 100 m braucht es dagegen Cat 6A."],["ans",3,"Was ist SFP bzw. SFP+?",["Steckplätze für austauschbare Module, z. B. für Glasfaser, an Switches und Netzwerkkarten","Ein USB-Standard","Ein Monitoranschluss","Ein Stromstecker"],"SFP = 1 Gbit/s, SFP+ = 10 Gbit/s, SFP28 = 25 Gbit/s.","Je nach Modul nutzt man Glasfaser (Singlemode/Multimode) oder Kupfer (DAC-Kabel, RJ45-Module)."],["ans",3,"Welche Spannung liefert ein USB-2.0-Port standardmäßig und mit wie viel Strom?",["5 V, bis 500 mA","12 V, bis 2 A","230 V, bis 1 A","3,3 V, bis 100 mA"],"Also max. 2,5 W.","USB 3.x liefert 900 mA (4,5 W). Mehr Leistung erst über Ladestandards wie USB PD."],["ans",3,"Was ist ein Hub mit eigener Stromversorgung (aktiver USB-Hub)?",["Ein USB-Verteiler mit eigenem Netzteil, damit angeschlossene Geräte genug Strom bekommen","Ein Netzwerk-Hub","Ein Hub ohne Anschlüsse","Ein WLAN-Adapter"],"Passive Hubs teilen sich den Strom eines einzelnen Ports.","Externe Festplatten an passiven Hubs verursachen deshalb oft Verbindungsabbrüche."],["ans",3,"Was ist der Unterschied zwischen M.2 SATA und M.2 NVMe?",["Beide nutzen den M.2-Formfaktor, aber NVMe läuft über PCIe und ist viel schneller","M.2 SATA ist schneller","NVMe passt nicht in M.2","Es gibt keinen"],"M.2 ist nur die Bauform, nicht die Schnittstelle.","M.2 SATA: max. ca. 600 MB/s. M.2 NVMe PCIe 4.0: bis ca. 7000 MB/s. Das Mainboard muss die jeweilige Variante unterstützen."],["vm",1,"Welche Ressourcen weist man einer VM beim Erstellen zu?",["CPU-Kerne, Arbeitsspeicher, virtuelle Festplatte und Netzwerk","Nur einen Monitor","Nur ein Passwort","Ein eigenes Netzteil"],"Wie ein echter PC – nur virtuell.","Die Ressourcen kommen vom Host. Beispiel: Ubuntu-VM mit 2 Kernen, 4 GB RAM und 40 GB Festplatte."],["vm",1,"Welches Programm ist ein kostenloser Typ-2-Hypervisor?",["VirtualBox","VMware ESXi","Hyper-V Server","Proxmox VE"],"VirtualBox läuft als Programm unter Windows, Linux oder macOS.","Ideal zum Üben, z. B. um eine Linux-VM auf dem eigenen PC zu starten."],["vm",1,"Was muss im UEFI oft aktiviert werden, damit VMs gut laufen?",["Die Hardware-Virtualisierung (Intel VT-x bzw. AMD-V/SVM)","Secure Boot aus","Das WLAN","Der Energiesparmodus"],"Ohne sie laufen viele Hypervisoren gar nicht oder langsam.","Bei AMD heißt die Option oft „SVM Mode“."],["vm",1,"Was ist ein Gastsystem?",["Das Betriebssystem, das in einer VM läuft","Der physische Server","Ein Gäste-WLAN","Ein Benutzerkonto ohne Rechte"],"Host = echter Rechner, Gast = virtuelles System.","Auf einem Windows-Host kann z. B. ein Ubuntu-Gast laufen."],["os",1,"Wofür ist der Task-Manager unter Windows?",["Um laufende Programme, Auslastung und Autostart zu sehen und Programme zu beenden","Um Termine zu planen","Um Dateien zu kopieren","Um das WLAN einzurichten"],"Schnell öffnen mit Strg + Umschalt + Esc.","Hängt ein Programm, kann man es dort beenden. Unter Linux gibt es dafür top, htop oder kill."],["os",1,"Was ist ein Dateipfad?",["Die Angabe, wo eine Datei im Verzeichnisbaum liegt","Der Dateiname allein","Ein Netzwerkkabel","Ein Passwort"],"Windows: C:\\Users\\Tom\\Dokumente\\a.txt, Linux: /home/tom/a.txt","Windows nutzt Backslash und Laufwerksbuchstaben, Linux Schrägstrich und einen einzigen Baum ab /."],["os",1,"Was ist ein Administrator-Konto?",["Ein Benutzerkonto mit vollen Rechten zur Systemverwaltung","Ein Gastkonto","Ein E-Mail-Konto","Ein Konto ohne Passwort"],"Unter Linux heißt der Superuser root.","Im Alltag sollte man mit einem normalen Konto arbeiten und Adminrechte nur bei Bedarf nutzen."],["os",1,"Was ist eine Dateiendung?",["Der Teil nach dem Punkt, der den Dateityp anzeigt","Das Ende einer Datei","Die Dateigröße","Das Erstelldatum"],"Beispiele: .docx, .pdf, .exe, .jpg","Windows blendet bekannte Endungen standardmäßig aus – gefährlich, weil „rechnung.pdf.exe“ dann wie ein PDF aussieht."],["os",1,"Was ist Multitasking?",["Mehrere Programme scheinbar gleichzeitig ausführen","Mehrere Monitore","Mehrere Benutzer","Mehrere Festplatten"],"Das OS wechselt sehr schnell zwischen Prozessen.","Mit mehreren Kernen laufen Programme auch wirklich parallel."],["os",2,"Was bedeutet LTS bei Ubuntu?",["Long Term Support – Version mit mehrjährigen Updates","Linux Terminal System","Low Traffic Server","Latest Test Software"],"LTS-Versionen erscheinen alle zwei Jahre (April, gerade Jahre).","Standard-Support 5 Jahre, mit Ubuntu Pro länger. Für Server nimmt man fast immer LTS."],["os",2,"Was ist der Unterschied zwischen Kernel-Modus und User-Modus?",["Im Kernel-Modus hat Code vollen Hardwarezugriff, im User-Modus nur eingeschränkten","Es gibt keinen","User-Modus ist schneller","Kernel-Modus ist für Spiele"],"Schützt das System vor fehlerhaften Programmen.","Stürzt ein Programm im User-Modus ab, läuft das OS weiter. Fehler im Kernel-Modus führen zum Bluescreen bzw. Kernel Panic."],["os",2,"Was ist ein Bluescreen (BSOD)?",["Ein schwerer Systemfehler unter Windows, bei dem das System anhält","Ein Bildschirmschoner","Ein Update-Fenster","Ein Monitorfehler"],"BSOD = Blue Screen of Death.","Der Stoppcode (z. B. MEMORY_MANAGEMENT) hilft bei der Suche. Häufige Ursachen: Treiber, RAM, Überhitzung."],["os",2,"Was ist eine Linux-Distribution?",["Ein Paket aus Linux-Kernel, Programmen und Werkzeugen","Ein Linux-Befehl","Ein Dateisystem","Eine Hardware"],"Beispiele: Ubuntu, Debian, Fedora, Linux Mint, Kali.","Server-Klassiker: Debian, Ubuntu Server, Red Hat Enterprise Linux (RHEL)."],["os",2,"Was ist ein Dienst (Windows) bzw. Daemon (Linux)?",["Ein Programm, das im Hintergrund läuft, oft ohne Benutzeroberfläche","Ein Benutzerkonto","Ein Virus","Ein Treiber für Drucker"],"Beispiele: Druckwarteschlange, SSH-Server, Webserver.","Unter Linux enden Daemon-Namen oft auf d, z. B. sshd, httpd."],["os",3,"Was ist virtueller Speicher?",["Jedem Prozess wird ein eigener Adressraum vorgegaukelt, den das OS auf RAM und Datenträger abbildet","Ein RAM-Riegel in einer VM","Cloud-Speicher","Der Grafikspeicher"],"Die Übersetzung übernimmt die MMU der CPU.","Vorteil: Prozesse sind voneinander isoliert und können mehr Speicher nutzen, als physisch vorhanden ist (per Auslagerung)."],["os",3,"Was ist ein Deadlock?",["Prozesse warten gegenseitig auf Ressourcen und blockieren sich dauerhaft","Ein Passwort, das nicht funktioniert","Ein abgestürzter Monitor","Ein gesperrtes Benutzerkonto"],"Keiner kann weitermachen.","Beispiel: Prozess A hält Datei 1 und wartet auf Datei 2, Prozess B hält Datei 2 und wartet auf Datei 1."],["os",3,"Was ist ein Scheduler im Betriebssystem?",["Die Komponente, die entscheidet, welcher Prozess wann CPU-Zeit bekommt","Ein Kalender","Ein Backup-Programm","Ein Druckertreiber"],"Verteilt die Rechenzeit.","Verfahren z. B. Round Robin (reihum) oder prioritätsbasiert. Unter Linux kann man die Priorität mit nice beeinflussen."],["os",3,"Was ist eine Race Condition?",["Ein Fehler, bei dem das Ergebnis von der zufälligen zeitlichen Reihenfolge paralleler Abläufe abhängt","Ein Wettrennen zwischen CPUs","Ein Übertaktungsfehler","Ein Netzwerkfehler"],"Tritt auf, wenn mehrere Threads ungeschützt auf dieselben Daten zugreifen.","Beispiel: Zwei Threads erhöhen gleichzeitig einen Zähler – am Ende fehlt eine Erhöhung. Schutz: Sperren (Locks)."],["os",3,"Was ist der Unterschied zwischen Hardlink und Symlink unter Linux?",["Ein Hardlink zeigt direkt auf den Inode, ein Symlink auf den Pfad einer Datei","Beides ist dasselbe","Symlinks gibt es nur unter Windows","Hardlinks sind Verknüpfungen im Browser"],"Ein Symlink ist wie eine Verknüpfung.","Löscht man das Original, wird ein Symlink ungültig, ein Hardlink behält die Daten. Anlegen: ln (hart), ln -s (symbolisch)."],["net",1,"Was ist ein Heimnetz typischerweise für ein Netzwerk?",["Ein LAN","Ein WAN","Ein MAN","Das Internet"],"LAN = Local Area Network.","WAN verbindet weit entfernte Standorte, das Internet ist das größte WAN."],["net",1,"Was bedeutet Bandbreite bei einem Internetanschluss?",["Die maximale Datenmenge pro Sekunde, z. B. 250 Mbit/s","Die Kabellänge","Die Anzahl der Geräte","Die Verzögerung"],"Angegeben in Mbit/s oder Gbit/s.","Download und Upload sind oft unterschiedlich, z. B. 250/40 Mbit/s bei Kabelanschlüssen."],["net",1,"Was ist ein Ping und was misst er?",["Ein Test, ob ein Gerät erreichbar ist, inkl. Antwortzeit","Die Downloadgeschwindigkeit","Die Anzahl der Geräte","Die WLAN-Stärke"],"Antwortzeit in Millisekunden.","Beispiel: ping 8.8.8.8. Keine Antwort heißt nicht immer „offline“ – manche Firewalls blockieren ICMP."],["net",1,"Welche Aufgabe hat DNS?",["Domainnamen in IP-Adressen übersetzen","IP-Adressen vergeben","Daten verschlüsseln","WLAN bereitstellen"],"Das „Telefonbuch“ des Internets.","Wenn Webseiten per IP gehen, aber nicht per Name, ist oft DNS das Problem."],["net",1,"Was ist der Unterschied zwischen Upload und Download?",["Download = Daten empfangen, Upload = Daten senden","Beides ist dasselbe","Upload = Daten empfangen","Download nur per Kabel"],"Richtung der Datenübertragung.","Für Videocalls und Cloud-Backups ist der Upload wichtig."],["net",2,"Was ist der Unterschied zwischen Halbduplex und Vollduplex?",["Halbduplex: abwechselnd senden/empfangen, Vollduplex: gleichzeitig","Es gibt keinen","Vollduplex ist nur WLAN","Halbduplex ist schneller"],"Moderne Switch-Verbindungen arbeiten im Vollduplex.","Klassisches WLAN und alte Hubs arbeiten halbduplex. Ein Duplex-Mismatch führt zu sehr langsamen Verbindungen."],["net",2,"Was ist die MTU?",["Die maximale Paketgröße, die über eine Verbindung übertragen werden kann","Die Anzahl der Geräte","Die Kabellänge","Eine Art MAC-Adresse"],"Standard bei Ethernet: 1500 Byte.","Bei VPNs oder PPPoE (DSL: 1492) ist sie kleiner. Falsche MTU kann dazu führen, dass manche Seiten nicht laden."],["net",2,"Was ist QoS (Quality of Service)?",["Bevorzugung bestimmter Datenströme, z. B. Telefonie vor Downloads","Eine Qualitätsprüfung für Kabel","Ein Virenschutz","Ein Backup-Verfahren"],"Wichtig für Echtzeitanwendungen.","Beispiel: VoIP-Telefonate bekommen Priorität, damit Sprache nicht abgehackt wird, wenn jemand gleichzeitig große Dateien lädt."],["net",2,"Was ist VoIP?",["Telefonieren über IP-Netze","Ein Videoformat","Ein WLAN-Standard","Ein Verschlüsselungsverfahren"],"Voice over IP.","Protokolle: SIP für den Verbindungsaufbau, RTP für die Sprache. Heute sind fast alle Anschlüsse in Deutschland IP-basiert."],["net",2,"Was ist Jitter?",["Die Schwankung der Laufzeit von Paketen","Die maximale Geschwindigkeit","Ein Kabeltyp","Ein Router-Modell"],"Wichtig bei VoIP und Videocalls.","Hoher Jitter führt zu Aussetzern. Dagegen helfen Puffer (Jitter-Buffer) und QoS."],["net",3,"Was ist ein Broadcast-Sturm?",["Broadcasts kreisen durch eine Netzwerkschleife endlos und legen das Netz lahm","Ein Wetterphänomen bei Funk","Ein DDoS über WLAN","Ein zu großer Download"],"Entsteht bei Schleifen ohne STP.","Beispiel: Ein Kabel verbindet zwei Ports desselben Switches. Schutz: Spanning Tree, Loop-Detection, Storm-Control."],["net",3,"Was ist der Unterschied zwischen statischem und dynamischem Routing?",["Statisch werden Routen manuell eingetragen, dynamisch tauschen Router sie per Protokoll aus","Es gibt keinen","Dynamisch heißt per WLAN","Statisch ist immer schneller"],"Dynamische Protokolle z. B. OSPF, BGP.","Kleine Netze kommen mit statischen Routen aus; große Netze und das Internet (BGP) brauchen dynamisches Routing."],["net",3,"Was ist BGP?",["Das Routing-Protokoll, mit dem sich Netzbetreiber im Internet Routen mitteilen","Ein Mailprotokoll","Ein WLAN-Standard","Ein Dateisystem"],"Border Gateway Protocol.","Fehlerhafte BGP-Einträge haben schon große Teile des Internets lahmgelegt, z. B. 2021 bei Facebook."],["net",3,"Was ist CSMA/CD?",["Ein Zugriffsverfahren, bei dem Kollisionen erkannt und Übertragungen wiederholt werden","Ein Verschlüsselungsverfahren","Ein Kabeltyp","Ein IPv6-Mechanismus"],"Wurde bei klassischem Ethernet (Bus, Hub) genutzt.","Mit Switches und Vollduplex gibt es keine Kollisionen mehr. WLAN nutzt CSMA/CA (Collision Avoidance)."],["net",3,"Was ist OSPF?",["Ein Link-State-Routing-Protokoll, das den kürzesten Weg berechnet","Ein Firewall-Typ","Ein Mailserver","Ein Dateisystem"],"Open Shortest Path First.","Wird in Firmennetzen genutzt. Router kennen die ganze Topologie und rechnen mit dem Dijkstra-Algorithmus."],["srv",1,"Was ist ein Client?",["Ein Gerät oder Programm, das Dienste eines Servers nutzt","Ein besonders starker Server","Ein Netzwerkkabel","Ein Administrator"],"Gegenstück zum Server.","Beispiel: Der Browser ist ein Client, der Webseiten vom Webserver abruft."],["srv",1,"Was ist ein Dateiserver?",["Ein Server, der Dateien zentral im Netzwerk bereitstellt","Ein Server für Webseiten","Ein Drucker","Ein Backup-Band"],"Zugriff meist per SMB (Windows) oder NFS (Linux).","Vorteil: zentrale Datenhaltung, Berechtigungen und Backups."],["srv",1,"Was ist ein Webserver?",["Ein Server, der Webseiten über HTTP/HTTPS ausliefert","Ein Mailserver","Ein DNS-Server","Ein Switch"],"Beispiele: Apache, Nginx, IIS.","Ein Webserver lauscht meist auf Port 80 (HTTP) und 443 (HTTPS) und liefert HTML, Bilder und Skripte an den Browser."],["srv",1,"Was ist ein Rack?",["Ein Schrank bzw. Gestell für Server und Netzwerkgeräte","Ein Serverbetriebssystem","Ein Kühlmittel","Ein Kabeltyp"],"Standard ist 19 Zoll Breite.","Die Höhe wird in Höheneinheiten (HE) gemessen."],["srv",1,"Warum laufen Server meist rund um die Uhr?",["Weil ihre Dienste jederzeit verfügbar sein sollen","Weil sie sich nicht ausschalten lassen","Weil sie sonst kaputtgehen","Wegen der Garantie"],"Verfügbarkeit ist das Ziel.","Deshalb gibt es Redundanz, USV, Monitoring und Wartungsfenster für geplante Neustarts."],["srv",3,"Was ist ein Failover-Cluster?",["Mehrere Server, bei denen ein anderer die Dienste übernimmt, wenn einer ausfällt","Ein einzelner Hochleistungsserver","Ein Backup auf Band","Ein Load Balancer im WLAN"],"Hochverfügbarkeit.","Beispiel: Zwei Hyper-V-Hosts mit gemeinsamem Speicher – fällt einer aus, starten die VMs auf dem anderen neu."],["srv",3,"Was ist Infrastructure as Code (IaC)?",["Server und Infrastruktur werden über Code bzw. Konfigurationsdateien automatisiert aufgebaut","Programmieren direkt auf dem Server","Ein Hardware-Standard","Ein Rack-Typ"],"Nachvollziehbar, versionierbar, wiederholbar.","Werkzeuge: Ansible, Terraform, Puppet. Statt 20 Server per Hand einzurichten, läuft ein Playbook."],["iot",1,"Was bedeutet IoT?",["Internet of Things – vernetzte Alltagsgeräte","Internet of Technology","Input Output Transfer","Internal Office Terminal"],"Geräte mit Sensoren, die Daten austauschen.","Beispiele: smarte Thermostate, Fitness-Tracker, vernetzte Maschinen."],["iot",1,"Was ist ein Smart Home?",["Ein Zuhause mit vernetzten, steuerbaren Geräten","Ein Haus mit vielen PCs","Ein Rechenzentrum","Ein Haus ohne Internet"],"Licht, Heizung, Rollläden per App oder Sprache steuern.","Plattformen: Home Assistant, Apple Home, Google Home, Alexa."],["iot",1,"Was ist ein Sensor?",["Ein Bauteil, das Messwerte aus der Umgebung erfasst","Ein Bauteil, das Bewegung erzeugt","Ein Kabel","Ein Speicherchip"],"Beispiele: Temperatur, Bewegung, Licht, Feuchtigkeit.","Das Gegenstück ist der Aktor, der etwas bewirkt (z. B. Motor, Relais)."],["iot",1,"Was ist ein smarter Zwischenstecker (Smart Plug)?",["Eine per App oder Zeitplan schaltbare Steckdose, oft mit Verbrauchsmessung","Ein USB-Adapter","Ein Netzwerkswitch","Ein Überspannungsschutz"],"Einfacher Einstieg ins Smart Home.","Praktisch, um den Stromverbrauch von Geräten zu messen – z. B. vom Homeserver."],["iot",1,"Was ist ein Raspberry Pi?",["Ein kleiner, günstiger Einplatinencomputer","Ein Obstkuchen-Rezept","Ein Router","Ein Smartphone"],"Beliebt für Bastelprojekte und Homelabs.","Nutzt eine ARM-CPU und meist Raspberry Pi OS (Debian-basiert). Gut für Pi-hole, Home Assistant oder kleine Server."],["iot",2,"Warum gelten viele IoT-Geräte als Sicherheitsrisiko?",["Oft Standardpasswörter, fehlende Updates und schwache Absicherung","Weil sie zu viel Strom brauchen","Weil sie kein WLAN haben","Weil sie zu teuer sind"],"Beliebtes Ziel für Botnetze.","Schutz: Standardpasswort ändern, Updates, IoT-Geräte in ein eigenes VLAN oder Gästenetz."],["iot",2,"Was ist MQTT?",["Ein leichtgewichtiges Nachrichtenprotokoll für IoT nach dem Publish/Subscribe-Prinzip","Ein WLAN-Standard","Ein Dateisystem","Eine Programmiersprache"],"Geräte senden an einen Broker, Interessenten abonnieren Themen.","Beispiel: Sensor veröffentlicht „haus/wohnzimmer/temp“, Home Assistant abonniert das. Standardport 1883 (TLS: 8883)."],["iot",2,"Was ist Zigbee?",["Ein stromsparender Funkstandard für Smart-Home-Geräte","Ein Mailprotokoll","Ein Kabeltyp","Ein Cloud-Dienst"],"Bildet ein Mesh-Netz.","Braucht eine Zentrale (Bridge/Coordinator). Alternativen: Z-Wave, Thread, WLAN, Bluetooth."],["iot",2,"Was ist Matter?",["Ein herstellerübergreifender Smart-Home-Standard","Ein Programmiersprache","Ein Sensor","Ein Router"],"Von Apple, Google, Amazon und anderen unterstützt.","Ziel: Geräte funktionieren plattformübergreifend. Läuft über WLAN, Ethernet oder Thread."],["iot",2,"Was ist Industrie 4.0?",["Die Vernetzung und Digitalisierung industrieller Produktion","Die vierte Version von Windows","Ein Kühlsystem","Ein Stromnetz"],"Maschinen tauschen Daten aus und steuern sich teils selbst.","Beispiele: vorausschauende Wartung (Predictive Maintenance), vernetzte Lager, digitale Zwillinge."],["iot",3,"Was ist ein digitaler Zwilling?",["Ein virtuelles Abbild eines realen Objekts, das mit echten Daten gespeist wird","Eine Kopie der Festplatte","Ein zweiter Server","Ein Backup"],"Ermöglicht Simulation und Analyse.","Beispiel: Eine Windkraftanlage liefert Sensordaten an ihren digitalen Zwilling, der Verschleiß vorhersagt."],["iot",3,"Was ist Predictive Maintenance?",["Vorausschauende Wartung auf Basis von Sensordaten","Wartung nach festem Kalender","Wartung erst nach Ausfall","Ein Wartungsvertrag"],"Man wartet, bevor etwas kaputtgeht.","Beispiel: Vibrationssensoren erkennen einen verschleißenden Lagerschaden, Tausch wird geplant."],["iot",3,"Was ist LoRaWAN?",["Ein Funknetz mit großer Reichweite und sehr geringem Stromverbrauch für IoT","Ein schnelles WLAN","Ein Glasfaserstandard","Ein Mobilfunkvertrag"],"LPWAN = Low Power Wide Area Network.","Kilometerweite Reichweite, aber nur sehr kleine Datenmengen. Ideal für Sensoren mit jahrelanger Batterielaufzeit."],["iot",3,"Warum sollten IoT-Geräte in ein eigenes VLAN?",["Damit ein gehacktes Gerät nicht auf PCs und Server im Hauptnetz zugreifen kann","Damit sie schneller sind","Damit sie weniger Strom brauchen","Das ist nicht nötig"],"Netzsegmentierung begrenzt Schaden.","Die Firewall erlaubt dann nur nötige Verbindungen, z. B. von Home Assistant zu den Geräten, nicht umgekehrt."],["iot",3,"Was ist Edge-Verarbeitung im IoT?",["Daten werden direkt am Gerät oder einem nahen Gateway ausgewertet statt in der Cloud","Daten werden gelöscht","Daten werden nur gedruckt","Daten werden nur nachts übertragen"],"Weniger Latenz, weniger Datenverkehr, funktioniert auch offline.","Beispiel: Eine Kamera erkennt Personen selbst und schickt nur Ereignisse statt des ganzen Videos."],["raid",3,"Warum gilt RAID 5 bei sehr großen HDDs als riskant?",["Beim langen Rebuild kann eine weitere Platte ausfallen oder ein Lesefehler auftreten","Weil RAID 5 keine Parität hat","Weil RAID 5 nur mit SSDs geht","Das ist nicht riskant"],"Während des Rebuilds gibt es keine Redundanz.","Deshalb nutzt man bei großen Platten eher RAID 6 oder RAID 10."],["raid",3,"Was ist ein Snapshot auf Dateisystemebene (z. B. ZFS, Btrfs) im Vergleich zum Backup?",["Ein schneller Wiederherstellungspunkt auf demselben Speicher – kein Ersatz für ein externes Backup","Eine vollständige Kopie auf einem anderen Gerät","Eine Verschlüsselung","Ein RAID-Level"],"Snapshots sind praktisch gegen versehentliches Löschen.","Geht der Speicher kaputt, sind auch die Snapshots weg. Deshalb zusätzlich extern sichern."],["per",1,"Was ist ein Beamer (Projektor)?",["Ein Gerät, das ein Bild auf eine Fläche projiziert","Ein Drucker","Ein Scanner","Eine Webcam"],"Lichtstärke in ANSI-Lumen.","Für helle Räume braucht man mehr Lumen."],["per",1,"Was ist ein Multifunktionsgerät im Büro?",["Ein Gerät, das Drucker, Scanner, Kopierer und oft Fax vereint","Ein Monitor mit Lautsprecher","Ein Laptop","Ein Router"],"Spart Platz und Kosten.","Im Netzwerk oft mit Scan-to-Mail oder Scan-to-Ordner."],["per",2,"Was ist ein Docking-Station?",["Eine Station, über die ein Laptop mit einem Kabel an Monitore, Netzwerk und Zubehör angeschlossen wird","Ein Ladegerät für Handys","Ein Serverrack","Ein Drucker"],"Typisch im Büro mit Desksharing.","Moderne Docks laufen über USB-C oder Thunderbolt."],["per",3,"Was ist Farbkalibrierung eines Monitors?",["Das Einstellen des Monitors mit Messgerät, damit Farben korrekt dargestellt werden","Das Reinigen des Monitors","Das Ändern der Auflösung","Das Einstellen der Helligkeit nach Gefühl"],"Wichtig für Grafik und Fotografie.","Ein Colorimeter misst die Farben und erstellt ein ICC-Profil."],["per",3,"Was bedeutet Druckkostenberechnung pro Seite?",["Kosten für Toner/Tinte und Verschleißteile geteilt durch die Seitenreichweite","Nur der Papierpreis","Nur der Kaufpreis des Druckers","Der Stromverbrauch pro Tag"],"Wichtig für TCO-Vergleiche.","Beispiel: Toner 80 € für 4000 Seiten = 2 ct pro Seite, plus Trommel und Papier."],["per",3,"Was ist Follow-Me-Printing (Secure Print)?",["Druckaufträge werden erst ausgegeben, wenn sich der Nutzer am Drucker authentifiziert","Ein Drucker folgt dem Nutzer","Drucken per WLAN","Drucken ohne Treiber"],"Verhindert, dass vertrauliche Dokumente im Ausgabefach liegen bleiben.","Der Nutzer meldet sich mit Karte oder PIN an einem beliebigen Drucker an."],["per",3,"Was ist der Unterschied zwischen HDR und SDR bei Monitoren?",["HDR bietet einen größeren Helligkeits- und Kontrastumfang","SDR ist schärfer","HDR ist nur für Drucker","Es gibt keinen"],"HDR = High Dynamic Range.","Echtes HDR braucht hohe Spitzenhelligkeit und lokales Dimmen bzw. OLED. Standards: HDR10, Dolby Vision."],["per",3,"Was ist die Druckersprache PCL bzw. PostScript?",["Eine Seitenbeschreibungssprache, mit der der Computer dem Drucker das Layout übermittelt","Ein Kabeltyp","Ein Druckerhersteller","Ein Papierformat"],"Der Druckertreiber übersetzt Dokumente in diese Sprache.","Universaltreiber (z. B. PCL6) funktionieren mit vielen Modellen, was die Verwaltung im Firmennetz erleichtert."],["lin",3,"Was bewirkt das Sticky Bit (chmod +t) auf einem Ordner wie /tmp?",["Nur der Besitzer einer Datei darf sie löschen, obwohl alle schreiben dürfen","Dateien werden nie gelöscht","Nur root darf schreiben","Dateien werden automatisch versteckt"],"Rechte-Anzeige: drwxrwxrwt","In /tmp dürfen alle Dateien anlegen, aber nicht die Dateien anderer löschen."],["lin",3,"Was macht der Befehl find /var/log -name \"*.log\" -mtime -1?",["Findet .log-Dateien in /var/log, die in den letzten 24 Stunden geändert wurden","Löscht alle Logs","Zeigt den Inhalt aller Logs","Sucht nur in der ersten Zeile"],"-mtime -1 = jünger als 1 Tag.","Mit -exec oder -delete kann man direkt Aktionen ausführen – vorsichtig verwenden!"],["lin",3,"Was ist die Datei /etc/fstab?",["Sie legt fest, welche Dateisysteme beim Start automatisch eingehängt werden","Sie enthält alle Passwörter","Sie speichert die IP-Adresse","Sie ist das Log des Kernels"],"fstab = File System Table.","Ein Fehler darin kann den Bootvorgang stoppen. Vorher testen mit sudo mount -a."],["win",3,"Was ist eine Vertrauensstellung (Trust) im Active Directory?",["Eine Beziehung zwischen Domänen, die Benutzern Zugriff auf Ressourcen der anderen Domäne erlaubt","Ein Passwort für Admins","Ein Zertifikat für Webseiten","Ein Gruppenrichtlinienobjekt"],"Wichtig bei Firmenzusammenschlüssen.","Innerhalb einer Gesamtstruktur (Forest) vertrauen sich Domänen automatisch (transitiv)."],["win",3,"Was sind FSMO-Rollen im Active Directory?",["Spezielle Aufgaben, die jeweils nur ein Domain Controller übernimmt","Benutzergruppen","Druckerrollen","Firewallregeln"],"Es gibt fünf FSMO-Rollen.","Beispiel: Der PDC-Emulator ist u. a. für Zeitsynchronisation und Passwortänderungen zuständig."],["win",3,"Welcher Befehl zeigt, welche Gruppenrichtlinien auf einen PC wirken?",["gpresult /r","gpupdate /force","ipconfig /gpo","netsh gpo"],"gpresult zeigt die angewendeten GPOs.","gpupdate /force wendet die Richtlinien sofort neu an."],["osi",1,"Wie heißt die oberste Schicht im OSI-Modell?",["Anwendungsschicht","Bitübertragungsschicht","Transportschicht","Sicherungsschicht"],"Schicht 7.","Hier arbeiten Protokolle, mit denen Anwendungen kommunizieren, z. B. HTTP."],["osi",2,"Auf welcher Schicht arbeitet eine Firewall, die nur IP-Adressen und Ports prüft?",["Schicht 3 und 4","Nur Schicht 1","Nur Schicht 7","Schicht 2"],"Klassischer Paketfilter.","Eine Next-Generation-Firewall prüft zusätzlich Anwendungen auf Schicht 7."],["osi",3,"Warum ordnet man TLS nicht eindeutig einer OSI-Schicht zu?",["Es liegt zwischen Transport und Anwendung und übernimmt Aufgaben mehrerer Schichten","Weil TLS keine Schicht braucht","Weil TLS auf Schicht 1 arbeitet","Das ist eindeutig Schicht 2"],"Modelle vereinfachen die Realität.","Häufig wird TLS Schicht 5/6 zugeordnet, praktisch sitzt es auf TCP und unter HTTP."],["osi",3,"Was ist ein VLAN-Tag aus OSI-Sicht?",["Eine Erweiterung des Schicht-2-Frames","Ein Teil des IP-Headers","Ein TCP-Port","Ein HTTP-Header"],"802.1Q fügt 4 Byte in den Ethernet-Frame ein.","Darum sind VLANs Schicht-2-Technik. Zwischen VLANs routen braucht Schicht 3."],["osi",3,"Welche OSI-Schichten nutzt ein Router mindestens, um ein Paket weiterzuleiten?",["1 bis 3","Nur 7","4 bis 7","Nur 2"],"Er muss Bits empfangen, Frames lesen und IP auswerten.","Jeder Router entpackt bis Schicht 3 und verpackt den Frame für das nächste Netz neu (neue MAC-Adressen, gleiche IPs)."],["ip",0,"Aus wie vielen Bit besteht eine IPv4-Adresse?",["32","64","128","16"],"4 Oktette zu je 8 Bit.","Beispiel: 192.168.1.10. Jedes Oktett kann 0 bis 255 sein."],["ip",0,"Welche Adresse ist die IPv4-Loopback-Adresse?",["127.0.0.1","192.168.0.1","0.0.0.0","255.255.255.255"],"Damit spricht ein Rechner mit sich selbst (localhost).","Der ganze Bereich 127.0.0.0/8 ist Loopback."],["pro",0,"Mit welchem Protokoll meldet man sich verschlüsselt an der Kommandozeile eines Linux-Servers an?",["SSH","Telnet","HTTP","SMTP"],"SSH = Secure Shell, Port 22.","Telnet macht dasselbe, aber unverschlüsselt – deshalb nutzt man heute SSH, idealerweise mit Schlüssel statt Passwort."],["pro",0,"Welches Protokoll vergibt automatisch IP-Adressen im Netzwerk?",["DHCP","DNS","FTP","SMTP"],"DHCP = Dynamic Host Configuration Protocol.","Verteilt IP-Adresse, Subnetzmaske, Gateway und DNS-Server. Im Heimnetz macht das meist der Router."],["pro",3,"Was ist DNSSEC?",["Eine Erweiterung, die DNS-Antworten per digitaler Signatur vor Fälschung schützt","DNS über HTTPS","Ein DNS-Server von Google","Ein Verschlüsselungsverfahren für Mails"],"Schützt Integrität, nicht Vertraulichkeit.","Gegen Mitlesen helfen DNS over HTTPS (DoH) oder DNS over TLS (DoT)."],["nd",3,"Was ist Port Security auf einem Switch?",["Ein Port lässt nur bestimmte bzw. eine begrenzte Zahl von MAC-Adressen zu","Ein Schloss am Switch","Eine Firewall auf Schicht 7","Ein verschlüsselter Port"],"Verhindert, dass fremde Geräte angeschlossen werden.","Bei Verstoß kann der Port abgeschaltet werden. Sicherer ist 802.1X."],["nd",3,"Was ist ein Native VLAN auf einem Trunk?",["Das VLAN, dessen Frames auf dem Trunk ungetaggt übertragen werden","Das VLAN mit der höchsten ID","Ein VLAN nur für WLAN","Ein gesperrtes VLAN"],"Standard ist meist VLAN 1.","Aus Sicherheitsgründen setzt man es auf ein ungenutztes VLAN (Schutz vor VLAN-Hopping)."],["cld",0,"Was bedeutet „Cloud“ im IT-Bereich?",["IT-Ressourcen wie Speicher oder Server werden über das Internet bereitgestellt","Ein Wetterdienst","Ein WLAN","Ein USB-Stick"],"Man nutzt Rechenleistung und Speicher eines Anbieters.","Beispiele: OneDrive, Google Drive, AWS."],["cld",1,"Was ist ein Cloud-Speicher?",["Online-Speicherplatz bei einem Anbieter, erreichbar von überall","Ein Ordner auf dem Desktop","Ein RAM-Riegel","Eine Festplatte im PC"],"Beispiele: OneDrive, Dropbox, Nextcloud.","Nextcloud kann man auch selbst hosten (z. B. im Homelab)."],["cld",3,"Was ist Serverless Computing?",["Code läuft auf Abruf, ohne dass man selbst Server verwalten muss","Es gibt keine Server mehr","Computer ohne Netzteil","Offline-Rechnen"],"Abrechnung pro Ausführung.","Beispiele: AWS Lambda, Azure Functions. Die Server gibt es natürlich – man sieht sie nur nicht."],["cld",3,"Was ist Egress-Traffic in der Cloud und warum ist er wichtig?",["Daten, die aus der Cloud heraus übertragen werden – oft kostenpflichtig","Daten, die hochgeladen werden","Ein Sicherheitsprotokoll","Ein Cloud-Anbieter"],"Hochladen ist meist kostenlos, Herunterladen oft nicht.","Hohe Egress-Kosten erschweren auch den Wechsel zu anderen Anbietern (Lock-in)."],["cld",3,"Was ist Object Storage (z. B. S3)?",["Speicher, der Daten als Objekte mit Metadaten über eine API ablegt","Ein RAM-Typ","Ein Dateisystem wie NTFS","Ein Backup-Band"],"Sehr skalierbar und günstig.","Ideal für Backups, Bilder, Logs. Zugriff per HTTP-API statt über Laufwerksbuchstaben."],["ds",0,"Wofür steht DSGVO?",["Datenschutz-Grundverordnung","Datensicherheits-Gesetz-Verordnung","Deutsche Server-Grundordnung","Digitale Sicherheits-Grundversorgung"],"EU-weite Verordnung zum Schutz personenbezogener Daten.","Gilt seit 25. Mai 2018."],["ds",0,"Ist eine E-Mail-Adresse wie tom.gross@firma.de ein personenbezogenes Datum?",["Ja, sie lässt sich einer Person zuordnen","Nein, niemals","Nur wenn ein Foto dabei ist","Nur bei Privatadressen"],"Name in der Adresse = eindeutig zuordenbar.","Auch info@firma.de kann personenbezogen sein, wenn nur eine Person dahintersteht."],["ds",0,"Was ist eine Datenpanne?",["Ein Vorfall, bei dem personenbezogene Daten verloren, gestohlen oder unbefugt offengelegt werden","Ein Druckerstau","Ein Stromausfall ohne Folgen","Ein Tippfehler"],"Beispiel: Laptop mit Kundendaten gestohlen, E-Mail mit offenem Verteiler.","Muss dokumentiert und ggf. innerhalb von 72 Stunden gemeldet werden."],["ds",3,"Was ist bei der Übermittlung personenbezogener Daten in die USA zu beachten?",["Es braucht eine Rechtsgrundlage wie das EU-US Data Privacy Framework oder Standardvertragsklauseln","Nichts, die USA gehören zur EU","Das ist grundsätzlich verboten","Nur eine mündliche Zusage"],"Drittlandübermittlung (Art. 44 ff. DSGVO).","Das frühere „Privacy Shield“ wurde 2020 vom EuGH gekippt (Schrems II). Seit 2023 gilt das Data Privacy Framework für zertifizierte Firmen."],["pm",3,"Ein Vorgang hat FAZ 5, Dauer 3 und SAZ 7. Wie groß ist der Gesamtpuffer?",["2","3","5","8"],"GP = SAZ − FAZ = 7 − 5 = 2.","Der Vorgang darf also 2 Zeiteinheiten später starten, ohne das Projektend function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(36)}
const ALL=[];const BYID={};
