function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(20260923);
const ri=(a,b)=>a+Math.floor(R()*(b-a+1));
const pick=a=>a[Math.floor(R()*a.length)];
const de=(n,d)=>Number(n).toLocaleString("de-DE",{maximumFractionDigits:d==null?2:d,minimumFractionDigits:d==null?0:d});
const bin8=n=>{const b=n.toString(2).padStart(8,"0");return b.slice(0,4)+" "+b.slice(4)};
const hx=n=>n.toString(16).toUpperCase();
function distinct(right,cands,fmt){const out=[];const seen=new Set([fmt(right)]);for(const c of cands){const f=fmt(c);if(c==null||Number.isNaN(c)||seen.has(f))continue;seen.add(f);out.push(f);if(out.length===3)break}
  let k=1;while(out.length<3){const c=typeof right==="number"?right+k*(k%2?1:-1)*Math.max(1,Math.round(Math.abs(right)*0.1)):null;k++;if(c==null)break;const f=fmt(c);if(!seen.has(f)&&c>=0){seen.add(f);out.push(f)}}
  return [fmt(right),...out]}
const ip2s=n=>[n>>>24,(n>>>16)&255,(n>>>8)&255,n&255].join(".");
const maskOf=p=>p===0?0:(0xFFFFFFFF<<(32-p))>>>0;

/* Ausführliche Erklärungen für Zahlensysteme-Aufgaben */
const HEXL=d=>d<10?String(d):`${hx(d)} (= ${d})`;
function xBin2Dec(n){const bits=n.toString(2).padStart(8,"0");const vals=[128,64,32,16,8,4,2,1];const parts=vals.filter((v,i)=>bits[i]==="1");
  return{e:`Zähle die Stellenwerte zusammen, an denen eine 1 steht: ${parts.join(" + ")} = ${n}`,
  d:`Idee: Jede Stelle einer Binärzahl hat einen festen Wert. Von rechts nach links verdoppelt er sich: 1, 2, 4, 8, 16, 32, 64, 128.\nSteht an einer Stelle eine 1, zählt ihr Wert. Steht dort eine 0, zählt er nicht.\n\nDeine Zahl ${bin8(n)}, Stelle für Stelle:\n${vals.map((v,i)=>`${v}er-Stelle: ${bits[i]}${bits[i]==="1"?"  → +"+v:""}`).join("\n")}\n\nZusammen: ${parts.join(" + ")} = ${n}\nTipp: Zähle von rechts, dann kannst du die Stellenwerte nicht verwechseln.`}}
function xDec2Bin(n){const vals=[128,64,32,16,8,4,2,1];let r=n;const lines=[];let bits="";vals.forEach(v=>{if(v<=r){lines.push(`${v} passt in ${r} → 1, Rest ${r} − ${v} = ${r-v}`);r-=v;bits+="1"}else{lines.push(`${v} passt nicht in ${r} → 0`);bits+="0"}});
  return{e:`${n} in Stellenwerte zerlegen: ${vals.filter((v,i)=>bits[i]==="1").join(" + ")} → ${bin8(n)}`,
  d:`Methode „Stellenwerte abziehen“: Gehe die Werte 128, 64, 32 … 1 von groß nach klein durch. Passt der Wert noch in deine Zahl, schreibst du eine 1 und ziehst ihn ab. Sonst eine 0.\n\n${lines.join("\n")}\n\nDie Einsen und Nullen von oben nach unten gelesen: ${bin8(n)}\nMerke: Kontrolle rückwärts – ${vals.filter((v,i)=>bits[i]==="1").join(" + ")} = ${n} ✓`}}
function xHex2Dec(n){const h=hx(n).padStart(2,"0");const hi=n>>4,lo=n&15;
  const letters=[hi,lo].filter(d=>d>9).map(d=>`${hx(d)} = ${d}`).join(", ");
  return{e:`${h[0]} steht an der 16er-Stelle, ${h[1]} an der 1er-Stelle${letters?` (${letters})`:""}: ${hi} × 16 + ${lo} = ${n}`,
  d:`Idee: Hexadezimal funktioniert wie das Dezimalsystem – nur hat jede Stelle den 16-fachen Wert der Stelle rechts daneben.\nBei zwei Stellen: linke Stelle = 16er, rechte Stelle = 1er.\n\nWeil es nur zehn normale Ziffern gibt, nimmt man ab 10 Buchstaben:\nA = 10, B = 11, C = 12, D = 13, E = 14, F = 15\n\nDeine Zahl 0x${h}:\nLinke Ziffer ${HEXL(hi)} an der 16er-Stelle → ${hi} × 16 = ${hi*16}\nRechte Ziffer ${HEXL(lo)} an der 1er-Stelle → ${lo} × 1 = ${lo}\nZusammen: ${hi*16} + ${lo} = ${n}\n\nBeispiel zum Vergleich: 0x10 = 1 × 16 + 0 = 16 und 0xFF = 15 × 16 + 15 = 255\nMerke: Das „0x“ vorne zeigt nur an, dass es eine Hex-Zahl ist.`}}
function xDec2Hex(n){const hi=n>>4,lo=n&15;const res="0x"+hx(n).padStart(2,"0");
  return{e:`${hi} × 16 = ${hi*16} passt in ${n}, Rest ${lo} → ${hx(hi)} und ${hx(lo)} → ${res}`,
  d:`Idee: Wie oft passt 16 in die Zahl? Das ergibt die linke Ziffer. Was übrig bleibt, ist die rechte Ziffer.\n\n16er-Reihe: 16, 32, 48, 64, 80, 96, 112, 128, 144, 160, 176, 192, 208, 224, 240\n\nDeine Zahl ${n}:\nDie größte passende Zahl der 16er-Reihe ist ${hi*16} = ${hi} × 16${hi<15?` (${(hi+1)*16} wäre schon zu viel)`:""}\nLinke Ziffer: ${HEXL(hi)}\nRest: ${n} − ${hi*16} = ${lo} → rechte Ziffer: ${HEXL(lo)}\n\nErgebnis: ${res}\nMerke: Zahlen über 9 werden zu Buchstaben: 10 = A, 11 = B, 12 = C, 13 = D, 14 = E, 15 = F\nTipp: Kontrolle rückwärts – ${hi} × 16 + ${lo} = ${n} ✓`}}
function xBin2Hex(n){const b=n.toString(2).padStart(8,"0");const hi=n>>4,lo=n&15;const res="0x"+hx(n).padStart(2,"0");
  const sum=s=>[8,4,2,1].filter((v,i)=>s[i]==="1");const sh=sum(b.slice(0,4)),sl=sum(b.slice(4));
  return{e:`${b.slice(0,4)} = ${hi} = ${hx(hi)} und ${b.slice(4)} = ${lo} = ${hx(lo)} → ${res}`,
  d:`Trick: Eine Hex-Ziffer entspricht genau 4 Bit. Du teilst die 8 Bit in zwei Hälften und rechnest jede Hälfte einzeln aus – mit den Stellenwerten 8 · 4 · 2 · 1.\n\nLinke Hälfte ${b.slice(0,4)}: ${sh.length?sh.join(" + ")+" = "+hi:"0"} → ${HEXL(hi)}\nRechte Hälfte ${b.slice(4)}: ${sl.length?sl.join(" + ")+" = "+lo:"0"} → ${HEXL(lo)}\n\nErgebnis: ${res}\nMerke: Häufige Muster – 1000 = 8, 1010 = A, 1100 = C, 1111 = F`}}
